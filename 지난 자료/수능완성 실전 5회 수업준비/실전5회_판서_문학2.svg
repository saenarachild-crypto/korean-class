<svg viewBox="0 0 1640 900" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Pen Script','Gaegu',cursive" style="width:100%;height:auto;display:block;border-radius:14px;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#164531"/><stop offset="1" stop-color="#0f3324"/></linearGradient></defs><rect x="0" y="0" width="1640" height="900" rx="18" fill="url(#bg)"/><rect x="10" y="10" width="1620" height="880" rx="12" fill="none" stroke="#3a5a48" stroke-width="8"/><text x="820.0" y="78" fill="#ffe486" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">🌫️ 세 작품 : 갈 수 없는 곳을 향한 그리움</text><line x1="440.0" y1="96" x2="1200.0" y2="96" stroke="#ffe486" stroke-width="3" stroke-linecap="round"/><path d="M420.0,70 Q280.0,150 240.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><path d="M1220.0,70 Q1360.0,150 1400.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><rect x="90" y="200" width="470" height="570" rx="20" fill="none" stroke="#ff9db2" stroke-width="3"/><text x="325.0" y="248" fill="#ff9db2" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">(가) 삼수갑산</text><text x="116" y="300" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">김소월 · 현대시</text><text x="116" y="352" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">대상 : 고향·임</text><text x="116" y="404" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">삼수갑산에 &#x27;갇힘&#x27;</text><text x="116" y="456" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 불귀(不歸)의 절망</text><text x="116" y="508" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">방언·반복·감탄</text><text x="116" y="560" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">(&#x27;아아 / 아하하&#x27;)</text><rect x="585" y="200" width="470" height="570" rx="20" fill="none" stroke="#9ad8ff" stroke-width="3"/><text x="820.0" y="248" fill="#9ad8ff" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">(나) 이별가</text><text x="611" y="300" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">박목월 · 현대시</text><text x="611" y="352" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">대상 : 죽은 이</text><text x="611" y="404" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">&#x27;강&#x27; = 생사의 경계</text><text x="611" y="456" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 죽음 넘는 인연 의지</text><text x="611" y="508" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">&#x27;뭐락카노&#x27; 반복</text><text x="611" y="560" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">방언·&#x27;오냐 오냐&#x27;</text><rect x="1080" y="200" width="470" height="570" rx="20" fill="none" stroke="#a8e6a1" stroke-width="3"/><text x="1315.0" y="248" fill="#a8e6a1" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">(다) 만분가</text><text x="1106" y="300" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">조위 · 유배 가사</text><text x="1106" y="352" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">대상 : 임금(하늘)</text><text x="1106" y="404" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">무오사화로 유배</text><text x="1106" y="456" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 연군·억울함 호소</text><text x="1106" y="508" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">고사(진채지액 등)</text><text x="1106" y="560" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">환생 모티프(만장송·학)</text><rect x="430" y="790" width="780" height="70" rx="16" fill="none" stroke="#ffe486" stroke-width="3"/><text x="820" y="837" fill="#ffe486" font-size="29" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">공통 : 단절 + 반복을 통한 정서 심화</text></svg>