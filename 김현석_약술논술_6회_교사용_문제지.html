.navwrap {

    transition: 0.15s;
}
.nav:hover {

    color: #fff;
    border-color: #7c2c3e;
}

.q {

    color: #7c2c3e;
    background: #fcf1f3;
    padding: 2px 14px;
    border-radius: 12px;
    border: 1px solid #ebd2d7;
}
.tag {
    font-size: 11.5px;
    background: #f5ecee;
    color: #7c2c3e;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 800;
}
.pts {
    margin-left: auto;
    font-size: 13px;
    font-weight: 800;
    color: #9c6875;
}
.src {
    flex: 1 1 100%;
    font-size: 11.5px;
    color: #8c737a;
    margin-top: 2px;
}

.passage-wrap { position: relative; margin-bottom: 14px; }
.passage {
    font-family: 'Times New Roman', 'Noto Serif KR', 'Apple SD Gothic Neo', serif;

}
.passage p { margin-bottom: 10px; }
.passage p:last-child { margin-bottom: 0; }

.teacher-underline {
    background-color: #fee2e2;
    border-bottom: 2.5px solid #dc2626;
    padding: 2px 4px;
    border-radius: 4px;
    font-weight: 600;
    color: #7f1d1d;

    line-height: 1.8;

.teacher-underline.teacher-q2 {

.badge-ans {

    color: #991b1b;
}

}

.pmore {

    font-weight: 900;

}
.ans-box-filled .icon-check {

}

.sol .s {

.footer-note {

}

  "passage": "사회자: 최근 인간 고유의 영역이라 믿었던 문화 예술 분야에서 AI에 의한 창작 사례가 급증하고 있습니다. 고흐나 렘브란트 화풍을 그대로 따라 하는 AI 미술가가 등장하고 비틀스 스타일로 작곡하는 AI도 등장했습니다. 어떤 AI 화가가 그린 29점의 작품이 미술 경매에서 총 9만 7,000달러에 판매되기도 하였으며, AI에게 13만여 점의 근현대\n[A]\n미술 작품을 학습시켜 만든 영상 설치 작품이 뉴욕 현대 미술관에 전시됐다는 소식도\n들려오고 있습니다. 이처럼 창의력과 상상력을 필요로 하는 분야에서 AI가 두각을 나\n타내고 있는데요. 그래서 오늘은 ‘AI도 예술가로 인정해야 한다.’라는 논제로 토론\n을 하겠습니다. 먼저 찬성 측이 입론해 주십시오.\n찬성 1: 예술의 어원을 보면 ‘예’와 ‘술’에는 과제를 능숙하게 해결할 수 있는 실행 방도로서의 기술이라는 의미가 들어 있습니다. 또한 예술에 해당하는 고대 그리스어 테크네[tĕchnē], 라틴어 아르스(ars), 영어 아트(art), 독일어 쿤스트(Kunst), 프랑스어 아르(art) 등도 일반적으로 일정한 과제를 해결해 낼 수 있는 숙련된 능력 또는 활동으로서의 ‘기술’을 의미하였던 말로, ‘수공(手工)’ 또는 ‘효용적 기술’의 의미를 포괄한 말이었습니다. 예술을 이렇게 본다면 숙련된 기술을 구사할 수 있는 존재로 AI만 한 존재는 없습니다.\n또한 인공 신경망 구조를 지닌 어떤 AI는 1,119명의 화가가 그린 8만 1,449개 작품을 학습한 후, 자신이 필요하다고 느낀 방식을 사용해 다른 어떤 유파에도 속하지 않은 그림을 그려 낸다고 합니다. 이 AI는 다른 작품이 사용한 기법, 스타일 등을 똑같이 모방하지 않도록 프로그래밍되어 있기 때문에 기존에 존재하는 그림들과 각 그림의 스타일 분류 정보를 학습 데이터로 사용하여, 새로운 예술 스타일을 창조해 냅니다. 그야말로 독창적인 작품이 되는 것입니다.\n한편 한 논문에 따르면 그림을 구별하는 실험에서 참가자들이, 사람이 그린 그림과 인공 지능이 생성한 그림을 구별하지 못했던 경우가 있었다고 합니다. 또 뉴욕 크리스티 경매에서는 AI가 창작한 그림이 최초로 경매에 나와, 고가에 낙찰되는 일도 있었습니다. 이 작품은 프랑스의 연구자들이 개발한 AI 화가 ‘오비어스’가 그린 것으로, 그림의 오른쪽 아래에는 화가의 서명 대신 작품 생성 알고리즘이 적혀 있습니다. 오비어스는 14세기부터 20세기까지의 서양화 1만 5,000여 작품을 데이터베이스로 하여 이미지를 분석하고 초상화의 구성 요소를 학습한 뒤 창작을 해냈다고 합니다. 이처럼 AI가 만든 작품이 지닌 기술의 숙련도, 독창성, 인간이 창작한 것과 구별이 안 될 정도로 뛰어난 작품성 등을 볼 때 AI도 예술가로 인정해야 합니다.\n사회자: 이어서 반대 측에서 반대 신문해 주십시오.\n반대 2: AI가 그림을 그리기 전에 학습하는 데이터들은 인간이 제공하는 것 아닌가요? 그렇다면 AI는 창작의 보조 도구일 뿐이고 창작자, 즉 예술가는 인간 아닐까요?\n찬성 1: 인간 화가들도 다른 작가의 작품을 다양한 경로로 보고 배우면서 자신만의 독특한 스타일을 만드는데, AI 역시 이와 다르지 않습니다.\n반대 2: 한 논문에 따르면 실험 참가자들이 사람이 그린 그림과 AI가 창작한 그림을 구분하지 못했던 경우가 있다고 했는데, 구체적으로 어떤 논문일까요? 실험에 참가한 사람들의 수와 특성은 대표성이 있다고 할 수 있을까요?\n찬성 1: ○○ AI 연구팀의 논문입니다. 실험 참가자의 대표성은 확인하지 못했습니다.\n사회자: 이번에는 반대 측 입론해 주십시오.\n반대 1: 예술은 인간이 미적으로 가치 있는 것을 만들어 내고자 하는 의도를 가지고, 소재를 가공하여 결과물을 만드는 활동입니다. 한 철학가는 예술미는 인간의 정신에 의해서 창조된 미이며, 자연의 언어와 달리 예술의 언어는 인간에게 의미 있게 말을 거는 요구가 많은 언어이면서도 인간의 마음을 구속하지 않고 오히려 인식 능력들의 놀이를 위해 자유의 놀이 공간을 열어 놓는다고 말하기도 했습니다.\n이처럼 예술은 미적으로 가치 있는 것을 만들기 위한 인간의 의도가 반영된 것이며, 그러하기에 예술은 인간의 인식을 고양시켜 사람들에게 감동을 주는 활동입니다. 이러한 예술의 정의로 볼 때, AI가 딥 러닝을 통해 아직까지 존재하지 않았던 작품을 만들어 낸다 해도 이는 계산과 학습에 의한 것으로, 미적으로 가치 있는 결과물을 만들고자 하는 주체의 의도가 없기에 AI를 예술가로 인정할 수 없습니다. AI는 도구이지 예술가가 아닙니다. 과학 기술의 발전은 예술의 새로운 길을 열어 준 것이 분명합니다. 원근법의 발명은 2차원의 평면에 공간감과 깊이감을 부여했으며, 카메라의 발명은 회화만이 할 수 있는 또 다른 새로운 길을 찾게 만들었습니다. 다시 말하자면, 과학 기술의 발전은 예술의 국면, 영역을 확장시키거나 변화시키는 역할을 하는 것이지 그 자체가 예술인 것은 아닙니다.\nAI가 만든 작품들은 인간의 명령과 학습 시스템에 의해 생성된 것으로, 이때 AI는 작품의 기술적 완성도를 높여 주는 역할을 합니다. 즉 AI는 인간이 예술미를 추구하는 과정에서 사용할 수 있는 도구의 하나입니다. 또한 인간의 예술은 창작자가 겪은 경험과 이를 통해 발생한 감정, 사회적 맥락을 반영하는 활동입니다.\n하지만 AI는 인간적인 경험을 겪지 않으며 감정을 느낄 수 없기에, 자기 고유의 힘과 개성에 입각하여 새로운 것을 만들어 내는 독창성·창의성을 가질 수 없습니다. 따라서 AI가 만든 작품은 본질적으로 인간 예술과 다를 수밖에 없기 때문에, AI를 예술가로 인정할 수 없습니다.\n사회자: 이어서 찬성 측에서 반대 신문해 주십시오.\n찬성 1: 인간 예술가들도 예술적 성취를 위해서 다른 예술 작품들을 학습합니다. 그렇다면 AI가 학습을 통해 작품을 창작한다고 하더라도 예술가가 될 수 있지 않을까요?\n반대 1: AI가 스스로의 의도를 가지고 작품을 창작하는 것은 아니기 때문에 예술가로 보기 어렵습니다.\n찬성 1: 유발 하라리는 ‘창의력은 어떤 아이디어를 이루는 패턴을 파악한 뒤 작은 단위로 분해해 새롭게 조합하는 능력인데, 이는 AI가 가장 잘하는 방식’이라고 언급했습니다. 이에 따르면 예술의 조건으로서의 독창성·창의성은 AI가 잘하는 영역 아닐까요?\n반대 1: 예술의 가치는 창작자의 내면적 고뇌가 창의적으로 표현된 작품을 통해 감상자를 감동시키는데 있다고 할 수 있습니다. AI는 구체적이고 직접적인 경험이 불가능하여 경험에서 발생하는 감정을 이해할 수 없습니다. 그저 데이터를 분석하고 생성하는 알고리즘에 의해 결과물을 산출하는 것뿐입니다. 따라서 AI가 생성한 작품은 자기 고유의 힘과 개성에 입각하여 새로운 것을 만들어 내는 독창성· 창의성이 없으며, 창작자의 고뇌와 성찰이 드러나지 않기에 감상자의 내면을 심화·확장하여 감동을 주기 어렵습니다.",
  "prompt": "<보기>는 토론에 나타난 말하기 방식을 정리한 것이다. <보기>의 ①, ②에 해당하는 발화를 제시문에서 찾아 각각의 첫 어절과 마지막 어절을 순서대로 쓰시오.",

  "passage": "지원자: 안녕하십니까? 지원자 김○○입니다.\n면접관: 안녕하세요? 아시아 지역 사회 혁신을 위한 국제 자원봉사단 ‘나누리’에 지원해 주셔서 감사합니다. 오늘 면접에서는 사전에 진행 순서에 대해 공지한 바와 같이 공통 질문이 먼저 제시될 겁니다. 그리고 이어서 제출하신 자기소개서를 바탕으로 추가 질문을 드리겠습니다.\n지원자: 네, 알겠습니다.\n면접관: 그럼 질문을 시작하겠습니다. ‘나누리’에 지원한 이유가 무엇인가요?\n지원자: 저의 꿈은 빈곤과 전쟁, 예기치 못한 재난 속에서도 희망을 잃지 않으려 애쓰는 사람들을 돕는 국제 구호 활동가가 되는 것입니다. ‘나누리’는 아시아 지역 사회 사람들과 직접 만나 연대하며, 지속 가능한 발전을 함께 이끌어 가는 데 그 목적을 둔다고 알고 있습니다. 거기에 저도 작은 힘이나마 보태고 싶다는 마음으로 지원하게 되었습니다. 아울러 이번 봉사 활동이 장차 국제 구호 활동가로서 활동하는 데 필요한 역량을 기를 수 있는 좋은 기회라고 생각했습니다.\n면접관: 국제 구호 활동가라니, 멋진 꿈을 가지고 계시군요. 지원자님의 진로에 필요한 역량을 키울 수 있다는 점 때문에 ‘나누리’에 지원하게 되었다는 말씀 같은데, 맞나요?\n지원자: 네, 맞습니다.\n면접관: 다음 질문을 드리겠습니다. 국제 자원봉사가 다른 봉사와 다른 점은 무엇이라고 생각하시나요?\n지원자: 국제 자원봉사는 정치적, 종교적 장벽을 뛰어넘어 서로 협력하며 국제 사회의 변화를 이끌어 내는 활동입니다. 봉사를 통해 서로 다른 문화를 가진 사람들과 만나 국제적인 연대감을 형성할 수 있고, 봉사국과 수혜국 간의 상호 이해와 존중의 기회가 마련됨으로써 세계 평화의 실현에 기여할 수 있다는 것이 다른 봉사와 차별화되는 점이라고 생각합니다.\n면접관: 마지막 공통 질문입니다. 지원자님이 ‘나누리’ 활동에서 기대하는 바는 무엇인가요?\n지원자: 저는 ‘나누리’ 활동이 개인적으로는 다른 문화를 경험하며 견문을 넓히고 성장할 수 있는 시간이 될 것이라고 생각합니다. 또한 제가 파견될 아시아 국가의 지역 사회에 긍정적인 변화를 이끌어 내고 지역 주민들이 자립할 수 있는 기반을 마련하는 데 도움이 될 수 있기를 기대하고 있습니다.\n면접관: 좋은 답변 감사합니다. 이어서 제출하신 자기소개서의 내용과 관련한 질문을 드리도록 하겠습니다. 지원자님은 작년부터 교내 봉사 동아리에서 활동하며 여러 봉사 활동을 해 왔는데요. 그동안 동아리에서 진행한 봉사 활동 중에서 특별히 기억에 남는 것이 있다면 무엇인가요?\n지원자: 제가 거주하는 ◇◇동 주민들과 함께 홀로 지내시며 경제적으로 어려움을 겪고 계신 어르신들을 찾아뵙고, 직접 만든 도시락과 여름나기 꾸러미를 나누어 드린 활동이 가장 기억에 남습니다. 비록 서툴렀지만, 저희 손으로 정성껏 재료를 준비하고 조리해 포장한 도시락과 인견이불, 벌레 퇴치 약, 얼음 목도리 등 무더운 여름을 이겨 내는 데 도움이 될 만한 물품을 담은 꾸러미를 전달했는데요. 안부를 여쭙고 말벗이 되어 드리며 어르신들과 함께한 시간은 저에게도 소중하고 행복한 추억이 되었습니다. 게다가 제가 직접 기획한 활동이라 더욱 뿌듯했습니다.\n면접관: 지역 주민들과 협력하여 지역 사회의 문제를 해결하기 위한 봉사 활동을 기획하고 실천한 점이 정말 대단하네요. 그렇다면 지원자님의 동아리 활동 경험을 바탕으로 본인이 ‘나누리’내에서 어떤 역할을 담당할 수 있다고 생각하시나요?\n지원자: 저는 교내 봉사 동아리의 회장으로서 부원들을 이끌며 사회적 약자를 돕기 위한 다양한 봉사 활동을 하고 있습니다. 지난 2월에는 그동안의 성과를 인정받아 ★★시 청소년 자원봉사 대회에서 우수 동아리로 선정되기도 했습니다. 이러한 경험을 바탕으로 봉사단 내에서 아시아 지역 사회 혁신을 위한 다양한 캠페인 활동을 기획하고 주도적으로 이끄는 리더의 역할을 해낼 수 있을 것이라고 생각합니다.\n면접관: 좋습니다. 다음 질문입니다. 지원자님은 파견 희망 국가 중 1순위로 인도네시아를 꼽으셨는데요. 그 이유가 궁금합니다.\n지원자: 저는 작년에 ‘나누리’가 베트남 루피 마을에서 진행한 직업 멘토링처럼, 지속 가능한 발전을 위한 캠페인 활동에 가장 관심이 많습니다. 인도네시아는 서구 열강의 오랜 식민 지배와 내전으로 인한 아픈 역사를 지녔지만, 젊은 세대의 우수한 노동력을 바탕으로 과거의 상처를 극복하며 빠른 경제 성장을 이루어 내고 있습니다. 반면, 오랜 외침과 내전을 겪은 노년층 대다수는 여전히 경제적 빈곤과 정신적 상처 속에 살아가고 있습니다. 저는 ‘나누리’에 지원하기로 결심한 후, 봉사단이 협력을 맺고 있는 아시아 국가들에 대해 알아보던 중 특히 인도네시아의 노인들이 빈곤을 극복하고 건강한 삶을 살아갈 수 있도록 돕는 캠페인을 직접 기획하고 싶다는 생각을 하게 되었습니다.\n면접관: 우리 봉사단에서 진행하는 활동에 대해서 잘 알고 계시네요. 그럼 지원자님의 답변을 토대로 조금 더 구체적인 질문을 드리겠습니다. 지원자님이 ‘나누리’의 단원으로 선발되어 인도네시아의 지속 가능한 발전을 위한 캠페인 활동에 참여하게 된다면, 어떤 프로그램을 기획하여 진행할 것인지 구상한 것이 있으신가요?\n지원자: 네, 두 가지 프로그램을 생각해 보았습니다. 첫째는 인도네시아 노인층을 대상으로 무료 사진 촬영을 해 드리는 활동입니다. 인도네시아는 지방 자치 단체별로 시민 사회단체를 중심으로 한 노인 돌봄 시스템이 운영되고 있는 것으로 알고 있습니다. ‘나누리’ 단원들이 시민 사회단체 소속 자원봉사자들과 함께 지역 주민 가정을 방문해 독사진이나 가족사진을 촬영해 드리고, 짧은 상담도 함께 진행하고자 합니다.\n이러한 활동이 외로움과 슬픔을 겪는 어르신들의 마음에 작은 위로가 되기를 바랍니다. 둘째는 인도네시아의 고등학교에서 학생 및 학부모를 대상으로 질병, 빈곤, 분쟁 등 인류 공동의 과제 해결을 위한 국제적 목표인 유엔의 ‘지속 가능 발전 목표(SDGs)’를 알리는 캠페인입니다. 교육과 더불어 목표를 실천하기 위한 방안에 대해 학생들과 함께 논의하는 활동을 함으로써 더 많은 이들이 문제에 관심을 갖고 참여할 수 있도록 돕고 싶습니다.\n면접관: 좋은 아이디어입니다만, 봉사 활동 지역에 따라 지역 주민들과의 의사소통이 원활하게 이루어지지 못할 수 있어 두 번째 활동은 진행이 쉽지 않을 것 같습니다. 인도네시아는 공식 언어인 인도네시아어 이외에도 700개 이상의 지역 방언이 존재하며, 공식 언어와 지역 방언의 차이로 인해 인도네시아 내에서도 의사소통이 어려운 경우가 많습니다. 대도시가 아닌 지역의 주민들 대다수는 영어를 구사하지 못한다는 점도 고려해야 하는데, 이런 문제들은 어떻게 극복할 생각이신가요?\n지원자: 앗, 죄송합니다. 인도네시아의 현지 상황까지는 구체적으로 조사하지 못하여 그 부분에 대해서 알지 못했습니다. 만약 인도네시아 학생들이나 학부모를 대상으로 봉사 활동을 진행할 기회가 생긴다면, 언어의 장벽을 극복하기 위해 영상이나 그림 자료를 최대한 활용하는 방안을 고민해 보겠습니다. 아직은 미흡한 계획이지만, 제가 ‘나누리’ 단원으로 선발된다면 말씀해 주신 부분들을 고려하여 차질없이 캠페인 활동이 진행될 수 있도록 활동 계획을 구체적으로 다듬어 나가겠습니다.",

  "passage": "(가)는 미술 시간에 이루어진 학생의 발표이고, (나)는 (가)의 발표 이후 추가 조사를 하고 발표를 돌아보기 위해 작성한 글이다. 물음에 답하시오.\n(가)\n여러분, 각 층 복도에 지난달 ○○숲 공원에서 진행된 교내 사생 대회 수상작이 전시되어 있는데 보신 분 손들어 주실 수 있을까요? (청중의 반응을 확인한 후) 네, 모두 보셨군요. 복도를 오가다 잠깐 발걸음을 멈추고 ○○숲의 전경을 그린 풍경화를 보고 있으니 마치 숲속에 있는 것처럼 답답했던 마음이 탁 트이는 느낌이 들었습니다.\n그런데 여러분은 풍경화가 언제부터 그려지기 시작했는지 아시나요? (청중의 대답을 듣고) 네, 대부분 풍경화의 역사가 아주 오래되었다고 생각하시는군요. 놀랍게도 자연의 아름다움을 담아내는 풍경화가 회화의 독자적인 장르로 자리 잡은 것은 17세기 네덜란드 미술에서였습니다. 저는 오늘 자유주제 발표 활동으로 17세기 네덜란드의 풍경화에 대해 이야기하고자 합니다. 이전에는 역사화에서 인물을 위한 배경으로만 풍경이 그려졌으나, 17세기 네덜란드에서는 풍경을 독립적인 주제로 내세운 풍경화가 회화의 중심적인 장르로 자리 잡습니다. 이는 네덜란드에서 무역과 해운업으로 거대한 부를 축적하며 새롭게 사회의 지배 세력으로 떠오른 시민 계층이 미술 작품의 주요 구매층으로 등장하게 된 배경과 관련이 깊습니다. 역사화를 선호했던 기존의 전통 귀족 계층이 몰락하며 시민 계층의 기호에 부합하는 그림들이 인기를 누리게 된 것이지요.\n낮은 지대를 대규모의 간척 사업으로 개간한 네덜란드의 국토 개발은 시민 계층의 투자를 통해 이루어졌고, 네덜란드를 대표하는 풍차, 운하, 평야 등이 모두 그들의 투자와 생산 활동에 의해 창조되었습니다. 그들은 자신들이 이룩한 도시와 근교의 아름다움을 찬미하고 국토에 대한 자부심을 담은 풍경화를 선호했으며 이러한 애호를 바탕으로 네덜란드에서 풍경화가 큰 인기를 누리게 된 것입니다. 17세기 네덜란드 풍경화는 사실주의적 화풍을 드러냈다는 점에서 중요한 미술사적 의의를 지닙니다. 1600년 초, 네덜란드의 화가 얀 반 호이엔은 낮은 지대의 평탄한 자연 경관을 회색이나 고동색의 단색 조를 사용해 사실적으로 재현하며 17세기 전반에 걸쳐 단색조 풍경화의 발전을 이끌었습니다. (그림을 제시하며) 보시는 바와 같이 그의 작품은 대부분 화면 전체적으로 회색이나 고동색을 띠고 있으며 그 당시 있었던 건물의 형태도 구체적으로 묘사되어 있습니다.\n또한 지평선을 낮게 설정하고 구름 가득한 하늘이 화면의 3분의 2 이상을 차지하는 구성을 통해 무한한 공간감을 창출하며 네덜란드 자연주의 풍경화의 한 전형을 이루었지요. 17세기 네덜란드 풍경화의 명성을 한층 더 높인 화가는 야코프 반 로이 스달인데요. (그림을 제시하며) 이렇게 근경에 풍차를 배치한 대각선의 개방형 구도를 활용하여 구름 낀 하늘 아래 광활하게 펼쳐진 낮은 대지를 그렸습니다. 당시 흔히 볼 수 있었을 네덜란드의 지형적 특성을 세심하게 묘사한 그의 작품들은 17세기 네덜란드 풍경화들의 사실성을 증명하는 대표적인 예라고 할 수 있습니다. 미술사가 곰브리치는 네덜란드 풍경화를 ‘자연의 거울’이라는 말로 표현하기도했지요. 17세기 네덜란드의 풍경화는 실제 있는 현실을 묘사했다는 점에서 서양 미술사에서 특별한 의미를 지닙니다. 이전의 화가들은 그림을 그릴 때 자연을 직접 관찰해서 표현하지 않았으며, 화집에 저장된 이미지를 사용해 그림을 그렸습니다.\n그러나 네덜란드 풍경화가들은 현실 풍경을 직접 관찰하고, 야외에서 직접 사생한 밑그림을 바탕으로 그림을 완성했습니다. 사실에 충실하고 대상을 이상화하지 않은, 실제 풍경을 충실히 재현한 풍경화였지요.\n이처럼 기존의 상징적이고, 공상적인 풍경에서 ‘사실의 풍경’으로 바꾸어 감상자로 하여금 현실 경치의 아름다움에 눈뜨게 했다는 점에서 17세기 네덜란드 풍경화는 미술사적으로 중요한 가치를 지닌다고 할 수 있습니다. 오늘 주제 발표를 통해 17세기 네덜란드 풍경화에 대해 이야기한 내용이 잘 이해가 되셨는지요? (청중의 반응을 살피며) 그럼, 이제부터 발표 내용에 대해 궁금한 점이 있으시면 질문해 주시기 바랍니다.\n(나)\n지난 미술 수업 시간에 17세기 네덜란드 풍경화를 주제로 발표를 했다. 풍경화가 17세기 네덜란드 미술에서 회화의 독자적인 장르로 성립된 배경을 미술 수요자 측면에서 설명했는데, 더 조사해 보니 네덜란드에서 성상 숭배를 엄격히 금하는 개신교가 국교로 인정받으며 교회를 장식하기 위한 종교화가 허용되지 않게 된 것과도 관련이 있음을 알 수 있었다. 네덜란드 개신교의 지도자 칼뱅은 “화가는 오로지 눈으로 볼 수 있는 것만을 그려야 한다.”라고 말했다.\n이에 따라 화가들이 눈에 보이는 세속적인 제재의 그림으로 돌파구를 찾음으로써 유럽 최초로 네덜란드 화가들이 독립된 장르로서의 풍경화의 역사를 세우며 서양 회화사의 새로운 장을 열게 된 것이다. 발표에서는 17세기 네덜란드 풍경화의 중요한 특징을 사실성이라고 설명했다. 그런데 관찰을 기반으로 그려진 네덜란드 풍경화의 사실성을 ‘조작된 사실주의’라고 말하며 비판적 시각으로 보는 관점도 있어 놀라웠다.\n이러한 관점은 다수의 풍경화에서, 실제 풍경과는 달리 그림 속에서 건축물의 위치를 자유로이 옮기는 등 자연 경관에 부분적으로 첨삭을 가해 편집, 조작했다는 점을 근거로 들고 있었다. “눈앞에 존재하는 대상을 보고 그것의 겉모습만을 따와 사실적인 묘사에 치중했다.”라는 해석은 네덜란드 풍경화에 정확하게 들어맞는 설명이 아닐 수 있다는 생각이 들었다. 어떤 미술사학자는 17세기 네덜란드 풍경화에서 부분을 짜맞추어 하나의 이미지로 조작하는 경우가 빈번한 이유를 네덜란드의 국가 정체성을 강화하기 위한 의도와 연결 지어 설명하고 있어 흥미로웠다. 당시 네덜란드에는 국토 개간 사업으로 인해 격자무늬로 규격화된 땅이 대부분이었다.\n그러나 반 호이엔이나 반로이스달의 풍경화에서 격자무늬의 땅은 찾아볼 수 없으며, 그림 속에 묘사된 땅은 고대부터 있었던 것 같은 자연스러운 모습을 하고 있다. 이는 인위적으로 만들어진 국토에 전통과 역사를 부여하기 위해 화가들이 땅의 이미지를 조작한 결과라는 것이다. 그 견해를 접하고 나니 네덜란드 풍경화에 풍차나 운하가 자주 등장하는 것도 네덜란드의 정체성을 적극적으로 담아내기 위함일 것이라는 생각도 들었다. 발표를 할 때는 17세기 네덜란드 풍경화가 주변의 자연환경 자체에 대한 본격적인 관심의 표출이며, 실경을 그린 사실주의적인 성격으로 돋보인다는 점을 강조했는데, 발표 이후 다른 자료들을 접하면서 17세기 네덜란드 풍경화가 보여 주는 사실적 표현의 이면에 숨은 의도가 있음을 깨달았다. 특히 왜 당대 네덜란드인들에게 풍경화라는 장르가 정체성 규명에 중요한 수단이었는지를 네덜란드의 국토에 대한 역사를 통해 설명할 수 있다는 것을 알게 되어 매우 의미 있었다.",

  "passage": "(가)는 학생이 작성한 보고서의 초안이고, (나)는 (가)를 수정하기 위한 학생들의 대화이다. 물음에 답하시오.\n(가)\n도시 농업의 개념과 지역 내 현황 조사\n1. 조사 배경과 목적\n기후 변화로 식량 재배 및 부족 문제가 심화되면서 ‘지속 가능한 산업’의 필요성이 보다 강조되고 있다. 이와 관련하여 우리 모둠은 도시 공간에서 실천 가능한, 지속 가능한 산업 중 하나인 ‘도시 농업’에 주목하여 그 개념과 현황을 조사하였다.\n2. 조사 방법\n(1) 문헌 조사\n- 조사 대상: 도시 농업 관련 보고서, 타 지자체의 사례\n- 목적: 도시 농업의 개념 및 지역 내 현황 파악\n(2) 설문 조사\n- 응답 인원: ○○고등학교 2학년 학생 전체(200명)\n- 목적: 도시 농업에 대한 학생들의 인식과 참여 경험 파악\n(3) 면담 및 현장 답사\n- 면담 대상: ◇◇ 도시 농업 협동조합 꽃사랑 농장 대표\n- 목적: 지역 도시 농업 현황과 가치 및 어려움 파악\n3. 조사 결과\n(1) 도시 농업의 개념\n도시 농업이란 도시나 도시 인접 지역에서 이루어지는 농업 활동을 말하며, 생업 농업과 생활 농업으로 구분된다. 생업 농업은 직업적 농업인에 의해 이루어지는 산업형 농업이고, 생활 농업은 텃밭 가꾸기, 학교 농장 등 여가, 교육, 체험을 목적으로 하는 농업을 말한다. 최근에는 두 유형이 융합되어, 생활 농업 참여자들이 수확물을 지역 먹거리 직매장에 판매해 수익을 창출하기도 한다. 도시 농업은 식량 생산뿐만 아니라, 건강 증진, 정서 안정, 공동체 형성, 생태 교육 등의 가치가 있기에 지속 가능한 도시를 위한 수단으로 주목받고 있다. (2) 우리 지역 도시 농업의 현황 우리 지역에서는 주로 생활 농업 중심의 활동이 이루어지고 있다. 특히 ‘꽃사랑 농장’은 지역 내 가장 활발한 생활 농업 사례로, 20여 가구가 참여하는 공동 텃밭 형태로 운영되고 있다. 상추, 고추 등 다양한 채소를 재배하고, 수확물 중 일부는 지역 먹거리 직매장에 판매한다.\n또한 고등학교 세 곳에서는 교육 목적으로 학교 텃밭을 운영하고 있으며, □□기업 등 많은 사업체에서도 여가 목적의 옥상 텃밭을 운영하고 있다. 반면 생업 농업은 도심 외곽의 몇몇 농가에서 화훼와 친환경 채소 재배 중심으로 운영하고 있지만, 생활 농업에 비해 상대적으로 규모가 적은 편이다.\n이처럼 우리 지역의 도시 농업은 생활 농업 중심으로 자리 잡고 있으며, 주민들의 높은 관심 속에서 건강한 여가 활동, 지역 공동체 활성화, 생태 교육의 수단으로 활용되고 있다. (3) 도시 농업의 가치와 어려움 도시 농업은 다양한 기능을 수행하기 때문에 가치가 높다.\n먼저 정서적 측면에서, 도시 농업은 농업 활동을 통해 스트레스를 줄일 수 있도록 돕는다. 아울러 도시 농업은 다양한 사람이 모여 소통할 수 있게 한다는 점에서 공동체적 가치 또한 높다. 또한 도시 농업은 청소년의 생태 감수성을 기를 수 있다는 점에서 교육적 가치가 높다. 특히 도시 농업을 경험한 학생들은 환경에 대한 인식뿐 아니라 책임감과 협업 능력 또한 자연스럽게 익힐 수 있다고 말했다.\n그러나 이러한 가치에도 불구하고, 여러 제약으로 인해 도시 농업 활성화에는 어려움이 존재한다. 먼저 인식 부족으로 인한 어려움이 있다. 도시 농업은 일반 시민들에게 여전히 낯선 개념이다. 우리가 만난 농장 대표는 “도시 농업을 여전히 많은 분이 전문 농업인들만 할 수 있다고 여긴다.”라며 특히 청소년과 청년층의 참여가 적다는 점에서 아쉬움을 드러냈다. 다음으로 정책적 지원의 한계가 있다. 도시 농업을 지원하는 법률이 존재하지만, 관련된 예산이나 정책적 지원 등은 충분하지 못한 편이다.\n4. 결론\n도시 농업은 식량 자급, 정서 안정, 생태 교육, 공동체 형성 등 다양한 공익적 가치가 있는 지속 가능한 산업이다. 따라서 도시 농업은 도시민의 삶의 질을 높이고, 기후 위기와 자원 문제에 대응하는 좋은 해결책이 될 수 있다. 하지만 도시 농업에 대한 시민들의 인식은 여전히 부족하며, 정책적 지원 부족과 경작 공간 확보의 어려움 등의 문제 또한 존재한다. 도시 농업이 보다 탄탄하게 자리매김하기 위해서는 제도적인 기반을 체계적으로 마련해야 한다. 또한 시민들이 도시 농업을 쉽게 접할 수 있도록 교육과 홍보가 병행될 필요가 있다.\n(나)\n학생 1: 어제 보내 준 초안은 다 읽어 봤지? 오늘 보고서를 함께 검토하면서 어떻게 수정해야 할지 이야기해 보자.\n학생 2: 글을 쓰느라 정말 고생 많았어. 먼저 주제를 도시 농업으로 정하게 된 배경이 잘 드러나지 않는 것 같아. 주제를 정할 때, 지속 가능하면서도 지역 주민들의 삶에 긍정적인 영향을 미치는 산업을 주제로 선정하기로 했었잖아?\n학생 1: 맞아. 그 부분이 잘 드러나지 않는 것 같아. 수정해 보도록 할게. 또 다른 의견은 없어?\n학생 2: 도시 농업의 가치를 서술한 부분에서, 도시 농업의 개인적 가치를 서술한 내용이 잘 공감되지 않는 것 같아.\n학생 3: 나도 동의해. 또 도시 농업의 제도적 한계를 서술한 부분에서도 제도적 한계가 실제로 어떠한지 알기 어려워 보여.\n학생 1: 너희 모두 생각한다는 거지? 나도 그 부분들이 좀 걸렸었는\n데 그 이유를 명확하게 파악하진 못했었어. 보완해 볼게.\n학생 3: 그리고 우리가 도시 농업에 대한 학생들의 인식을 조사하려고 실시한 설문 결과도 누락되어 있어. 조사 대상 학생의 15%만 실제 도시 농업에 참여해 봤다고 했었잖아.\n학생 2: 그리고 도시 농업에 참여한 학생 중 90%는 도시 농업이 심리적 안정을 주고, 생태 교육의 효과가 매우 높아 꼭 필요하다고 응답했었지.\n학생 1: 구체적인 수치를 활용하자는 거지? 지금은 응답 내용만 활용했는데, 의견을 준 대로 수정해 볼게.\n학생 3: 그리고 우리가 수집했던 자료들을 글 전체에서 충분히 활용하지 못한 것 같아. 특히 도시 농업의 가치 부분에서 사회적 측면만 부각이 되어서 아쉬워. 내가 조사한 보고서에서는, 도시 농업의 경제적 가치는 3조 1,090억 원가량으로, 사회적 가치는 1조 3,400억 원가량으로 추정된다고 하는데 이 부분을 활용하면 좋을 것 같아.\n학생 2: 맞아. 나는 지자체 소유의 공유지를 활용해서 도시 농업에 필요한 공간을 확보한 ▽▽시의 사례를 수집했는데, 이 사례를 활용하면 글의 완결성을 높일 수 있을 거야.\n학생 3: 또 조사 결과 부분에서 우리 지역 도시 농업이 생활 중심이라고 서술된 부분에 구체적인 근거를 덧붙이면 좋겠어. 그래야 조사 결과의 타당성이 높아질 거 같아.\n학생 1: 좋은 의견 다들 고마워. 우리가 수집한 자료에서 의견들을 뒷받침할 만한 적절한 자료들이 있었던 것 같아. 글을 수정해서 다시 보내 주도록 할게.",

  "passage": "[작문 과제]\n관심 있는 사회 현상에 대해 자신의 관점이 명확히 드러나도록 비평문을 작성할 것\n[초고]\n제목: ( )\n국내 음식 배달 산업은 최근 몇 년간 빠르게 성장하면서 우리 일상에 깊숙이 자리 잡았다. 특히 2019년 감염병 발생 이후 비대면 문화가 확산되면서 음식 배달 산업이 급속하게 성장하였다. ○○ 기관의 연구 보고서에서는 감염병의 유행이 끝난 이후에도 다양한 이유로 음식 배달 산업이 꾸준히 성장할 것으로 전망하고 있다. 음식 배달 산업의 성장은 우리 삶에 다양한 변화를 가져왔는데, 우선 소비자의 편의성이 증대되었다. 소비자 입장에서는 집에서 편리하게 배달 음식을 받을 수 있게 되었다. 특히 고령층이나 거동이 불편한 사람들에게 음식 배달 서비스는 생활의 질을 크게 향상시키는 수단이 되고 있다. 음식 배달 산업의 발달은 경제적인 측면에서도 긍정적인 효과를 보여 주고 있다. 통계청의 보고에 따르면 음식 배달 종사자의 숫자가 최근 몇 년간 크게 늘었는데, 음식 배달 산업의 성장이 일자리 창출에도 기여하고 있다는 점을 알 수 있다.\n하지만 음식 배달 산업의 급격한 성장은 여러 가지 부작용을 낳고 있다. 우선 음식을 담는 일회용 포장재 사용의 증가는 환경 오염을 가속화한다. 또한 음식 배달 노동자의 열악한 근로 환경과 처우 문제도 사회 문제로 떠오르고 있다. 빠른 배달을 위해 경쟁하다 보니 배달 노동자의 교통사고 위험이 증가하게 되었으나, 음식 배달 노동자 대부분이 비정규직인 탓에 사회적 안전망의 사각지대에서 보호를 받지 못하고 있는 실정이다.\n이러한 부작용에도 불구하고 음식 배달 산업의 양적 성장을 알려 주는 지표인 음식 배달 앱의 이용자 수는 지속적으로 증가하고 있다. 음식 배달 산업의 지속 가능한 성장을 위해서는 일회용품 사용 규제나 배달 노동자의 근로 환경 개선과 같은 정부의 노력이 필요하다. 더불어 음식을 주문할 때 일회용품 사용을 자제하거나 배달 노동자의 안전한 운행을 위해 따뜻한 격려를 보내는 등 소비자들의 관심과 동참도 필요하다. 결론적으로 음식 배달 산업의 발전은 우리 삶의 편리성을 높였지만, 동시에 환경과 노동 문제 등 여러 사회적 문제를 동반하고 있다. 음식 배달 산업의 지속 가능한 성장을 위해서는 우리 모두가 이러한 문제에 지속적으로 관심을 가져야 하며, 문제를 해결하기 위해 함께 노력해야 한다.",

  "passage": "(가)는 지역 사회 탐구 동아리 학생들의 대화이고, (나)는 (가)를 바탕으로 ‘학생 1’이 작성한 건의문의 초고이다. 물음에 답하시오.\n(가)\n학생 1: 지난번에 말한 것처럼 우리 지역 주민 센터가 리모델링을 하면서 주민 복지 서비스에 대한 주민들의 의견을 수렴하고 있어. 각자 건의 내용을 한 가지씩 준비해 오기로 했는데, 이야기를 나눠 보자.\n학생 2: 내가 생각한 건 청소년 전용 스터디 카페야. 시험 기간 때마다 스터디 카페에 자리가 부족한데, 지역 주민 센터에 청소년이 이용할 수 있는 스터디 카페가 있으면 좋을 것 같아.\n학생 3: 청소년 전용 시설은 일부 연령층만 이용하는 것이어서 건의가 수용되기 어려울 것 같은데, 다양한 연령층의 사람들이 활용할 수 있는 서비스를 건의하는 건 어떨까? 요즘엔 취업 준비생이나 중장년층도 스터디 카페를 많이 이용하니까, 청소년 전용 스터디 카페보다는 모든 지역 주민이 이용할 수 있는 스터디 카페 설치를 건의하자.\n학생 4: 나도 동의해. 기존 공간을 활용하는 건의를 하면 수용 가능성이 높아질 것 같은데, 현재 주민 센터 내에 운영 중인 작은 도서관 열람실을 스터디 카페로 개조하는 방안을 제시하자.\n학생 2: 좋은 생각인데! 도서관 열람실이나 스터디 카페 모두 정숙해야 하는 공간이라는 점에서 비슷하니까 개조하기 쉬울 것 같아.\n학생 1: 그래, 도서관 열람실을 스터디 카페로 개조한 공간에 가 본 적이 있는데 만족스러웠어.\n학생 2: 그리고 지역 주민들이 회의실을 이용해야 하는 경우가 많은데, 주민 센터에서 지역 주민들이 이용할 수 있는 소규모 회의실을 마련해 주면 좋을 것 같아.\n학생 1: 주민 참여 사업을 위한 회의 등을 할 때 유용한 공간이 될 것 같아. 또 다른 건의 사항 있을까?\n학생 3: 주민들을 위한 체육 시설이 있으면 좋을 것 같아. 주민 센터 제일 위층에 층고가 높은 강당이 있는 걸 보았는데 잘 활용되지 않고 있어서 안타까웠어. 투표와 같은 행사가 있을 때에만 사용하는 것 같았는데, 이 공간에 체육 시설을 마련해서 주민들에게 개방하면 좋을 것 같아.\n학생 2: 구체적으로 어떤 체육 시설을 건의하면 좋을까?\n학생 3: 탁구와 배드민턴 시설을 건의하면 좋을 것 같아. 다양한 연령층의 사람들이 함께 즐기기 좋은 운동 종목에 탁구가 1위로 꼽혔고, 배드민턴이 2위로 꼽혔다는 설문 조사 자료를 본 적이 있어.\n[A]\n학생 2: 나도 동의해. 비교적 큰 비용을 들이지 않고 남녀노소가 함께 즐기기 좋은 운동이 배드민턴과 탁구라는 전문가의 인터뷰 내용을 본 적이 있어. 주민 센터 온라인 게시판에도 탁구나 배드민턴 시설의 필요성을 언급하는 글이 자주 올라오는데, 주민 센터에 탁구나 배드민턴 시설이 마련되면 주민들이 좋아할 것 같아.\n학생 1: 탁구와 배드민턴을 할 수 있는 체육 시설을 건의할게. 혹시 의견 더 있어?\n학생 4: 주민 복지와 관련된 언론의 보도를 보면서 생각한 건데, 주민 센터에 다양한 주민 복지 서비스가 마련되어도 주민 센터에 방문하기 어려운 소외 계층이 있다면 복지 사각지대가 발생할 수 있을 것 같아. 얼마 전에 몸이 불편한 이웃 할머니와 대화를 나눴는데, 거동이 불편한 어르신들의 경우 주민 센터 방문에 어려움을 겪고 계셨어. 인근의 △△ 지역에서는 거동이 불편한 어르신들의 보행을 돕는 기구인 실버 카를 대여해 주는 서비스를 하고 있는데, 이번에 우리 동네에서도 이 서비스를 도입하면 좋을 것 같아.\n학생 3: 나도 동의해. 그리고 위에서 언급한 서비스를 무상으로 제공해 달라는 의견도 제시해 줘.\n학생 2: 모든 서비스를 무상으로 제공하면 좋겠지만 예산이 부족할 수도 있으니, 사설 업체보다 저렴한 수준에서 적정한 비용을 받는 것도 고려해 볼 만해. 서비스 이용 요금에 대해서는 주민들의 의견을 수렴해 보는 건 어떨까?\n학생 1: 좋아, 주민들의 의견을 수렴해서 건의문에 제시할게. 지금까지 논의한 내용을 바탕으로 미흡한 부분을 보완해서 건의문 초고를 작성해 볼게.\n(나)\n안녕하십니까? ○○동 주민이자 ○   "passage": "인간은 고기와 가죽을 얻거나 실험에 이용하는 등의 목적으로 동물을 이용한다. 그리고 그런 이용은 일반적으로 동물에게 해악을 끼치는 방식으로 이루어지기에 잘못된 행동으로 인식된다. 동물에게 이렇게 해악을 끼치는 것을 정당화할 방법이 있을까? 한 가지 대답은 동물은 단지 동물이기에 이런 식으로 사용하는 것이 정당하다는 것이다. ‘종(種) 차별주의’는 이렇게 우리가 속한 종의 이익을 다른 종의 이익보다 우선시하는 것을 말한다. 동물은 우리 종에 속하지 않기 때문에 인간에게 절대 하지 않는 방식으로 동물을 대할 수 있다는 것이다. 종 차별주의를 옹호하는 가장 직관적이고 상식적인 방법은 인간은 인간이라는 종에 속하므로 특별한 대우를 받아도 된다고 주장하는 것이다.\n그런데 나와 같은 인간이므로 더 중요하게 대우받아야 한다는 주장이 허용된다면, 나와 같은 성별이기에 더 중요하게 대우받아야 한다는 ‘성차별주의’나, 나와 같은 인종이므로 더 중요하게 대우받아야 한다는 ‘인종 차별주의’도 허용되어야 한다. 따라서 단순히 같은 종에 속한다는 것 말고 도덕적으로 특별한 대우를 받을 만한 특징을 제시해야 한다. 종 차별주의를 지지하는 이들은 호모 사피엔스라는 생물학적 근거를 그 특징으로 제시하기도 한다. 우리의 DNA가 특정 방식으로 구성되어 있다는 것이 인간과 동물을 다르게 대우하는 이유가 된다는 것이다.\n그러나 DNA가 어떻게 구성되어 있는지는 세포 내 분자의 순서에 관한 사실일 뿐이며 그런 점에서 피부색이나 성염색체나 마찬가지로 도덕적으로 의미 있는 특성이 아니다. 피부색이 같으므로 중요하게 대우해야 한다고 주장하는 것이 의미 없는 것처럼, DNA가 같으므로 중요하게 대우해야 한다고 주장하는 것 역시 의미가 없다. 그것은 같은 인간 종에 속하므로 다른 종과 다르게 대우해야 한다는 말이나 다름이 없는 것이다.\n한편 이런 종 차별주의에 따르면 DNA가 매우 특이한 구조를 가지고 있는 사람은 동물에게 대하는 방식대로 대해도 된다는 결론이 나오게 되는 문제도 있다. 이러한 문제를 해결하기 위해, 인간은 매우 다른 정신 능력을 갖추고 있다는 이유를 들어 종 차별주의를 지지하는 이들도 있다. 인간은 정교한 언어, 복잡한 사고 능력, 도덕적 이상에 따라 살 수 있는 능력을 가지고 있다는 것이다. 어쩌면 이러한 능력은 인간 종을 다른 종보다 우선시하는 것을 정당화할 수도 있다. 인간종에 전형적인 정신적 또는 인지적 능력이 있다는 것은 ‘도덕적으로’ 중요한 특성이기 때문이다.\n그러나 인간에게만 있는 정신 능력이 도덕적으로 중요하다고만 주장해서는 안 되고 왜 도덕적으로 의미가 있는지 설명해야 한다. 그렇지 않으면 그런 특성은 ‘인간의’ 것이므로 특별하다고 주장하는 셈이 된다. 이런 식의 주장을 하는 사람들은 우리가 박쥐라면 아마도 위와 같은 특성 대신에 반향 위치 측정 능력이 도덕적으로 중요하다고 주장할 것이다.\n따라서 인간은 앞서 말한 고차원적 정신 능력을 갖추고 있기에 자의식이나 자존감 같은 사고 능력이 있다고 설명해야 한다. 그렇다면 아무리 잘 먹여 주고 고통 없이 기른다고 하더라도 사육을 위해 길러진다면 인간성이 훼손되기에 인간 사육은 옳지 못하다.\n반면에 그런 능력이 없는 동물은 가두어 길러진다고 하더라도 도덕적으로 문제가 없다. 이런 식의 설명은 인간의 배타적 특성이 왜 도덕적으로 의미가 있는지 설명할 수 있다.\n그러나 이 설명은 ‘종 중첩 논증’에 취약하다. 예를 들어 아기와 심각하고 회복 불가능한 뇌 손상 환자는 위에 나열된 고차원적 정신 능력을 갖추고 있기 어렵다. 다시 말해서 생물학적으로 인간이지만 고차원적 정신 능력으로 분류할 때는 동물과 중첩되는 인간들이 있다.\n하지만 그런 인간들에게는 절대 해서는 안 된다고 생각하는 사육이나 실험과 같은 행동을 동물에게는 한다. 또 침팬지와 같은 영장류 동물 중에는 위와 같은 정신 능력을 적어도 아기와 심각하고 회복 불가능한 뇌 손상 환자보다 훨씬 더 많이 가진 개체도 있을 수 있다.\n그러나 그런 동물이라고 해서 인간과 똑같이 대우하지는 않는 것이 우리의 현실이다. 성차별이나 인종 차별이 만연했던 과거 사회와 달리 지금은 그런 차별이 비난받는 것처럼, 종 중첩 논증이 해결되지 않으면 종에 따른 차별도 언젠가는 비난받게 될 것이다. 종 차별주의를 옹호하기 위해서는 종 중첩 논증은 어떻게든 해결되어야 한다.",

  "passage": "대중적 정부의 형태를 채택하는 국가는 항상 시민 사회의 분열과 파벌 형성이라는 위험에 노출되어 있다. 여기서 파벌이란 공동체 전체의 이익과 일치하지 않는, 일부 구성원들만을 위한 이해관계에 기초 하여 결합하고 행동하는 시민 집단을 뜻한다. 이들이 비교적 소수의 인원들로 구성되어 있을 경우에는 다수의 시민들이 선거에 의하여 그들의 준동을 좌절시킬 수 있을 것이나, 그와 반대의 상황이라면 파벌이 공공선 및 파벌에 속하지 않은 시민들의 권리를 자신들의 정념(情念)과 이익을 위해 희생시키는 결과가 초래될 수 있다. 미국 건국의 아버지 중 한 사람으로 알려진 제임스 매디슨은 바로 이와 같은 문제가 사회적 다수의 지배를 그 핵심으로 하는 민주주의에 내재해 있는 치명적인 약점이라고 생각했다. 누구도 자기 자신의 송사에서 재판관이 될 수 없다는 것은 정의의 관점에서 지극히 당연한데, 이 말이 의미하는 바를 곱씹어 볼 때 사회적 다수가 자신들의 이익이 걸려 있는 상황에서 정치적 권력을 중립적으로 행사하기를 기대하는 것은 사실상 헛된 꿈에 불과할 것이다.\n그렇다고 해서 끊임없이 생겨나는 특정한 이해관계를 토대로 사회적 결합에 이를 수 있는 자유를 없앨 수도 없는데, 그것은 마치 질병보다 해로운 치료 약과 같아서 시민들의 정치 생활 자체를 더 이상 존립할 수 없게 만들 것이기 때문이라 한다. 매디슨에 의하면 결국 순수한 민주정에서는 이러한 약점을 치유할 수 있는 방법이 존재하지 않는다. 그가 말하는 순수한 민주정이란, 정부를 직접 구성하고 운영하는 소규모의 시민들로 구성된 사회이다.\n이러한 정부 형태에서는 취약한 당파나 개인들을 희생시키려는 유인 앞에서 지배적인 다수를 제어할 수단은 애초에 존재할 수가 없을 것이다. 정치적 권리의 면에서 평등이 보장된다 하더라도 인간 능력의 다양성, 서로 다른 의견과 이해관계 등으로 인해 시민들은 결코 완전히 동등해지거나 동질화될 수 없기 때문이다. 역사적으로도 이 같은 민주정은 항상 혼란과 분쟁의 참상을 겪었고, 개인의 안전이나 재산권의 보장과 양립 불가능한 것으로 드러났으며, 대체로 오래 지속되지도 못했다고 그는 지적한다.\n그렇다면 매디슨이 생각하는 바람직한 정부 형태는 어떤 것이었을까? 그의 대답은 공화정의 이상을 추구하는 정부, 보다 구체적으로는 선출된 대표를 통해서 정치적 권력이 행사되는 정부였다. 그에 따르면 순수한 민주정에서와 달리 공화정에서는 정치적 평등의 실현이 지상의 과제는 아니다. 오히려 시민 혁명기의 많은 사상가들처럼 그것을 부정적으로 보았을 가능성이 크다. 당시 식민지인들은 대체로 혼합 정체(混合政體)*를 이상적으로 생각했던 만큼, 한편으로 평민이 방종한 폭도로 변하는 것을 막고 다른 한편으로 국왕이 전제 군주로 변하는 것을 막는 역할을 했던 이른바 ‘중간적 권력’의 존재를 용인하려는 정서를 지니고 있었는데, 이는 순수한 민주정의 평등 구도와는 어울리지 않는 것이었다.\n또한 그들은 일찍이 영국에서 잠시나마 공화정을 탄생시켰던 청교도 혁명의 주도 세력에 대하여 정신적으로나 종교적으로 유대감을 느끼고 있었는데, 크롬웰의 공화정에는 실제로 민주주의적 지향이 미약하거나 거의 부재했었다고 한다. 이 같은 상황을 고려할 때, 매디슨이 제안하는 공화정이란 무엇보다 ‘대표’라는 소수의 선출된 시민 집단을 정치의 매개체로 개입시킴으로써 시민들의 직접적 정부 참여를 피하는 데 중점을 둔 개념이었을 것이다.\n따라서 그의 공화정 개념을 현대적 의미의 이른바 간접적 민주주의와 동일시할 수는 없으며, 오히려 민주주의의 위험성을 배제한다는 시대적 관점에서 이해되어야 한다는 해석이 제기된다. 매디슨이 생각하는 ‘대표’의 조건을 살펴보면 이러한 해석에 좀 더 공감할 수 있게 된다. 그는 시민들의 대표가 지혜, 애국심, 그리고 정의에 대한 사랑을 두루 갖춘 국익의 수호자이기를 바랐는데, 당시의 기준으로 생각할 때 이는 앞에서 언급한 ‘중간적 권력’, 즉 평민 세력과 국왕 세력의 사이에서 양자를 모두 견제하는 고매한 귀족들에게나 기대해 봄직한 자질에 가깝다. 더욱이 청교도 혁명  {

  "src": "CPU와 GPU의 연산 구조 차이",
  "source": "EBS 2027학년도 수능특강 국어영역 독서, 01~02강 (CPU와 GPU의 연산 구조 차이) | EBS 문항코드: 26002-0191~0195",
  "passage": "최근까지 일반적인 컴퓨터 환경에서는 운영 체제를 제어하거나 사용자 인터페이스를 처리하고, 문서를 작성하거나 웹을 탐색하는 등 다양한 범용 작업이 주요 연산 대상이었다. 이러한 작업은 명령어의 종류가 많고 그 순서가 수시로 바뀌며, 연산 간 종속성이 크다는 특징이 있다. 컴퓨터의 연산은 주로 여러 개의 코어로 구성된 중앙 처리 장치(CPU)에서 수행된다. 코어는 컴퓨터의 두뇌 역할을 하는 것으로 명령어를 해석하고 각종 연산을 실행한다. CPU는 여러 개의 고성능 코어로 구성되어 복잡한 제어 흐름을 정밀하게 조율할 수 있도록 설계되었다.\n그러나 인공 지능 학습, 고해상도 영상 처리, 과학 기술 관련 계산 등 대규모 데이터를 대상으로 동일한 연산을 반복 수행해야 하는 작업이 증가하면서 기존의 연산 환경에 변화가 생겼다. CPU는 코어 수에 한계가 있고 개별 코어가 복잡한 제어 흐름에 맞추어 다양한 연산을 처리하도록 설계되어 있기 때문에 동일한 연산을 대량으로 반복 수행해야 하는 현대의 병렬 연산 환경을 효율적으로 처리하기 어렵다.\n이러한 상황에서 컴퓨터의 새로운 중심 장치로 떠오른 것이 그래픽 처리 장치(GPU)이다. GPU는 컴퓨터 내에서 그래픽 처리를 담당하는 장치로, 수많은 픽셀*에 동일한 연산이 반복적으로 이루어지는 그래픽 연산의 특성상 다수의 코어가 병렬로 작동하는 구조로 이루어져 있다. GPU는 수백 개에서 수천 개에 이르는 단순 연산 전용 코어를 하나의 칩에 집적한 상태로, 많은 일꾼이 한 가지 작업을 동시에 수행하는 공장과 같다. 이는 동일한 명령어를 다수의 데이터에 반복 적용하는 방식에 최적화되어 있으며, GPU의 코어는 제어 기능을 최소화하고, 동일한 연산을 빠르게 수행하도록 설계되어 있다.\n이러한 구조를 바탕으로 GPU는 원래의 목적인 그래픽 처리 외에도 다양한 분야에서 활용되고 있다. 인공 지능 학습에서는 행렬 곱셈과 역전파 계산 등 동일한 연산의 반복이 이루어지며, 영상 처리나 고해상도 그래픽 구현에서는 수많은 픽셀 단위의 연산이 병렬로 적용된다. 또한 기상 예측, 유전자 배열 분석, 유체 역학 시뮬레이션 등에서도 대규모 수치 연산을 빠르게 처리해야 하기 때문에, 병렬 구조에 기반한 연산 장치가 필요하다. GPU 내부에는 수많은 연산 코어가 집적되어 있고 이들은 일정 단위로 묶여 연산 유닛을 형성한다. 연산 유닛은 여러 개의 스레드를 병렬로 실행할 수 있는 독립적인 실행 공간으로, 공장 내에서 같은 작업을 수행하는 작업반에 비유할 수 있다. 스레드는 연산을 수행하는 최소 단위로, 하나의 스레드는 하나의 명령어를 실행한다. GPU는 여러 스레드를 하나의 스레드 블록으로 묶어서 관리하는데, 스레드 블록 내의 스레드들은 기본적으로 동일한 명령어를 실행하게 된다.\n명령어가 GPU에 전달되면 디코딩 과정을 통해 해석되며, 스케줄러는 이 명령어에 따라 스레드 블록을 각 연산 유닛에 분배하고 병렬 처리가 이루어지도록 제어한다. 만약 연산량이 균등하게 분배되지 않으면 일부 연산 유닛은 다른 유닛의 연산이 끝날 때까지 대기 상태에 놓이게 되어 전체 GPU의 자원이 비효율적으로 사용되는 문제가 발생할 수 있다. 분배가 끝나면 스레드 블록은 병렬로 연산을 실행하고, 실행한 결과는 GPU 내의 메모리에 저장된다. GPU는 연산 속도를 높이기 위해 계층화된 메모리 구조를 갖추고 있다. 메모리는 접근 속도, 용량, 사용 범위 등에 따라 전역 메모리, 공유 메모리, 레지스터로 나뉜다. 전역 메모리는 모든 스레드가 접근할 수 있는 대용량 저장 공간으로, 다음 단계의 연산이나 외부와의 공유를 위해 연산 실행 결과를 저장한다.\n다만 접근 속도가 느리다는 단점이 있기 때문에 연산 중에 사용하기에는 적합하지 않다. 따라서 연산 중에는 개별 스레드만 사용할 수 있는 저장소인 레지스터나 같은 스레드 블록 내의 스레드들이 공동으로 사용하는 공유 메모리를 활용하여 데이터를 저장하고 처리하는 방식으로 성능을 최적화한다. 레지스터는 용량은 작지만 접근이 매우 빠르고, 공유 메모리는 전역 메모리보다 빠르면서도 여러 스레드 간의 정보 공유가 가능하다는 장점이 있다.\n다만, 같은 스레드 블록 내의 여러 스레드가 동시에 같은 메모리 공간에 접근할 경우, 충돌이 발생해 병렬성이 저하되어 연산이 지연되거나 처리 속도가 저하되는 현상이 나타날 수 있다. 따라서 메모리의 효율적 분배와 접근 방식의 조정은 GPU 연산 성능에 중요한 영향을 미친다.\n한편, GPU는 동일한 명령어를 다수의 데이터에 일괄 적용하는 방식에 최적화되어 있지만, 분기문이나 조건 판단이 자주 등장하는 연산에서는 병렬 처리의 효율이 낮아질 수 있다. 조건 판단은 특정 수치나 상태에 따라 연산의 흐름을 다르게 결정하는 과정이며, 분기문은 이러한 조건 판단에 따라 실행 경로를 분리하거나 연결하는 명령 구조를 의미한다. 예컨대, ‘어떤 값이 일정 기준보다 크면 A 연산을, 그렇지 않으면 B 연산을 수행하라.’는 명령이 있을 경우, 스레드마다 실행해야 할 작업이 달라진다. GPU는 스레드 블록 내 모든 스레드가 동일한 명령어를 동시에 수행하도록 설계되어 있기 때문에, 이러한 분기문이 삽입되면 일부 스레드는 다른 스레드의 작업이 끝날 때까지 대기하게 되고, 그 결과 병렬성이 손실되는 현상이 발생한다.\n따라서 GPU는 단순하고 반복적인 연산에는 매우 효과적이지만, 연산 경로가 자주 갈라지거나 복잡한 조건 판단이 요구되는 작업에서는 성능이 저하될 수 있다. CPU와 GPU의 장점을 고려하여, 최근의 컴퓨팅 시스템은 두 장치의 기능을 나누어 운용하는 구조로 발전하고 있다. 각 장치의 강점을 바탕으로 전체 시스템을 구성하여 연산 효율을 높이는 것이다. 연산 작업의 성격과 목적에 따라 CPU와 GPU 간 연산 흐름을 유기적으로 조정할 수 있도록 하드웨어 및 소프트웨어 설계 방식이 변화하고, 두 연산 장치의 성능을 최대한으로 끌어내면서도 효과적인 활용을 위한 프로그래밍이 이루어지고 있다. 이렇게 현대의 컴퓨팅 시스템은 두 연산 장치가 각자의 구조적 강점을 최대한 발휘할 수 있도록 하여 더욱 복잡하고 대규모화된 연산 환경에 대응하고 있다.\n*픽셀: 주소화될 수 있는 화면의 가장 작은 단위. 작은 점의 행과 열로 이루어져 있는 화면의 작은 점 각각을 이르는 말.",

  "passage": "에너지 대사는 생명 유지를 위해 필요한 에너지를 얻고 사용하는 과정으로 인체에 필요한 에너지는 대부분 음식물 섭취를 통해 이루어진다. 섭취를 통해 체내에 유입된 음식물은 그대로 에너지로 소비되지 않고 소화 과정을 거쳐 체내 각 조직에 공급된다. 음식물에 함유된 탄수화물, 단백질, 지방은 각각 일련의 과정을 거쳐 세포 활동에 직접 사용되는 에너지원인 ATP로 전환된 후 필요한 조직에 사용된다. 에너지로 바로 사용되지 않은 탄수화물 일부는 포도당의 형태로 간이나 근육에 저장되었다가 필요할 때 다시 ATP로 전환된다. 섭취된 에너지와 인체가 소비하는 에너지는 균형을 유지해야 하지만, 섭취한 에너지의 양이 소비되는 양보다 많아지는 상태가 지속되면 남는 에너지는 지방산으로 전환되어 지방 세포에 저장된다.\n이러한 상태가 심화되면 지방 세포의 크기가 커지게 된다. 지방산이 과도하게 축적되면 체내의 에너지 조절 체계가 정상적으로 작동하지 않게 되고 비만을 비롯한 다양한 대사 질환의 발생 가능성이 높아진다. 인체 내 에너지의 불균형이 섭취한 음식물의 양으로만 결정되는 것은 아니다. 인체의 에너지 소비는 기초 대사량, 음식물 소화 중의 열 발생, 신체 활동 등에 의해 이루어지는데, 이 중 기초 대사량은 전체 에너지 소비의 약 60~70%를 차지하며, 개인의 근육량과 대사율에 따라 달라진다. 기초 대사량이 낮은 사람은 기초 대사량이 높은 사람에 비해 에너지 소비가 충분히 이루어지지 않아 동일한 양의 음식물을 섭취하더라도 에너지 과잉 상태로 이어질 수 있다.\n또한 지방 조직의 특성도 에너지 소비에 차이를 만들 수 있다. 백색 지방세포는 에너지를 중성 지방 형태로 저장하기 때문에, 계속되는 과잉 섭취는 이 지방 세포에 에너지를 축적시킨다.\n반면, 갈색 지방 세포는 추위에 노출되었을 때 활성화되어 체온 유지에 도움을 주고 이는 에너지 소비를 증가시키는 데 기여한다. 하지만 갈색 지방 세포의 활성도가 낮으면 에너지 소비가 줄어들어 에너지 균형 유지가 어려워질 수 있다. 인체는 내부 상태를 일정하게 유지하려는 성질인 항상성을 지니고 있는데, 이는 에너지 대사에서도 중요하게 작용한다. 인체 내 에너지 소비가 원활하지 않은 경우 음식물 섭취량을 줄이고 소비를 늘리는 방향으로 에너지 균형을 유지하는 것이다. 여기에는 호르몬이 중요한 역할을 한다. 특히 뇌의 시상 하부는 체내 에너지 상태를 감지하고 식욕과 에너지 소비를 조절하여 적절한 양의 음식물을 섭취할 수 있도록 한다. 체지방이 증가하면 지방 세포에서 분비되는 렙틴의 분비량이 늘어나 시상 하부에 작용하여 식욕을 억제하고 에너지 소비를 증가시키게 한다.\n그러나 렙틴 농도가 높음에도 시상 하부가 이에 반응하지 않는 렙틴 저항성이 나타나면 식욕 억제 기능이 저하된다. 이에 따라 에너지 섭취가 증가하고 에너지 소비가 감소하여 에너지 불균형이 악화된다.\n이러한 저항성은 렙틴 자체의 결함보다는 시상 하부 수용체의 감수성이 저하되어 신호가 제대로 전달되지 않는 데에서 비롯된다. 위에서 분비되는 그 렐린은 공복 상태에서 증가하여 식욕을 촉진하며, 식후에는 감소한다.\n하지만 어떤 사람은 식사 후에도 그렐린 수치가 충분히 감소하지 않아 음식물의 과도한 섭취로 이어질 수 있다. 췌장에서 분비되는 인슐린은 혈액에 분포하는 포도당 흡수를 촉진하고 글리코젠 합성을 증가시켜 혈당량을 낮추는데, 인슐린 저항성이 발생하면 당 대사가 원활하지 않아 체내 에너지 균형이 무너지고 지방 축적이 촉진될 수 있다.\n한편, 혈당량이 낮을 때는 췌장에서 글루카곤이 분비되어 간에서 글리코젠이 포도당으로 전환되어 혈중으로 배출되도록 하여 혈당량이 일정하게 유지될 수 있도록 한다. 인체 내 에너지 균형에 문제가 생긴 경우에는 회복을 위해 생활 습관 변경, 환경 조절 등의 접근이 필요하다.\n먼저 운동 등의 신체 활동은 단기적으로는 총에너지 소비량을 늘리고, 장기적으로는 근육량을 증가시켜 소비 기반을 확장한다. 그리고 음식물 섭취량 조절, 규칙적 섭취, 섭취 속도의 조절 등은 호르몬의 이상 작용을 완화시킬 수 있다. 수면 부족은 그렐린 증가, 렙틴 감소로 이어지므로 충분한 수면도 에너지 균형에 도움을 준다.\n또한 적정한 추위 노출로 갈색 지방 세포의 작용을 촉진하여 에너지 소비를 늘릴 수도 있다. 최근에는 백색 지방 세포가 갈색 지방 세포와 유사한 기능을 갖는 베이지 지방 세포로 전환될 수 있음이 알려지면서, 에너지 대사 개선과 체내 에너지 균형 회복을 위한 새로운 방법으로 주목받고 있다.\n이처럼 에너지 항상성은 다수의 생리적 요인과 환경적 요소가 복합적으로 작용하여 유지되는 체계이므로, 이를 안정적으로 유지하는 것은 건강한 대사 상태를 유지하는 데 핵심적인 조건이라 할수있다.",

  "passage": "현대 사회는 기술 발전, 사회적 가치 변화, 경제 활동의 복잡성 등 다양한 요인으로 법률이 점점 더 복잡해지고 다변화하고 있다. 이러한 변화 속에서 시민들은 법규를 정확히 알지 못하거나 잘못 이해해 자신도 모르게 법을 위반하는 상황에 놓이기도 한다. 우리 형법은 이러한 문제를 다루기 위해 ‘법률의 착오’라는 개념을 규정하여 행위자의 법적 책임 여부를 공정하게 판단하기 위한 근거를 제공한다. 법률의 착오는 행위자가 자신이 행한 행위가 법적으로 금지된 것임을 알지 못하거나 잘못 이해한 경우를 말한다. 형법 제16조는 이러한 착오가 정당한 이유에 기초한 것이라면 벌하지 아니한다고 규정하고 있다. 법률의 착오는 규범적 의미를 인식하지 못하거나 그 규범을 잘못 해석한 경우를 의미한다는 점에서 사실의 착오와 구별된다. 사실의 착오는 행위자가 객관적 사실을 잘못 인식하거나 알지 못한 경우를 뜻한다.\n예를 들어 남의 물건을 자신의 것이라 착각해 가져간 경우는 사실의 착오이지만, 남의 물건을 가져간 사실을 알면서도 그것이 절도죄에 해당한다는 규범적 금지를 알지 못한 경우는 법률의 착오에 해당한다. 법률의 착오에 대한 논의는 ‘위법성의 인식’과 ‘정당한 이유’라는 요소를 중심으로 이루어진다. 위법성의 인식은 자신의 행위가 법적으로 금지된 것임을 인식하는 것을 말한다.\n이에 대한 해석은 고의설과 책임설의 두 입장으로 나뉘고 있다. 고의설은 위법성의 인식이 고의의 중요한 요소라고 본다. 고의설에 따르면 행위자가 자신의 행위가 법에 위반된다는 사실을 인식하고 의도적으로 그 행위를 실행했을 때 고의가 성립한다. 이는 범죄 성립의 핵심적인 요소로 간주된다.\n반면 책임설은 위법성의 인식을 고의와 구별하여 위법성의 인식이 결여된 경우에도 정당한 이유가 없다면 법적 책임을 물을 수 있다고 본다. 위법성의 인식이 결여된 이유가 정당하게 뒷받침될 경우 착오로 인한 법적 책임을 면할 수 있게 된다. 정당한 이유란 행위자가 법을 알기 위해 통상적으로 요구되는 주의 의무를 다했음에도 불구하고 법규를 인식하기 어려운 사정이 존재하는 경우를 말한다. 이를 판단하기 위한 기준에는 ‘상당한 이유 설’과 ‘회피 가능성설’이 제시된다. 상당한 이유설은 행위자가 법규를 알지 못한 이유가 사회적 관점에서 충분히 이해될 수 있는지를 기준으로 삼는다. 여기에는 법령의 내용이 지나치게 난해하거나, 제·개정이 최근 이루어져 널리 공지되지 않은 경우, 또는 관련 행정 기관의 안내가 미비한 경우 등이 고려될 수 있다. 회피 가능성설은 행위자가 해당 법규를 알기 위해 필요한 주의 의무를 다했는지 그리고 그러한 부지(不知)*를 회피하는 것이 실제로 가능했는지를 판단 기준으로 삼는다.\n간단한 확인 절차를 거쳤다면 그 법규의 존재를 알 수 있었던 경우와 같이, 법규에 대한 부지를 피할 수 있었던 상황에서는 정당한 이유가 인정되기 어렵다. 법률의 착오에 관한 이러한 논의는 법적 책임이 단순히 법규 위반 사실만으로 결정되는 것이 아님을 보여 주며, 행위자의 인식 가능성과 주의 의무 이행 여부를 함께 고려한 책임 판단이 필요함을 시사한다. 이와 같은 책임 판단의 방식은 법적 판단의 공정성과 합리성을 제고하는 데 기여한다. ✽부지: 알지 못함.",

  "passage": "산업 혁명 이후 예술과 기술의 결합이 본격적으로 진행되면서 예술 영역에서 일어난 가장 큰 변화는 이미지가 무한정 복제될 수 있다는 것이었다. 발터 베냐민이 지적했듯이 예술 작품에 대한 복제는 어느 시대나 늘 존재했지만, 원본만이 가지고 있는 고고한 분위기, 즉 ‘오라(aura)’가 있기 때문에 복제품은 복제품에 머무를 수밖에 없었다.\n그러나 영화와 사진이라는 무한정 복제될 수 있는 예술 형식이 생겨나면서 원본과 복제품의 관계에 큰 변화가 일어났다. 원본이 무엇인지를 알 수 없으며 원본을 감상할 기회보다 복제품을 통해 예술을 접할 기회가 훨씬 더 많아지면서, 베냐민은 영화와 사진이 가져온 변화의 시간을 예술의 운명적 시간이자 오라의 몰락이라고 정의했다. 디지털 혁명으로 원본이 더욱더 무의미해진 상황에서 독일의 철학자 노르베르트 볼츠는 매체 자체가 예술의 형식과 내용을 규정한다는 ‘매체 미학’을 전개했다. 볼츠는 현대 사회가 매체 의존적 사회라고 정의하고 매체 의존성을 현실의 지각 측면에서 접근한다. 그는 직접적인 세계 지각 대신 매개된 지각이 전면적으로 등장했다고 주장한다. 실제 우리 생활을 보면 동영상 채널을 통해 세상에서 일어나는 일들을 확인하고, 주변 풍경을 보면서 목적지를 찾아가는 것이 아니라 스마트폰의 길 찾기를 통해 자신의 위치와 목적지를 확인한다.\n이러한 매체 의존적 사회에서 지배적인 매체도 변화했다. 이전에는 문자 매체가 지배적이었다면 이제는 이미지를 중심으로 한시각 매체, 더 나아가 복합 매체가 중심 매체로 등장했다. 볼츠는 이에 대해 구텐베르크 은하계, 즉 문자 문화는 몰락하고 시각 중심의 문화가 시작되었다고 평했다. 이것은 문자의 역할 자체가 없어졌다는 것이 아니라 문자를 중심으로 형성된 특권 계급의 고급문화가 몰락하고, 누구나 접근하고 향유할 수 있는 매체 중심으로 문화가 변화했음을 나타낸다. 볼츠는 현대인들이 매체 의존적 사회에 살고 있기 때문에 미학이 현실에 충실하기 위해서는 매체를 중심으로 논의되어야 한다고 주장한다. 이전까지는 예술에 대해 존재, 진리, 정신, 아름다움을 핵심으로 두고 작품을 분석하는 데 중점을 두었다면 변화된 매체 환경에서는 작품이 어떤 매체를 이용해서 전달되고, 수용자에게 어떻게 지각되고 체험되는가가 중심 문제가 되는 것이다.\n따라서 미학은 해석과 관조를 기반으로 한 예술 이해나 미적 체험이 아니라 감성적 지각을 중심으로 한 감성학이 되어야 한다고 주장한다. 누구나 스마트폰 하나로 영상을 만들고, 이미지를 편집하여 공유할 수 있는 환경에서 전통적인 아름다움이나 진리라는 개념, 작가의 비판적 의도 등은 예술에 필수적인 것이 아니라는 것이다. 감성학으로서의 매체 미학은 예술 작품이나 아름다움에 대해 분석하는 것이 아니라 예술 작품과 수용자 간의 관계에 주목한다. 그에 따라 ‘예술이란 무엇이며, 어떤 문제의식을 가지고 있어야 하는가’라는 문제 설정이 불필요하며, 그런 질문을 필요로 했던 근대적 의미의 예술은 종말을 맞이했다고 보았다.\n따라서 그는 현재의 매체 환경과 예술의 연관성에서 중요한 것은 미디어 환경 디자인이라고 주장한다. 예전에는 오랜 기간의 훈련을 통해서 가능했던 예술 창작이 이제는 컴퓨터의 도움으로 누구나 쉽게 할 수 있는 것이 되었다.\n이러한 시대에 예술가에게 진정으로 필요한 것은 미디어를 이용하는 창조적인 아이디어라는 것이다. 볼츠는 디지털 시대의 예술은 고정된 물질로서의 작품이 아니라, 입력에 따라 변화하고 상호 작용하는 알고리즘적 형식이며, 관조가 아닌 참여를 요구한다고 보았다. 볼츠의 관점에서 볼 때 매체 환경은 단지 예술이 표현되는 외형적 조건이 아니라, 예술 자체의 정의와 존재 방식을 변화시는 구조이다. 이전 시기의 예술이 문명에 대한 비판과 같은 내용이나 오라를 가진 형식을 통해 독자성을 강화했다면, 디지털 시대의 예술은 오히려 생산자와 소비자의 경계를 허물고 새로운 감각의 질서를 창출한다. 볼츠는 이 변화 속에서 예술의 본질이 소멸했다고 보지 않고 오히려 매체의 변화에 따라 혁신해 간다고 본다.",

  "passage": "[앞부분 줄거리] 송나라의 상국 조숙과 부인 위 씨는 신이한 꿈을 꾸고 두 아들 용홍과 용창을 얻는다. 대원수의 기질을 가진 용홍과 승상의 기품을 가진 용창이 각각 금가락지와 은가락지의 인연과 이어질 것이란 예언을 들은 조 공은 아들 용홍을 금가락지의 인연인 정채임과 정혼시킨다. 이후 채임의 부친 정 참정이 계모의 모함만 믿고 채임을 다른 곳에 시집보내려 하자, 채임은 시녀들과 함께 남복을 하고 도망치다가 나쁜 이들에게 쫓겨 강물에 몸을 던진다. 그 근처를 지나가던 용홍과 용창은 우연히 이들을 구한다. 용홍과 용창은 물에 빠져 죽으려 하던 두 명의 서동을 불러 좌우의 사람들을 물러가게 하고 물었다.\n“우리는 서울로 가던 길인데 너희 등 노비와 주인 세 명이 물에 빠져 죽으려 하는 것을 보았다. 사람의 마음이 슬프고 매우 놀라서 구하였다. 너희와 주인을 보니 몸 위에 두건과 의복이 있으나 결코 남자가 아니다. 무슨 까닭으로 떠돌아다니느냐? 실상을 속이지 마라. 우리들은 결단코 너희에게 해를 주지 않을 것이다.” 춘앵과 벽란이 생각지도 못했는데 죽은 몸을 물에서 건져 내어 살려 주고 근본을 묻는 것을 들으니 매우 의심스럽고 괴이하다고 생각하며 다시 눈을 들어 두 공자를 보았다. 풍채가 시원하고 깨끗하며 골격이 비상하고 아름다운 얼굴과 별 같은 눈과 누에가 누워 있는 듯한 두 눈썹으로 인간 세상에서 뛰어났다. 반악(潘岳)*의 고움과 위개(衛玠)*의 미려함을 비웃는 듯하였다. 춘앵과 벽란이 크게 마음속 깊이 존경하며 복종하고 두 공자의 선함을 칭찬하였다.\n벽란 등이 마음속으로 생각하였다. ‘죽은 몸을 건져 내어 살려 주고 근본을 물으며 저 상공이 남녀를 자세히 구별할 줄 알고 하물며 우리 노비와 주인을 살려 내어 다시 살려 준 은혜가 매우 크다. 두 공자의 어진 덕이 눈빛에 나타나니 의연히 성인군자구나. 결단코 우리에게 해를 줄 사람이 아니니 우리 소저의 슬픈 한을 바른대 로 고하여 처리하는 것을 보아야겠구나.’이에 눈물을 떨어뜨리며 공경히 받들어 사례하며 말하였다. “천인(賤人)들은 민가의 시비이고 남자는 아닙니다. 우리 소저께서 태평성대에 액경(厄境)*이 남달리 심하여 남자의 옷을 입고 유리하여서 타인을 대하여 근본을 자세하게 아뢰지 못하옵니다. 강도의 흉악한 자취가 목전에 급하여 천금 같은 몸을 강물에 던져 속절없이 노비와 주인이 물고기의 배를 채울 뻔했는데, 상공의 자비하고 어진 마음을 만나게 되었고 상공의 살려 주신 은혜는 태산 같습니다. 감히 묻사온데 상공의 존귀한 성과 커다란 이름을 알고 난 후에 저희들의 지극한 원통함을 다 고하고자 합니다. 원컨대 귀댁의 시비 항렬에 들어가 은덕을 만분지일이나 갚고자 합니다.”두 공자는 두 사람의 언사가 민첩하고 재능이 세상을 뒤덮을 충의를 지닌 시비임을 보고 민가의 시비가 식견이 원대함을 계속해서 칭찬하며 말하였다.\n“너희들이 주인을 위하는 충성스러운 마음은 가히 기특하다. 우리는 조 상국 자제로 선영(先塋)에 절사(節祀)를 지내고 돌아오는 길이다. 너희들이 서울 사람이면 조 상국을 모르지 않을 것이다.” 벽란 등이 다 듣고 난 후에 이 사람이 자기 소저가 정혼하고 빙폐*를 받은 조 공자 형제라는 사실이 요행스러웠으며 기특하고 다행스럽다고 생각하였으나 소저의 뜻을 몰라 아뢰었다. “천인이 무식하여 주인의 휘자를 자세히 알지 못하니 소저께 물어서 자세히 아뢰겠습니다.”그런 후에 선창 안에 들어가 소저께 조 공자와 문답한 일을 일일이 고하였다. 소저가 매우 놀라며 말하였다.\n“내가 외가로 가지 않고 구차하게 길가에서 분주하게 다닌 것은 조 숙모에게 부끄럽고, 아버지의 허물을 드러내고 싶지 않아서였다. 뜻밖에 저 공자들을 만나니 내가 차마 사실을 말하여 부끄러움을 더하겠는가? 은인의 덕이 산과 바다 같으나 차마 근본을 아뢰게 되어 저 집에서 우리 집의 허물을 알게 되면 매우 부끄럽게 될 것이다. 모름지기 너는 다만 대답하기를 내가 타향에서 떠돌아다니다가 서울의 친척을 찾으러 왔다가 도적을 만나 물에 빠져 죽을 뻔했다고 말하여라. 조 공자가 이미 우리가 여자인 줄을 알았으니 남녀는 구별이 있는 것이다. 생명을 구해 준 은혜에 몸소 사례하지 못함을 아뢰어라.” 벽란과 춘앵이 굳이 근본을 이르지 말라는 소저의 말을 듣고 나와서 상의하여 말하였다.\n“이제 하늘이 도와주셔서 조 공자를 만났으나 어찌 차마 좋은 기회를 놓치게 되면 우리 주인과 노비는 어디에 의지하며 소저의 백년가약을 어느 날 이루겠는가? 우리들이 가만히 사실을 아뢰어 조공자가 일을 처리하는 것을 보아야겠구나.”이에 조 공자의 안전에 나가 말하였다. “우리 소저께서는 타향에서 떠돌아다니시다 친척을 찾으러 왔다가 도적을 만나 물에 빠져 죽게 되었습니다. 은인께서 생명을 구해 준 은혜를 입어 남은 목숨을 회생하게 되었습니다. 우리 소저께서 은혜는 태산 같사오나 몸소 사례치 못함을 아뢰라 하셨습니다.” 조 공자들이 크게 아쉬워하고 섭섭해하며 어떻게 일을 처리할까를 마음속 깊이 생각하고 주저하고 있었다. 두 명의 시비가 다시 머리를 조아리며 말하였다.\n“소저께서 차마 상공께 근본을 바로 고하지 못하여 이리하였습니다만, 저희들이야 상공을 만나 사실대로 고하지 아니하겠습니까? 더욱 대공자는 저희들의 주군이시고 은인이시니 어찌 숨기는 죄를 더하며 주인의 평생을 매몰되게 하겠습니까? 저희의 주인은 정 참정의 딸로 외가에서 조 공자와 정혼하였습니다. 그러나 소저가 본댁으로 돌아오신 후에 가내에 어질지 못한 사람이 있어서 수많은 방법으로 정 참정을 보채고 소저를 재해에 빠지게 하였습니다. 마침내는 소저를 정 참정 부인의 사촌인 박수관의 후실로 위협하고 명령하여 시집보내려 하였습니다. 그래서 소저가 외가로 가시고자하나 석공 어르신께서 성품이 엄숙하셔서 반드시 정 공과 더불어 큰 사달을 일으키실 것이라 생각하였습니다. 일의 형세가 매우 난처하여 소저께서는 남장으로 바꿔 입고 소저의 고모이신 강가의 이 평장 부인을 찾아가 의지하고자 하셨습니다. 그러나 이 평장 부인이 이사를 가신 지 수일이 지났고 가신 곳을 모르기 때문에 강변에서 방황하시다가 따르는 도적을 만나서 소저께서 억울하고 원통하게도 강물에 몸을 던졌습니다. 상공께서 저희의 목숨을 살려 주신 은혜를 만나 주인과 노비 세 사람이 살아나니 이 은덕은 분골쇄신하더라도 다 갚지 못할 것입니다.”두 공자가 이 말을 들으니 참혹함은 말할 것도 없고 정 소저의 굳은 절개와 아름다운 행동은 깊이 사람을 감동시킬 만하였다.\n또한 그 계모 박 씨가 자애롭지 못해 이 변을 일으킴을 짐작하고 사람의 마음이 자연스럽게 측은하였다. 정 소저의 절행이 빼어나 자기를 위하여 온갖 고생이 이 지경에 미쳤음에 감복하고 하물며 평생의 아름다운 배필과 하늘이 정한 연분이 심상치 않다는 것을 알았다. 용홍 공자의 두 눈에는 가을 물처럼 고운 광채가 어리었다. 용홍이 말하였다. “소저의 수많은 고초와 슬픈 한이 이 조생을 위함이니 어찌 감사하지 않겠는가? 너희들은 우리가 집에 들어가 일을 처리할 사이에 소저를 보호하라.”이에 둘째 공자와 의논하고 본부의 강정이 여기서 멀지 않은 까닭에 한 대의 교자를 세내어 소저를 태우고 강정에 이르렀다. 여러 명의 노복이 서서 정 소저를 지켰으며 안채에서는 두 명의 시비가 지키고 가늘고 길게 누에고치를 쳐서 길쌈하여 정 소저에게 올렸다.\n두 공자는 정 소저의 근본을 모르는 체하고 강정에 잠깐 몸을 숨길 것을 청하였다. 소저는 이 지경에 이르러 몸을 숨길 곳을 얻지 못하고 있다가 벽란 등이 자기 근본을 밝히고 믿음직스럽고 조심스럽게 자신을 보호함을 모르고 있었다. 소저는 두 공자가 종내 살 도리를 이끌어 주는 것에 감사해하고 설움을 참고 부끄러움을 견디며 강정에 이르렀다. 두 공자가 종에게 명령하여 깊고 안정한 처소를 치우고 정리하여 소저를 편안하게 안정시키고 아침 저녁의 음식을 각별히 조심해서 올리라고 말하였다. 또한 포진(鋪陳)과 병풍과 장막을 정결히 하여 정소저를 머무르게 하고 집 안팎의 비복에게 엄하게 당부하여 이곳에 소저가 있다는 것을 누설치 말라고 하였다. 춘앵 등에게 당부하여 자신의 처치를 기다리라고 하고 또 소저에게 말을 붙였다.\n“소생이 비록 소저의 사정을 알지 못하지만 소저의 재앙이 대단하십니다. 마침 제게 누추한 집이 있고 종이 안팎으로 많으니 안심하고 화를 피할 곳입니다. 가볍게 몸을 물에 던지지 마십시오. 저의 아버지께서 평생 적선(積善)을 일삼으시니 돌아가 아뢰어 혹시라도 소저께 유익함이 있을까 합니다.”말을 마치고 형제가 말 머리를 나란히 하여 도성으로 향하면서 다시 소저 보기를 청하지 아니하고 표연히 떠났다. 벽란 등은 탄복하고 기뻐하였으나 소저는 자기 형세가 이 지경까지 미쳐서 외간 남자를 상대하고 그들의 손에 의해 물에서 건져져서 살게 된 것을 생각하니 심신이 놀라 달아날 것 같았다. 그러나 요행히도 그 남자가 조 공자여서 몸을 절간에 의탁하고 평생을 마치며 조 공자의 은혜를 생각하려고 하였다. 그러나 얼음과 옥같이 깨끗한 마음에 이렇듯이 자신의 운수가 두루 기이하고 괴이함을 슬퍼하며 이 또한 운명이라고 생각하였다. 소저는 깊이 집 안에 있으면서 아침저녁의 음식 걱정이 없고 욕됨이 없었다. 두 명의 시비와 더불어 조생의 의기를 감탄하였으나 두 공자가 자기 근본을들은 줄은 조금도 알지 못했다.\n- 작자 미상, 「현몽쌍룡기」\n*반악: 서진(西晉)의 문학가. 어릴 때부터 신동(神童)이라 불렸고, 용모가 준수하였음.\n*위개: 진(晉)나라 안읍(安邑)의 사람으로, 뛰어난 외모와 수려한 인품으로 알려짐.\n*액경: 모질고 사나운 운수의 고비.\n*빙폐: 혼례를 올릴 때 신랑 측에서 신부 측에 보내는 예물.",

  "passage": "[앞부분 줄거리] ‘나’는 일본인이 주인인 가게의 점원으로, 어린 시절 자신을 돌봐 준 아주머니에게 폐만 끼치는 아저씨를 못마땅히 여긴다. 사회주의 운동을 하다 감옥에서 병에 걸려 온 아저씨는 아주머니의 정성스러운 간호로 병세가 호전되었지만, 여전히 집에만 머물러 있다. “이 애?” / “네?”“사람이란 것은 누구를 물론허구 말이다, 아첨하는 것같이 더러운 게 없느니라.” / “아첨이요?”“저 위로는 제왕, 밑으로는 걸인, 그 모든 사람이 위선 시방 이 제도의 이 세상에서 말이다, 제가끔 제 분수대루 살어가는 데 있어서 말이다, 제 개성을 속여 가면서꺼정 생활에다가 아첨하는 것같이 더러운 것이 없고, 그런 사람같이 가련한 사람은 없느니라. 사람이란 건 밥 두 그릇이 하필 밥 한 그릇보다 더 배가 부른 건 아니니까.”\n/ “그건 무슨 뜻인데요?”“네가 일본인 여자와 결혼을 해서 성명까지 갈고 모든 생활 법도를 일본화하겠다는 것이 말이다.”“네, 그게 좋잖어요?” “그것이 말이다, 진실로 깊은 교양이나 어진 지혜의 판단에서 우러나온 것이라면 그도 모를 노릇이겠지. 그렇지만 나는 보매, 네가 그런다는 것은 다른 뜻으로 그러는 것 같다.”“다른 뜻이라니요?” / “네 주인의 비위를 맞추고, 이웃의 비위를 맞추고 하자고…….”“그야 물론이지요! 다이쇼*의 신용을 받어야 하고, 이웃 내지*인들하구도 좋게 지내야지요. 그래야 할 게 아니겠어요?” / “…….”“아저씨는 아직두 세상 물정을 모르시오. 나이는 나보담 많구 대학교 공부까지 했어도 일찌감치 고 생살이를 한 나만큼 세상 물정은 모릅니다. 시방이 어느 세상인데 그러시우?”“이 애?” / “네?”“네가 방금 세상 물정이랬지?” / “네.”\n[A] “앞길이 환하니 트였다구 그랬지?” / “네.”\n“환갑까지 십만 원 모은다구 그랬지?” / “네.”\n“네가 말하는 세상 물정하구 내가 말하려는 세상 물정하구 내용이 다르기도 하지만, 세상\n물정이란 건 그야말로 그리 만만한 게 아니다.” / “네?”\n“사람이란 건 제아무리 날구뛰어도 이 세상에 형적 없이 그러나 세차게 주욱 흘러가는 힘, 그게 말하자면 세상 물정이겠는데, 결국 그것의 지배하에서 그것을 따라가지 별수가 없는 거다.” /“네?”“쉽게 말하면 계획이나 기회를 아무리 억지루 만들어 놓아도 결과가 뜻대루는 안 된단 말이다.”“젠장, 아저씨두…… 요전 『낑구』*라는 잡지에두 보니까, 나폴레옹이라는 서양 영웅이 그랬답디 다. 기회는 제가 만든다구. 그리고 불가능이란 말은 바보의 사전에서나 찾을 글자라구요. 아 자꾸자꾸 계획하구 기회를 만들구 해서 분투노력해 나가면 이 세상일 안 되는 일이 어디 있나요? 한번 실패하거든 갑절 용기를 내 가지구 다시 일어서지요. 칠전팔기 모르시오?”“나폴레옹도 세상 물정에 순응할 때는 성공했어도 그것에 거슬리다가 실패를 했더란다. 너는 칠전 팔기해서 성공한 몇 사람만 보았지, 여덟 번 일어섰다가 아홉 번째 가서 영영 쓰러지구는 다시 일지 못한 숱한 사람이 있는 건 모르는구나?”“그래두 두구 보시우. 나는 천하없어두 성공하구 말 테니…… 아저씨는 그래서 더구나 못써요? 일해 보기두 전에 안 될 줄로 낙심 먼저 하구…….”“하늘은 꼭 올라가 보구래야만 높은 줄 아니?”원 마지막 가서는 할 소리가 없으니 동에도 닿지* 않는 비유를 가져다 둘러대는 걸 보아.\n그게 어디 당한 말인고? 안 올라가 보면 뭐 하늘 높은 줄 모를 천하 멍텅구리도 있을까? (중략)“아저씨 올에 몇이지요?” / “서른셋.”“그러니 인제는 그만큼 해 두고 맘잡어서 집안일할 나이두 아니오?”“집안일은 해서 무얼 하나?” / “그렇기루 들면 그 짓은 해서 또 무얼 하나요?”“무얼 하려구 하는 게 아니란다.” / “그럼, 아무 희망이나 목적이 없으면서 그래요?”“목적? 희망?” / “네.”“개인의 목적이나 희망은 문제가 다르니까…… 문제가 안 되니까…….”“원, 그런 법도 있나요?” / “법?”“그럼요!” / “법이라!……”“아저씨?” / “…….”“아저씨?” / “왜 그래?”\n[B] “아주머니가 고맙    "어간이 'ㄹ'로 끝나는 모든 용언에서 규칙적으로 나타나기 때문에 '살다, 놀다, 갈다, 만들다' 등은 모두 불규칙 활용 용언이 아닌 규칙 활용 용언에 해당한다.",
   "<span class=\"teacher-underline teacher-q2\"><span class=\"badge-ans\">②·③ 정답 근거</span>어간이 'ㄹ'로 끝나는 모든 용언에서 <span class=\"hl-word\">규칙</span>적으로 나타나기 때문에 '살다, 놀다, 갈다, 만들다' 등은 모두 불규칙 활용 용언이 아닌 <span class=\"hl-word\">규칙</span> 활용 용언에 해당한다.</span>"
  ]
 ]
};

// Populate Overview Table
const tbody = document.getElementById('ovTbody');
let ovHtml = '';
DATA.forEach(d => {
    ovHtml += `<tr>
        <td class="num">${d.n}번</td>
        <td>${d.area}</td>
        <td>${d.type}</td>
        <td class="ans">${d.answer.replace(/\n/g, '<br>')}</td>
        <td style="text-align:center; font-weight:800;">${d.pts}점</td>
    </tr>`;
});
tbody.innerHTML = ovHtml;

// Populate Navigation Buttons
document.getElementById('navWrap').innerHTML = DATA.map(d => `<button class="nav" onclick="document.getElementById('q${d.n}').scrollIntoView({behavior:'smooth',block:'start'})">${d.n}</button>`).join('');

// Render Question Cards
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let listHtml = '';
DATA.forEach(d => {
    let passageHtml = d.passage;
    
    // Apply teacher underlines to passage
    if (REPLACEMENTS[d.n]) {
        REPLACEMENTS[d.n].forEach(([oldStr, newStr]) => {
            if (passageHtml.includes(oldStr)) {
                passageHtml = passageHtml.replace(oldStr, newStr);
            }
        });
    }
    
    const ps = passageHtml.split('\n').filter(x => x.trim()).map(x => '<p>' + x + '</p>').join('');
    
    // Filled Answer Boxes
    const bl = d.blanks.map(b => {
        const acceptVal = b.accept && b.accept.length > 0 ? b.accept[0] : '';
        return `<div class="brow">
            <div class="blabel">${esc(b.label)}</div>
            <div class="ans-box-filled">
                <span>${esc(acceptVal)}</span>
                <span class="icon-check">✔ 정답</span>
            </div>
        </div>`;
    }).join('');
    
    const cond = d.conditions.length ? '<div class="cond"><b>&lt;조건&gt;</b><br>' + d.conditions.map(c => '· ' + esc(c)).join('<br>') + '</div>' : '';
    const view = d.view ? '<div class="view"><div class="vl">&lt; 보 기 &gt;</div>' + esc(d.view).replace(/・/g, '<br>・') + '</div>' : '';
    
    listHtml += `<div class="q" id="q${d.n}">
        <div class="qhead">
            <div class="qn">${d.n}번</div>
            <div class="tag">${esc(d.area)}</div>
            <div class="tag">${esc(d.type)}</div>
            <div class="pts">${d.pts}점</div>
            <div class="src">${esc(d.source)}</div>
        </div>
        
        <div class="passage-wrap">
            <div class="passage" id="p${d.n}">${ps}</div>
        </div>
        <button class="pmore" data-p="${d.n}">지문 접기 ▴</button>
        
        <div class="prompt">${esc(d.prompt)}</div>
        ${view}
        ${cond}
        
        <div class="ans-section">
            <div class="ans-section-title">✏️ 교사용 모범 답안란 (정답 기재 완료)</div>
            ${bl}
        </div>
        
        <div class="sol" id="s${d.n}">
            <div class="h">
                <span>🎯 정답 및 채점 가이드</span>
                <span style="font-size:11.5px; opacity:0.9;">배점: ${d.pts}점</span>
            </div>
            <div class="b">${esc(d.answer)}</div>
            ${d.intent ? `<div class="s"><b>출제 의도:</b> ${esc(d.intent)}</div>` : ''}
            ${d.rubric ? `<div class="s"><b>채점 기준:</b> ${esc(d.rubric)}</div>` : ''}
        </div>
    </div>`;
});

document.getElementById('qList').innerHTML = listHtml;

// Interaction Controls
document.getElementById('btnToggleOv').addEventListener('click', function() {
    const ov = document.getElementById('overviewBox');
    const isShow = ov.style.display === 'block';
    ov.style.display = isShow ? 'none' : 'block';
    this.textContent = isShow ? '📊 정답 일람표 보기' : '📊 정답 일람표 닫기';
});

let allPassagesOpen = true;
document.getElementById('btnToggleAllPassages').addEventListener('click', function() {
    allPassagesOpen = !allPassagesOpen;
    document.querySelectorAll('.passage').forEach(p => {
        p.style.maxHeight = allPassagesOpen ? 'none' : '320px';
    });
    document.querySelectorAll('.pmore').forEach(b => {
        b.textContent = allPassagesOpen ? '지문 접기 ▴' : '지문 전체 펼치기 ▾';
    });
    this.textContent = allPassagesOpen ? '📖 지문 전체 기본보기' : '📖 지문 전체 펼치기';
});

let allSolOpen = true;
document.getElementById('btnToggleAllSol').addEventListener('click', function() {
    allSolOpen = !allSolOpen;
    document.querySelectorAll('.sol').forEach(s => {
        s.style.display = allSolOpen ? 'block' : 'none';
    });
    this.textContent = allSolOpen ? '💡 해설 전체 접기' : '💡 해설 전체 펼치기';
});

// Single Passage toggle
document.addEventListener('click', function(e) {
    const b = e.target.closest('.pmore');
    if (!b) return;
    const p = document.getElementById('p' + b.dataset.p);
    const isOpen = p.style.maxHeight === 'none' || p.style.maxHeight === '';
    p.style.maxHeight = isOpen ? '320px' : 'none';
    b.textContent = isOpen ? '지문 전체 펼치기 ▾' : '지문 접기 ▴';
});
</script>
</body>
</html>
