<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고전문학 어휘 암기 테스트 1차</title>
<meta property="og:title" content="고전문학 어휘 암기 테스트 1차 (1~21쪽)">
<meta property="og:description" content="수특·수완 고전문학 어휘집 1~21쪽 · 객관식 25 + 주관식 15 · 자동 채점">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* VOICE: 차분한 시험지, 학생이 바로 쓰는 도구
   IDEA: 한지 위에 먹으로 쓴 답안지
   PICTURE: 문항 카드 자체가 화면의 중심
   COLOUR and TYPE: 한지색 바탕, 먹색 글씨, 인주 빨강 강조 / Noto Sans KR
   LAYOUT: 한 줄 기둥, 위에 이름, 아래 채점 버튼 고정 */
:root{color-scheme:light;--bg:#f6f1e7;--card:#fffdf8;--ink:#1d1a15;--mute:#76695a;--line:#ddd2bf;--red:#c0272d;--ok:#1f6f43}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans KR',sans-serif;overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;font-weight:900}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.name{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.name label{font-weight:700;white-space:nowrap}
input[type=text]{-webkit-appearance:none;appearance:none;width:100%;min-height:44px;font:16px 'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=text]:focus{outline:2px solid var(--red);outline-offset:1px}
h2{font-size:17px;margin:24px 0 10px;padding-left:10px;border-left:4px solid var(--red)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;gap:10px;align-items:baseline}
.no{font-weight:900;color:var(--red);font-size:18px;width:26px;flex:none}
.w{font-weight:700;font-size:18px}
.w small{font-weight:400;color:var(--mute);font-size:13px;margin-left:4px}
.ex{font-size:14px;color:var(--mute);margin:4px 0 8px 36px}
.ex u{color:var(--ink);text-decoration-color:var(--red)}
.mean{font-size:15px;margin:2px 0 4px 36px}
.q input{margin-left:36px;width:calc(100% - 36px)}
.res{margin:6px 0 0 36px;font-size:14px;display:none}
.q.o{border-color:var(--ok)}.q.x{border-color:var(--red)}
.q.o .res{color:var(--ok);display:block}.q.x .res{color:var(--red);display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
button{-webkit-appearance:none;min-height:46px;border:0;border-radius:10px;font:700 16px 'Noto Sans KR',sans-serif;padding:0 18px;cursor:pointer}
#go{background:var(--red);color:#fff;flex:1}
#copy{background:var(--ink);color:var(--bg);display:none}
#score{font-weight:900;font-size:20px;white-space:nowrap;display:none}
#msg{font-size:13px;color:var(--mute);margin-top:6px;text-align:center;max-width:720px;margin-left:auto;margin-right:auto}
textarea{width:100%;height:120px;font:13px monospace;display:none;margin-top:8px}
.note{font-size:13px;color:var(--mute);margin-top:18px}
.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0 0 36px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:15px;line-height:1.45}
.opt input{margin:3px 0 0;width:auto;flex:none;accent-color:var(--red)}
.opt.sel{border-color:var(--ink)}
.q.o .opt.right,.q.x .opt.right{border-color:var(--ok);background:#eef6f0}
.hint{font-size:13px;color:var(--mute);margin:2px 0 6px 36px}</style>
</head>
<body>
<div class="wrap">
  <h1>고전문학 어휘 암기 테스트 1차</h1>
  <p class="sub">수특·수완 고전문학 어휘집 1~21쪽 · 40문항(각 1점)</p>
  <div class="name"><label for="nm">이름</label><input type="text" id="nm" autocomplete="off" placeholder="이름을 쓰세요"></div>
  <h2>Ⅰ. 밑줄 친 어휘의 뜻으로 옳은 것을 고르시오. (1~25)</h2>
  <div id="pa"></div>
  <h2>Ⅱ. 뜻을 보고 (　) 안에 들어갈 어휘를 쓰시오. (26~40)</h2>
  <div id="pb"></div>
  <p class="note">Ⅱ는 어휘집 표기 그대로 써야 정답입니다(띄어쓰기는 보지 않음).</p>
  <textarea id="ta" readonly></textarea>
</div>
<div class="bar"><div class="in"><span id="score"></span><button id="go" type="button">채점하기</button><button id="copy" type="button">카톡 보고 복사</button></div><div id="msg"></div></div>
<script>
(function(){
var A=[["춘풍", "春風", "<u>춘풍</u>에 향기 좇는 나비를 웃고 맞이하노라", ["흉년과 풍년.", "봄바람.", "붓의 별칭.", "세상을 구제함.", "명예와 이익."], 1], ["질", "質", "<u>질</u>(質) 좋은 잣이", ["임금의 은혜에 공손히 사례함.", "가난과 부귀.", "왕의 자손과 귀한 집안의 자제.", "마을을 지켜 준다는 서낭신.", "바탕. 본바탕."], 4], ["소", "沼", "여울은 어디 두고 <u>소</u>(沼)에 자러 오느냐", ["부대의 맨 앞에 서서 나아가는 군대나 사람.", "땅바닥이 둘러빠지고 물이 깊게 된 곳. 늪.", "온 조정. 조정의 모든 신하.", "그리 높지 않은 공중.", "예전의 병법에서, 한 줄로 길게 벌인 군진(軍陣)의 하나."], 1], ["성적", "", "내 양자 하 험하니 비누 <u>성적</u> 아니하네", ["복숭아꽃.", "붓의 별칭.", "간사한 꾀.", "봄바람.", "화장."], 4], ["남풍시", "南風詩", "…의 술을 부어 벽오동 거문고 새 줄 얹어 무릎에 얹고 <u>남풍시</u> 화답하여 강구연월에 누웠으니", ["버드나무 가는 가지가 실처럼 늘어져 푸른데 황산곡 속에 봄철을 만남.", "순임금이 오현금을 타며 불렀다는 노래.", "지면이나 수면이 아주 넓음.", "마음껏 음탕하게 놂.", "영광과 욕됨을 노래함."], 1], ["교태", "嬌態", "녹양에 우는 꾀꼬리 <u>교태</u> 겨워하는구나", ["남에게 큰 잘못을 저질러 죄를 지음.", "사람이 변변하지 못하고 졸렬하다.", "사람으로서 지켜야 할 바른 도리.", "아양을 부리는 태도.", "장대에 매달아 전승(戰勝)을 보도하는 표시."], 3], ["일과처", "", "여산 송백 무릉 춘초(春草)는 만고영웅 <u>일과처</u> 라", ["붓의 별칭.", "한 번 지나간 곳.", "뛰어나게 좋은 경치.", "만 번 죽어도 아깝지 아니함.", "나라를 다스림. 또는 그런 포부."], 1], ["흉풍", "凶豐", "<u>흉풍</u>(凶豐)도 보려니와 부모 봉양 생각하라", ["흰 바위.", "명아주 줄기로 만든 지팡이.", "흉년과 풍년.", "천금을 주고 산 날랜 말.", "소금으로 간을 한 음식."], 2], ["솟국", "", "설날 큰 명절에 <u>솟국</u>에 떡을 쑤어", ["고기를 넣지 않고 끓인 국.", "추운 계절에도 혼자 지키는 절개.", "(옛말) 그르다. 잘못되다.", "금으로 만든 술통.", "세상을 구제함."], 0], ["박정", "薄情", "임이 언제 <u>박정</u>(薄情)하여 날 대접 소홀히 했나", ["인정이 박함.", "신선이 산다는 삼신산.", "아주 급한 때. 잠깐 사이.", "뽕나무밭이 푸른 바다가 됨.", "(옛말) 그릇되게. 잘못."], 0], ["제세", "濟世", "경륜을 내 알더냐 <u>제세</u> 할 이 없을러냐", ["표주박 하나.", "세상을 구제함.", "붓의 별칭.", "혼인을 정함.", "절개. 대나무의 마디와 중의적."], 1], ["제비하다", "", "낙하와 외로운 따오기는 조모(朝暮)에 <u>제비하다</u>", ["(옛말) 그릇되게. 잘못.", "경사(慶事)의 노래.", "사랑하는.", "나란히 날다.", "사신의 행차."], 3], ["단표자", "單瓢子", "죽장망혜(竹杖芒鞋) <u>단표자</u>(單瓢子)로 천리 강산 들어가니", ["억울하지 않음.", "자기 나라를 배반한 역적.", "표주박 하나.", "혼자서 말을 타고 감.", "공급이 끊어져 아주 없어짐."], 2], ["일엽", "一葉", "지담에 떴는 배는 <u>일엽</u>(一葉)이 가볍고", ["상산으로 지초를 뜯으러.", "큰 곤장으로 삼십 대를 때림.", "중국 춘추 시대 진나라의 충신.", "한 척의 작은 배.", "붓의 별칭."], 3], ["장사진", "", "우리 군대의 진법은 고작해야 <u>장사진</u> 뿐이고, 용렬한 장수와 나약한 병사들은 적을 보면 미…", ["예전의 병법에서, 한 줄로 길게 벌인
