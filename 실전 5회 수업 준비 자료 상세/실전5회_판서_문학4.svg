<svg viewBox="0 0 1640 900" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Pen Script','Gaegu',cursive" style="width:100%;height:auto;display:block;border-radius:14px;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#164531"/><stop offset="1" stop-color="#0f3324"/></linearGradient></defs><rect x="0" y="0" width="1640" height="900" rx="18" fill="url(#bg)"/><rect x="10" y="10" width="1620" height="880" rx="12" fill="none" stroke="#3a5a48" stroke-width="8"/><text x="820.0" y="78" fill="#ffe486" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">💼 미생 : 백기의 갈등과 성장</text><line x1="440.0" y1="96" x2="1200.0" y2="96" stroke="#ffe486" stroke-width="3" stroke-linecap="round"/><path d="M420.0,70 Q280.0,150 240.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><path d="M1220.0,70 Q1360.0,150 1400.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><text x="120" y="150" fill="#7fe0c8" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">※ 갈래 : 드라마 극본 (S#·지시문·Flashback)</text><rect x="110" y="190" width="310" height="80" rx="16" fill="none" stroke="#ff9db2" stroke-width="3"/><text x="265" y="240" fill="#ff9db2" font-size="25" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">S#58 기본기</text><text x="265" y="305" fill="#7fe0c8" font-size="22" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">㉠ 반발</text><rect x="470" y="190" width="310" height="80" rx="16" fill="none" stroke="#ffc078" stroke-width="3"/><text x="625" y="240" fill="#ffc078" font-size="25" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">S#59 조급함</text><text x="625" y="305" fill="#7fe0c8" font-size="22" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">㉡ 지적</text><rect x="830" y="190" width="310" height="80" rx="16" fill="no