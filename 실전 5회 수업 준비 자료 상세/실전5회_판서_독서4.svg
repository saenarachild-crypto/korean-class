<svg viewBox="0 0 1640 900" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Pen Script','Gaegu',cursive" style="width:100%;height:auto;display:block;border-radius:14px;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#164531"/><stop offset="1" stop-color="#0f3324"/></linearGradient></defs><rect x="0" y="0" width="1640" height="900" rx="18" fill="url(#bg)"/><rect x="10" y="10" width="1620" height="880" rx="12" fill="none" stroke="#3a5a48" stroke-width="8"/><text x="820.0" y="78" fill="#ffe486" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">♻️ 바이오 플라스틱 &amp; 미세 플라스틱</text><line x1="440.0" y1="96" x2="1200.0" y2="96" stroke="#ffe486" stroke-width="3" stroke-linecap="round"/><path d="M420.0,70 Q280.0,150 240.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><path d="M1220.0,70 Q1360.0,150 1400.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><text x="120" y="185" fill="#ffe486" font-size="30" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">(가) 바이오 플라스틱</text><rect x="90" y="210" width="560" height="330" rx="20" fill="none" stroke="#a8e6a1" stroke-width="3"/><text x="370.0" y="258" fill="#a8e6a1" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">생분해성 플라스틱</text><text x="116" y="310" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">미생물·효소 → 물·CO₂ 분해</text><text x="116" y="362" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">PLA(바이오매스)·PBAT(석유)</text><text x="116" y="414" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">장점 : 미세 P 억제, 처리비↓</text><text x="116" y="466" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">단점 : 제조비↑·시설↓·식량</text><rect x="690" y="210" width="560" height="330" rx="20" fill="none" stroke="#ffc078" stroke-width="3"/><text x="970.0" y="258" fill="#ffc078" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">바이오 베이스 플라스틱</text><text x="716" y="310" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">바이오매스 원료 &#x27;일부&#x27;</text><text x="716" y="362" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">분해성 = 난분해(일반과 同)</text><text x="716" y="414" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">CO₂ 순배출↓ → 온난화 방지</text><text x="716" y="466" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">생산성·가격 우수</text><text x="970.0" y="518" fill="#7fe0c8" font-size="23" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">예) 바이오 폴리에틸렌</text><text x="120" y="590" fill="#9ad8ff" font-size="28" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">(나) 미세 플라스틱 (5mm 미만, 나노 1µm↓)</text><rect x="90" y="620" width="1460" height="210" rx="18" fill="none" stroke="#ff9db2" stroke-width="2.5"/><text x="120" y="668" fill="#ff9db2" font-size="28" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">◆ 크기별 호흡기 &#x27;침착&#x27; 방식 (자주 나오는 함정!)</text><text x="140" y="718" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">2~3µm → 관성 &#x27;충돌&#x27; (기관지 상부)</text><text x="140" y="762" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">1~2µm → 중력 &#x27;침강&#x27; (기관지 하부)</text><text x="140" y="806" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">1µm 이하 → &#x27;브라운 운동&#x27; (점막)  ⇒ 혈류 침투 → 순환·신경·내분비계 영향</text></svg>