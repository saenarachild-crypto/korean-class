-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">방탕·사치·허위</text><text x="265" y="645" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">몰락·하강</text><text x="265" y="688" fill="#ff9db2" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 풍자의 대상</text><rect x="860" y="510" width="540" height="190" rx="16" fill="none" stroke="#a8e6a1" stroke-width="2"/><text x="885" y="555" fill="#a8e6a1" font-size="30" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">춘풍의 아내</text><text x="885" y="600" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">근면·지혜·주도</text><text x="885" y="645" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">상승·주도권 장악</text><text x="885" y="688" fill="#a8e6a1" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 풍자의 주체</text><text x="820" y="610" fill="#ffe486" font-size="60" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">↔</text><text x="820.0" y="780" fill="#ffe486" font-size="28" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">주제 : 진취적 여성상 긍정 &amp; 방탕·허위 인물 풍자</text></svg>