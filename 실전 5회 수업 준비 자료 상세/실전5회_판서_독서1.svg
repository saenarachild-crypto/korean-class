<svg viewBox="0 0 1640 900" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Pen Script','Gaegu',cursive" style="width:100%;height:auto;display:block;border-radius:14px;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#164531"/><stop offset="1" stop-color="#0f3324"/></linearGradient></defs><rect x="0" y="0" width="1640" height="900" rx="18" fill="url(#bg)"/><rect x="10" y="10" width="1620" height="880" rx="12" fill="none" stroke="#3a5a48" stroke-width="8"/><text x="820.0" y="78" fill="#ffe486" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">㉠㉡ 추론적 독해 : 복원 추론 vs 연장 추론</text><line x1="440.0" y1="96" x2="1200.0" y2="96" stroke="#ffe486" stroke-width="3" stroke-linecap="round"/><path d="M420.0,70 Q280.0,150 240.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><path d="M1220.0,70 Q1360.0,150 1400.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><text x="820.0" y="150" fill="#f4f4ec" font-size="29" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">축자적 의미만으론 &#x27;응집성&#x27; 파악 어려움 → 추론 필요</text><rect x="90" y="220" width="700" height="340" rx="20" fill="none" stroke="#9ad8ff" stroke-width="3"/><text x="120" y="275" fill="#9ad8ff" font-size="38" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">㉠ 복원 추론</text><text x="120" y="335" fill="#f4f4ec" font-size="28" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 명시된 단서 연결·참조</text><text x="120" y="388" fill="#ffe486" font-size="28" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 목적 : 본래 의미 &#x27;복구&#x27;</text><text x="120" y="441" fill="#a8e6a1" font-size="28" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 배경지식 영향 → 작음</text><text x="120" y="500" fill="#ffe486" font-size="28" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">→ 명시 의미 (객관·기본)</text><text x="140" y="540" fill="#7fe0c8" font-size="24" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">(전방 추론 / 후방 추론)</text><rect x="850" y="220" width="700" height="340" rx="20" fill="none" stroke="#a8e6a1" stroke-width="3"/><text x="880" y="275" fill="#a8e6a1" font-size="38" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">㉡ 연장 추론</text><text x="880" y="335" fill="#f4f4ec" font-size="28" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 명시 의미 + 배경지식 &#x27;능동 선택&#x27;</text><text x="880" y="388" fill="#ff9db2" font-size="28" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 조건 : 상위 맥락 적합!</text><text x="880" y="441" fill="#ffc078" font-size="28" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 배경지식 영향 → 큼</text><text x="880" y="500" fill="#ffe486" font-size="28" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">→ 확장 의미 (다양하게 생성)</text><line x1="790" y1="390" x2="850" y2="390" stroke="#ffe486" stroke-width="4" stroke-linecap="round"/><polyline points="835,396 850,390 835,384" fill="none" stroke="#ffe486" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="620" width="1040" height="200" rx="20" fill="none" stroke="#ffc078" stroke-width="2.5"/><text x="330" y="672" fill="#ffc078" font-size="32" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">⚠ 오독 위험 &amp; 점검 태도</text><text x="360" y="725" fill="#ff9db2" font-size="27" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">상위 맥락 무시 + 배경지식만 앞세움 → 오독!</text><text x="360" y="775" fill="#f4f4ec" font-size="27" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 객관적 근거에 기반하는지 &#x27;점검&#x27; → 숙련된 독자</text></svg>