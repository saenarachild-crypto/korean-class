e-width="2.5"/><text x="330" y="682" fill="#ffe486" font-size="30" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">주제</text><text x="360" y="735" fill="#f4f4ec" font-size="27" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">억압적 병원 시스템 비판 &amp; 웃음을 잃은 의료진에 대한 연민</text><text x="360" y="782" fill="#7fe0c8" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">(개인의 저항은 번번이 &#x27;실패&#x27; → 균열 내기의 한계)</text></svg>