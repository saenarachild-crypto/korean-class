:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;

.wrap{max-width:860px;margin:0 auto;padding:0 14px 80px;}

header{background:#243447;color:#fff;padding:22px 14px 18px;margin-bottom:14px;}

header h1{margin:0 0 6px;font-size:1.22rem;letter-spacing:-0.5px;}
header p{margin:0;font-size:0.86rem;color:#b8c4d4;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;

.search{width:100%;padding:11px 12px;font-size:1rem;border:1px solid var(--line);

.search:focus{outline:none;border-color:var(--pt);background:#fff;}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{padding:6px 11px;font-size:0.84rem;border:1px solid var(--line);border-radius:20px;
  background:#fff;color:var(--sub);cursor:pointer;}
.chip.on{background:var(--pt);border-color:var(--pt);color:#fff;}

.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--line);}
.btn{padding:7px 12px;font-size:0.84rem;border:1px solid var(--line);border-radius:8px;

.btn.on{background:var(--warn);border-color:var(--warn);color:#fff;}
.stat{font-size:0.82rem;color:var(--sub);margin-top:9px;}

h2.gtitle{font-size:0.92rem;margin:20px 0 8px;padding-left:9px;
  border-left:4px solid var(--pt);color:#243447;}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;

.card.done{border-color:#9fc39f;}
.chead{display:flex;align-items:flex-start;gap:8px;padding:12px 13px;cursor:pointer;}
.chead .meta{flex:1;min-width:0;}

.ttl{font-weight:700;font-size:0.99rem;letter-spacing:-0.3px;}
.pos{font-size:0.76rem;color:var(--sub);margin-top:2px;}
.mark{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:#c3c7cd;font-size:0.85rem;line-height:24px;text-align:center;
  flex:0 0 auto;cursor:pointer;}
.card.done .mark{background:#5f9e5f;border-color:#5f9e5f;color:#fff;}

.body{display:none;padding:0 13px 6px;}
.card.open .body{display:block;}
.term{padding:9px 0;border-top:1px dashed var(--line);}
.term.s3{border-left:3px solid #e0a11a;padding-left:8px;margin-left:-8px;}
.tname{font-weight:700;color:#14314f;font-size:0.94rem;}
.stars{color:#e0a11a;font-size:0.78rem;letter-spacing:1px;margin-left:5px;

.stars .off{color:#d7dbe0;}
.hot{font-size:0.72rem;color:#b4531c;margin-left:4px;}
.legend{font-size:0.76rem;color:var(--sub);margin-top:8px;line-height:1.5;}
.tdef{font-size:0.9rem;color:#3c4450;margin-top:2px;}
body.quiz .tdef{background:#eceef1;color:#eceef1;border-radius:5px;cursor:pointer;}
body.quiz .tdef.show{background:transparent;color:#3c4450;}

footer{margin-top:24px;font-size:0.78rem;color:var(--sub);text-align:center;line-height:1.7;}

@media print{

  body{background:#fff;font-size:11pt;}

<script>
var STORE = "dokseo_gaenyeom_v1";
var AREAS = ["독서","인문","사회","과학","기술","예술"];
var state = { q:"", areas:{}, book:"all", quiz:false, allOpen:false, minStar:1 };
var done = {};

function load(){
  try{
    var raw = window.localStorage.getItem(STORE);
    if(raw){ done = JSON.parse(raw) || {}; }
  }catch(e){ done = {}; }
}
function save(){
  try{ window.localStorage.setItem(STORE, JSON.stringify(done)); }catch(e){}
}
function key(d){ return d.b + "-" + d.p + "-" + d.t; }

function buildChips(){
  var box = document.getElementById("chips");
  var html = '<span class="chip on" data-k="book" data-v="all">전체 교재</span>';
  html += '<span class="chip" data-k="book" data-v="수특">수능특강</span>';
  html += '<span class="chip" data-k="book" data-v="수완">수능완성</span>';
  for(var i=0;i<AREAS.length;i++){
    html += '<span class="chip" data-k="area" data-v="'+AREAS[i]+'">'+AREAS[i]+'</span>';
  }
  box.innerHTML = html;
  var chips = box.getElementsByClassName("chip");
  for(var j=0;j<chips.length;j++){
    chips[j].onclick = function(){
      var k = this.getAttribute("data-k");
      var v = this.getAttribute("data-v");
      if(k === "book"){
        state.book = v;
        var bs = document.querySelectorAll('.chip[data-k="book"]');
        for(var m=0;m<bs.length;m++){ bs[m].className = "chip"; }
        this.className = "chip on";
      }else{
        if(state.areas[v]){ delete state.areas[v]; this.className = "chip"; }
        else{ state.areas[v] = 1; this.className = "chip on"; }
      }
      render();
    };
  }
}

function match(d){
  if(state.book !== "all" && d.b !== state.book) return false;
  var any = false, k;
  for(k in state.areas){ if(state.areas.hasOwnProperty(k)){ any = true; break; } }
  if(any && !state.areas[d.c]) return false;
  if(state.q){
    var q = state.q.replace(/\s/g,"");
    var hay = d.t + d.c + d.g;
    for(var i=0;i<d.w.length;i++){ hay += d.w[i][0] + d.w[i][1]; }
    if(hay.replace(/\s/g,"").toLowerCase().indexOf(q.toLowerCase()) < 0) return false;
  }
  return true;
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function starHtml(n){
  var s = "";
  for(var i=1;i<=3;i++){
    s += (i <= n) ? "★" : '<span class="off">★</span>';
  }
  return '<span class="stars">' + s + '</span>';
}

function render(){
  var list = document.getElementById("list");
  var out = "", group = "", shown = 0, terms = 0, doneCount = 0;
  for(var i=0;i<DATA.length;i++){
    var d = DATA[i];
    if(!match(d)) continue;
    var picked = [];
    for(var x=0;x<d.w.length;x++){
      var st = d.w[x][2] ? d.w[x][2] : 2;
      if(st >= state.minStar) picked.push(d.w[x]);
    }
    if(picked.length === 0) continue;
    var hot = 0;
    for(var y=0;y<d.w.length;y++){ if(d.w[y][2] === 3) hot++; }
    shown++; terms += picked.length;
    var g = d.b + " · " + d.g;
    if(g !== group){ group = g; out += '<h2 class="gtitle">' + esc(group) + '</h2>'; }
    var k = key(d);
    var isDone = done[k] ? " done" : "";
    if(done[k]) doneCount++;
    var op = state.allOpen ? " open" : "";
    out += '<div class="card' + isDone + op + '" data-k="' + esc(k) + '">';
    out += '<div class="chead"><div class="meta">';
    out += '<span class="tag' + (d.b === "수완" ? " b" : "") + '">' + esc(d.b) + '</span>';
    out += '<span class="tag">' + esc(d.c) + '</span>';
    out += '<span class="ttl">' + esc(d.t) + '</span>';
    out += '<div class="pos">' + esc(d.g) + ' · ' + esc(d.p) + '쪽 · 개념어 ' + picked.length + '개';
    out += '<span class="hot">★★★ ' + hot + '개</span></div>';
    out += '</div><div class="mark">✓</div></div>';
    out += '<div class="body">';
    for(var j=0;j<picked.length;j++){
      var t3 = (picked[j][2] === 3) ? " s3" : "";
      out += '<div class="term' + t3 + '"><div class="tname">' + esc(picked[j][0]);
      out += starHtml(picked[j][2] ? picked[j][2] : 2) + '</div>';
      out += '<div class="tdef">' + esc(picked[j][1]) + '</div></div>';
    }
    out += '</div></div>';
  }
  if(shown === 0){ out = '<div class="none">조건에 맞는 지문이 없습니다.</div>'; }
  list.innerHTML = out;
  document.getElementById("stat").innerHTML =
    "지문 " + shown + "개 · 개념어 " + terms + "개 · 완료 " + doneCount + "개";
  bind();
}

function bind(){
  var cards = document.getElementsByClassName("card");
  for(var i=0;i<cards.length;i++){
    var c = cards[i];
    var head = c.getElementsByClassName("chead")[0];
    var mark = c.getElementsByClassName("mark")[0];
    head.onclick = function(e){
      var card = this.parentNode;
      if(card.className.indexOf("open") >= 0){
        card.className = card.className.replace(" open","");
      }else{
        card.className = card.className + " open";
      }
    };
    mark.onclick = function(e){
      if(e && e.stopPropagation) e.stopPropagation();
      var card = this.parentNode.parentNode;
      var k = card.getAttribute("data-k");
      if(done[k]){ delete done[k]; } else { done[k] = 1; }
      save();
      render();
      return false;
    };
  }
  var defs = document.getElementsByClassName("tdef");
  for(var j=0;j<defs.length;j++){
    defs[j].onclick = function(e){
      if(e && e.stopPropagation) e.stopPropagation();
      if(this.className.indexOf("show") >= 0){ this.className = "tdef"; }
      else{ this.className = "tdef show"; }
    };
  }
}

function init(){
  load();
  buildChips();
  render();
  document.getElementById("q").onkeyup = function(){
    state.q = this.value; render();
  };
  document.getElementById("starBtn").onclick = function(){
    if(state.minStar === 1){ state.minStar = 3; this.innerHTML = "★★ 이상 보기"; this.className = "btn on"; }
    else if(state.minStar === 3){ state.minStar = 2; this.innerHTML = "전체 보기"; this.className = "btn on"; }
    else{ state.minStar = 1; this.innerHTML = "★★★만 보기"; this.className = "btn"; }
    render();
  };
  document.getElementById("quizBtn").onclick = function(){
    state.quiz = !state.quiz;
    document.body.className = state.quiz ? "quiz" : "";
    this.className = state.quiz ? "btn on" : "btn";
  };
  document.getElementById("openBtn").onclick = function(){
    state.allOpen = !state.allOpen;
    this.innerHTML = state.allOpen ? "모두 접기" : "모두 펼치기";
    render();
  };
  document.getElementById("printBtn").onclick = function(){
    state.allOpen = true; render(); window.print();
  };
  document.getElementById("resetBtn").onclick = function(){
    if(window.confirm("완료 체크를 모두 지울까요?")){ done = {}; save(); render(); }
  };
}

window.onerror = function(){
  var l = document.getElementById("list");
  if(l){ l.innerHTML = '<div class="none">화면을 불러오지 못했습니다.<br>브라우저를 최신 버전으로 업데이트하거나 다른 브라우저에서 열어 주세요.</div>'; }
  return true;
};

if(document.addEventListener){
  document.addEventListener("DOMContentLoaded", init, false);
}else{
  window.onload = init;
}
</script>
</body>
</html>
