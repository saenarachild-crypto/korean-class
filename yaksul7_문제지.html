<script>

  "source": "EBS 2027학년도 수능특강 국어영역 화법과 작문, 02강 (스마트폰 사용 규제에 관한 토론) | EBS 문항코드: 26003-0154~0158",
  "passage": "(가)는 학교 신문에 실린 글이고, (나)는 (가)가 보도된 이후에 학교에서 개최된 토론의 일부이다. 물음에 답하시오.\n(가)\n우리 학교 학생들의 스마트폰 사용 실태와 인식 조사\nI. 조사의 배경과 목적\n최근 우리 학교에서는 교내 스마트폰 사용에 대한 논의가 활발하게 이루어지고 있다. 학생들 사이에서 스마트폰을 무분별하게 사용하는 것에 대한 문제의식이 커지고 있기 때문이다. 이에 학생들이 스마트폰을 사용하면서 스스로 느낀 변화나 그에 따른 문제점에 어떤 것이 있는지 궁금해졌다. 그래서 학생들의 스마트폰 사용 실태와 인식을 조사하여 학생들의 스마트폰 사용 습관의 문제점을 진단해 보고자 한다. II. 조사 방법\n1. 설문 조사\n- 대상: ○○ 고등학교 재학생 200명\n- 기간: 2026년 6월 ×일~6월 ××일\n- 방법 및 내용: 설문지를 사용하여 스마트폰 사용 시간, 목적 등의 실태를 파악함.\n2. 심층 면담\n- 대상: ○○ 고등학교 재학생 30명\n- 기간: 2026년 6월 ××일~7월 ×일\n- 방법 및 내용: 재학생 중 30명을 무작위로 선정하여 면담을 진행함. 주제에 관한 내용을 자유롭게 면담하여 스마트폰 사용에 관한 인식을 조사함. III. 조사 결과\n1. 설문 조사 결과\n1) 주간 스마트폰 사용 시간\n우리 학교 학생들의 주간 스마트폰 사용 시간은 평균 12.9시간이었다. 학생들에게 자신의 스마트폰 사용 시간에 대한 생각을 설문한 결과, 60.5%의 학생들이 ‘과도하다’라고 응답했다.\n2) 스마트폰을 사용하는 목적\n전체 스마트폰 사용 시간을 100%로 볼 때, 목적별 사용 비중을 조사한 결과는 다음과 같다.\n3) 주로 이용하는 모바일 콘텐츠(복수 응답)\n2. 심층 면담 결과\n1) 스마트폰 사용 시간에 대한 조절 가능성\n스마트폰 사용 시간이 과도하다고 인식하는 학생들이 많다는 설문 결과에 기초하여, 면담에서 학생들에게 스마트폰 사용 시간을 본인의 의지대로 조절할 수 있는지 물어보았다. 그 결과 면담 대상 학생 중 대부분이 스마트폰 사용 시간을 본인의 의지대로 조절하는 데에 어려움을 겪고 있다고 말했다. 그리고 학생들은 동영상 콘텐츠를 이용하는 경우 사용 시간을 조절하기가 특히 어렵다고 말했다.\n2) 스마트폰 사용으로 인한 폐해 경험\n많은 학생이 스마트폰을 장시간 사용하여 근육통, 안구 건조 등 신체적 불편을 경험했다. 그리고 학습이나 수면에 방해를 받은 적이 있다는 경우가 많았다. 정신적 측면에서 대부분의 학생이 스마트폰을 주기적으로 확인하지 못하면 불안감을 느꼈고, 그중에는 우울을 호소하는 학생들도 일부 있었다.\n3) 과도한 스마트폰 사용에 따른 문제 해결을 위해 필요한 것\n학생들은 문제 해결을 위해 개인과 가정의 노력이 가장 중요하다고 말했다. 구체적으로는 스마트폰 사용을 대체할 수 있는 여가 활동을 하려 노력하고, 가족들의 도움을 바탕으로 자기 조절 능력을 강화해야 한다고 말했다. 그리고 학교에서도 건강한 여가 활용 방안과 스마트폰 과의존 예방에 관한 교육이 이루어져야 한다고 답했다. 거기에 더해 정부 차원에서도 법과 제도를 개선할 필요가 있다고 답했다. IV. 결론 학생들은 여가 활동, 소통 등을 목적으로 주간 평균 12.9시간 동안 스마트폰을 이용하고 있었고 자신의 스마트폰 이용 시간이 과도하다고 생각하는 경우가 60.5%나 되었다. 그리고 학생들 중에는 스마트폰 이용 시간 조절에 어려움을 겪는 경우가 많았고, 스마트폰 이용으로 신체적, 정신적 불편을 경험한 학생들도 많았다. 이는 학생들이 스마트폰을 과도하게 사용하고 있으면서도 사용 습관을 스스로 통제하기 어려워하고 있을 뿐 아니라 그로 인한 부작용도 겪고 있음을 보여 준다.\n따라서 학생들이 올바른 스마트폰 사용 습관을 길러 이를 바탕으로 스마트폰을 분별력 있게 활용할 수 있도록 지원할 필요가 있다. 이를 위해 개인과 가정, 학교, 정부 차원에서의 다각적인 노력이 필요할 것이다.\n(나)\n진행자: 최근 세계 곳곳에서 청소년의 누리 소통망〔SNS〕 이용을 규제하려는 움직임이 나타나고 있습니다. 스마트폰 과의존을 예방하고, 각종 유해 콘텐츠로부터 청소년을 보호하자는 취지인데요, 한편으로는 청소년의 자유를 지나치게 억압한다며 우려하는 사람도 많습니다. 또 학교 신문의 보도에 따르면 우리 학교에서도 무분별한 스마트폰 사용에 따른 문제점을 인식하고 이를 해결해야 한다는 목소리가 높습니다. 이 보도 내용을 바탕으로 오늘은 ‘청소년의 누리 소통망 이용 시간을 법적으로 규제해야한다’를 논제로 토론하겠습니다. 먼저 찬성 측부터 입론해 주십시오.\n찬성 1: 저는 청소년의 누리 소통망 이용 시간을 법적으로 규제해야 한다고 생각합니다. 여기서 누리 소통망이란 정보 통신망을 통해 이용자가 소통 등의 목적으로 문자, 음성, 영상 등을 교환할 수 있는 서비스를 말합니다. 2024년에 조사된 결과에 따르면 청소년의 약 37%가 누리 소통망에서 보내는 시간으로 인해 일상생활에 지장을 받는 것으로 나타났습니다. 우리 학교에도 스마트폰으로 누리 소통망상의 메신저나 동영상을 이용하는 학생들이 많은데, 그중에는 자신의 스마트폰 사용 시간이 과도하다고 생각하면서도 시간을 조절하지 못하는 경우가 많았습니다. 이는 청소년들이 누리 소통망 이용 시간을 스스로 조절하는 데 어려움을 겪고 있음을 보여 줍니다. 또 누리 소통망 이용을 위해 스마트폰을 장시간 사용하면 목이나 손목의 통증 및 안구 건조, 시력 저하 등이 나타날 수 있고, 학습 집중력이 저하되며, 수면 시간 확보에도 어려움이 따르게 됩니다.\n또한 스마트폰에 대한 의존도가 높아지면서 불안,우울 등을 겪을 수도 있습니다. 따라서 누리 소통망 이용 시간을 법적으로 규제하여 스마트폰 과의존을 막고 신체적, 정신적으로 건강한 생활을 할 수 있도록 청소년들을 보호해야 합니다. 주목해야 할 점은 이러한 문제의식을 개인의 문제로 국한하지 않고 국가적 차원으로 확대하여 적극적인 규제 방안을 마련하는 것이 이미 전 세계적 추세라는 것입니다.\n예를 들어 미국의 일부 지역에서는 만 18세 미만의 누리 소통망 이용에 부모의 동의를 받게 하고 야간 시간에는 사용을 제한하는 법안을 통과시켰습니다. 그리고 중국에서는 누리 소통망에 청소년 모드 적용을 의무화하여 이용 시간을 제한하고 있습니다. 국가적 차원에서의 규제는 앞으로 누리 소통망 서비스를 제공하는 기업의 움직임을 이끌 수 있을 것이며, 청소년의 올바른 성장을 위한 가정과 학교의 역할 또한 공고히 할 수 있을 것입니다. 따라서 청소년의 누리 소통망 이용 시간을 제한하는 법적 규제가 필요합니다.\n진행자: 네, 찬성 측의 입론 잘 들었습니다. 그럼, 이제 반대 측에서 반대 신문해 주시기를 바랍니다.\n반대 2: 제시하신 2024년 조사 결과의 출처를 말씀해 주실 수 있을까요? 어느 기관에서 어떤 목적을 가지고 누구를 대상으로 조사한 자료인지 확인할 필요가 있어 보입니다.\n찬성 1: 그 자료는 △△ 정책 연구원에서 청소년들의 누리 소통망 의존도를 파악하기 위해 고등학교 1~2학년 학생 2,150명을 대상으로 조사한 자료입니다.\n반대 2: 누리 소통망 사용 시간 때문에 일상생활에 지장을 받는 청소년이 약 37%라고 하셨는데요, 그렇다면 찬성 측 주장은 전체 중 절반도 되지 않는 청소년의 상황을 확대해서 생각한 것 아닌가요?\n찬성 1: 그 수치만으로는 많지 않다고 느끼실 수 있습니다. 하지만 청소년의 스마트폰 과의존 문제는 사회적으로 심각한 문제입니다. □□ 청소년 연구소의 조사 결과에 따르면 우리나라 청소년 중 스마트폰 과의존 전체 위험군은 2021년 36%에서 2023년 41%로 증가했다고 합니다.\n반대 2: 저도 그 자료를 검토했는데 잠재적 위험군의 수치는 약간 늘었지만, 고위험군은 오히려 2021년 5.8%에서 2023년 5.1%로 감소했습니다. 그렇다면 법적 규제가 필요할 정도로 심각하다는 건 지나친 걱정이 아닐까요?\n찬성 1: 그렇지 않습니다. 잠재적 위험군은 자율적 조절 능력이 떨어져 스마트폰 이용을 다른 활동보다 중시하거나 부정적인 결과를 보이는 경우로, 방치하면 고위험군으로 발전할 가능성이 높습니다.\n반대 2: 누리 소통망 이용 시간 규제가 세계적 추세라고 하셨는데, 외국에선 주로 유해 콘텐츠로부터 청소년을 보호하려는 의도가 큽니다. 그렇다면 시간을 제한하는 것만으로 청소년들을 보호할 수 있을까요?\n찬성 1: 물론 시간 제한만으로 유해 콘텐츠로부터 청소년을 보호하기 어렵다는 점은 인정합니다. 하지만 스마트폰 과의존을 막아 학습, 수면 등 일상생활에 악영향을 받는 것은 방지할 수 있을 것입니다.\n반대 2: 하지만 일괄적인 통제는 오히려 스마트폰을 이용한 여가와 소통, 정보 탐색의 기회를 빼앗는 결과로 이어질 수 있습니다. 앞서 이용 시간 규제의 목적이 청소년의 건강과 올바른 성장이라고 하셨는데, 그러면 법적 제한보다 가정과 학교, 기업 차원의 노력이 선행되어야 하는 것 아닌가요?\n찬성 1: 규제는 그러한 노력이 제대로 이루어지도록 규범을 마련하는 것입니다. 서로 다른 주체들이 공감대를 형성하고 한 방향으로 함께 나아가기 위해서는 법으로 기초를 마련해야 한다고 생각합니다.",

  "passage": "(가)는 지역 사회 문제 탐구 동아리 학생들의 대화이고, (나)는 대화에 참여한 학생이 작성한 건의문의 초고이다. 물음에 답하시오.\n(가)\n학생 1: 인구 고령화로 인해 치매 발병률이 급속하게 증가하면서 치매에 대한 지역 사회의 대응에 관심이 높아지고 있어. 이러한 현 상황을 바탕으로 ○○구 치매 안심 센터의 서비스 운영 현황과 개선 방안을 전반적으로 조사하고, 구청장님께 건의하는 글을 써 보기로 했잖아. 각자 조사해 온 자료를 바탕으로 이야기를 나누어 보자.\n학생 2: 2025년도 ○○구 치매 안심 센터 만족도 조사 보고서에 따르면 치매 안심 센터의 위치에 대한 지역 주민들의 만족도가 매우 낮은 편으로 나타났어. ○○구 치매 안심 센터는 △△동에 위치하고 있는데, 센터에서 거리가 멀리 떨어진 지역의 경우 치매 안심 센터 이용률이 매우 저조하다고 해.\n[A]\n학생 3: 내가 자료를 찾아봤는데, 현재 □□시 9개 자치구에서 치매 안심 센터 본소의 서비스를 확대하고 지역 간 서비스 격차를 해소하기 위한 목적으로 분소를 운영하고 있어.\n○○구도 분소를 설립하여 운영하면 지리적 접근성이 낮은 지역에 거주하는 치매 환\n자와 보호자들의 불편함을 해결할 수 있을 거야.\n학생 2: 분소가 설립된다면 문제 해결에 도움이 되겠지만, 과연 현실적으로 가능할까? 지역 사회 및 지역 주민들의 협조를 구해야 하는 사안인 만큼 단기간에 추진되기는 현실적으로 어려울 것 같아. 분소 설립을 위한 적절한 장소를 확정하는 데는 상당한 시간과 비용이 든다고 알고 있어.\n학생 1: 맞아. 장기적인 관점에서 분소 설립은 필요하겠지만 현실적인 여건을 고려할 때, 당장 실행하기는 어려운 방안이라고 생각해. 그렇다면 치매 안심 센터가 제공하는 서비스 측면의 개선을 통해 지리적 접근성 문제를 해결할 수 있는 방안은 뭐가 있을까?\n학생 2: 치매 안심 센터에서 멀리 떨어진 지역에 거주하는 치매 환자의 경우 환자의 거주 지역으로 직접 찾아가는 돌봄 서비스를 운영하면 위치 제약의 한계를 극복할 수 있고, 환자 개인별 일대일 맞춤형 서비스를 제공할 수 있어서 일석이조의 효과를 낼 수 있을 거야.\n학생 3: 센터와 가까운 곳에 사는 치매 환자라도 거동이 불편하거나 홀로 생활하여 센터 방문이 어려운 분들도 있는데, 찾아가는 서비스가 활성화된다면 그분들의 치매 관리에도 큰 도움이 되겠다.\n학생 1: 모두 좋은 생각이야. 얼마 전 신문 기사를 봤는데, ◇◇구 치매 안심 센터에서는 ◇◇구 주민들을 대상으로 치매 예방 활동가를 양성하고, 치매 예방 활동가가 정기적으로 독거노인과 부부 노인 세대의 가정을 방문하는 인지 건강 프로그램을 운영하고 있다고 하더라.\n학생 3: 치매 예방 활동가? 좀 더 구체적으로 설명해 줄래?\n학생 1: ◇◇구에 거주하는 만 50세~69세 주민들 중 공개 모집을 통해 선발된 주민들이 치매 예방 교육을 이수하게 되면 치매 예방 활동가로 활동하게 된대. 치매 안심 센터는 치매 교육의 플랫폼 역할을 하면서 선발된 치매 예방 활동가들에게 정기적인 보수 교육을 실시하여 역량을 강화함으로써 지역 사회 주민들의 치매 예방 교육을 활성화하고 주민 공감대를 형성하는 데 큰 효과를 거두었다고 하더라고.\n학생 2: 찾아가는 치매 환자 돌봄 서비스와 병행되면 좋을 사업인 것 같아. 매년 노인 인구가 증가하고 치매 유병률이 지속적으로 증가하는 현시점에서 지역 주민들을 대상으로 한 치매 예방 교육이 매우 중요한데, 치매 안심 센터 직원만의 치매 예방 교육으로는 한계가 있을 수밖에 없으니까.\n학생 3: 나도 동의해. 만성적인 외로움이 노인들의 인지 기능을 저하시키고 스트레스와 우울증을 유발할 수 있다고 알고 있어. 치매 예방 활동가들이 주기적으로 노인 가정을 방문하여 말벗도 되어 외로움을 달래 드리고 인지 건강을 위한 활동을 진행한다면 지역 사회의 치매 예방에 큰 도움이 될 거야. ○○구도 도입하면 좋을 사업인 것 같아.\n학생 1: 좋아. 또 다른 건의 사항 있어?\n학생 3: 나는 ○○구 치매 안심 센터의 서비스별 이용 현황에 대해서 조사해 봤어. 센터에서 제공하는 서비스가 매우 다양함에도 불구하고 주민들이 이용하지 않는 서비스가 많더라. 이용 현황이 가장 저조한 서비스는 매월 마지막 주 수요일에 진행되는 치매 환자 가족 교실이었어. 치매 환자 가족들을 대상으로 치매 관리 교육을 진행하고, 환자 가족들의 정서적인 안정을 도모할 수 있는 좋은 프로그램이므로 보다 적극적인 홍보가 필요해 보여.\n학생 2: 치매 환자 가족 교실을 홍보하는 것만으로 문제를 해결할 수 있을까? 치매 환자의 가족들은 환자를 돌보느라 하루 종일 환자 곁을 비우기가 힘든 경우가 많고, 특히 센터와 거리가 먼 곳에 사는 분들은 시간을 내어 센터를 방문하기가 매우 어려울 거야. 난 앞서 제안한 찾아가는 치매 돌봄 서비스의 실시가 선행되어야 한다고 생각해. ○○구에서 찾아가는 치매 돌봄 서비스가 실시되면 환자 가족들의 돌봄 부담이 해소되어치매 환자 가족 교실 서비스의 이용률을 높이는 데에도 효과가 있을 거야.\n학생 3: 네 말을 듣고 보니 홍보보다는 치매 환자 가족들이 서비스를 이용할 수 있는 여건을 마련하는게 더 중요하다는 생각이 들어. 그렇다면 해당 서비스가 제공되는 시간대를 다양하게 하고 프로그램 진행 횟수를 늘리는 것도 반드시 필요하겠다. 그렇게 하면 치매 환자 가족들이 자신의 가정이 돌봄 서비스를 이용하는 시간을 활용하여 보다 편하게 가족 교실 서비스를 이용할 수 있겠다.\n학생 1: 두 사람 생각은 잘 알겠어. 그럼 내가 오늘 나눈 얘기들을 정리해서 건의문 초안을 작성해 볼게.\n(나)\n구청장님, 안녕하십니까? 저희는 ♡♡ 고등학교 지역 사회 탐구 동아리입니다. 항상 주민들의 건강하고 안전한 일상을 위해 애쓰시는 구청장님께 감사의 말씀을 드립니다. ○○구는 □□시에 속한 지역 중 상대적으로 노인 인구의 비율이 높습니다. 이에 따라 치매 문제에 대한 지역 사회의 대응에 지역 주민들의 관심이 커지고 있어서 ○○구의 치매 안심 센터의 운영과 관련하여 몇 가지 건의를 드리고자 이렇게 글을 쓰게 되었습니다.\n첫째, 찾아가는 맞춤형 치매 돌봄 서비스를 운영해 주시기 바랍니다. 2025년도 ○○구 치매 안심 센터 만족도 조사 보고서에 따르면 치매 안심 센터의 위치에 대한 주민들의 만족도가 매우 낮은 편으로 나타났다고 합니다. △△동에 위치한 ○○구의 치매 안심 센터는 현재 분소 없이 본소만 운영되고 있어 센터에서 멀리 떨어진 지역의 경우 주민들의 센터 이용률이 낮은 실정입니다.\n따라서 치매 안심 센터로부터 먼 거리에 거주하거나 거동이 불편하여 센터 방문이 어려운 치매 환자의 경우, 각 가정에 전문 인력을 파견하여 복약 지도와 운동 및 재활 치료를 진행한다면 환자별로 일대일 맞춤형 돌봄이 가능해 치매 관리를 보다 효과적으로 할 수 있을 것입니다. 둘째, 지역 주민들로 구성된 치매 예방 활동가를 양성하는 사업을 추진해 주십시오. 최근 신문 보도에 따르면 ◇◇구 치매 안심 센터는 희망하는 주민들을 대상으로 무상으로 교육을 실시하여 지역 내 독거노인 및 노인 세대 가정을 관리하는 치매 예방 활동가로 활동하게 함으로써 지역 주민들의 치매 인식 개선에 큰 효과를 거두었다고 합니다. ○○구도 치매 예방 활동가들이 정기적으로 노인 가정을 방문하여 치매 예방 교육과 인지 건강을 위한 활동을 진행한다면 지역 사회의 치매 예방에 큰 도움이 될 것입니다.\n셋째, 치매 환자 가족을 위한 가족 교실 서비스가 진행되는 시간대를 다양하게 하고 그 횟수도 늘려 주시기 바랍니다. 현재 가족 교실 서비스의 이용 현황은 매우 저조한 상황입니다. 그 이유는 치매 환자의 가족들은 환자를 돌보느라 종일 환자 곁에서 자리를 뜰 수 없는 경우가 많을 뿐만 아니라, 센터와 거리가 먼 곳에사는 분들은 시간을 내어 센터를 방문하기가 매우 어렵기 때문입니다. 환자를 돌보는 과정에서 부양에 대한 부담감과 우울감을 겪고 있는 치매 환자 가족들을 위해 꼭 필요한 프로그램인 만큼, 더 많은 환자 가족들이 프로그램을 통해 정서적인 안정을 찾을 수 있도록 여건을 마련해 주시면 좋겠습니다. 더불어 앞서 건의드린 찾아가는 맞춤형 돌봄 서비스의 실시가 선행된다면 환자 가족들의 돌봄 부담이 경감되어 가족 교실서비스의 이용률이 높아질 것이라고 생각합니다. 건의를 수용할 경우, 구청의 행정 운영 면에서 예산상의 부담이 된다고 우려하실 수 있지만, 이보다 지역 주민이 건강을 증진하고 ○○구에 대한 지역 주민들의 신뢰와 자긍심이 높아지는 효과가 더 클 것입니다.\n달라질 ○○구 치매 안심 센터는 치매 예방과 치료를 위한 핵심 기지로서 치매 환자와 보호자 모두의 정서적인 안정에 긍정적인 영향을 미쳐 삶의 질을 향상하는 데 크게 기여하게 될 것입니다. 끝까지 읽어 주셔서 감사합니다.",

  "passage": "[교지 편집부원의 요청]\n안녕하세요. 교지 편집부에서 말씀드립니다. 시사 현안을 주제로 교지에 실릴 비평문을 써 주시기를 요청드립니다. 다양한 근거를 바탕으로 일관된 관점이 명확히 드러나도록 글을 써 주세요. [초고]2024년 12월을 기준으로 우리나라는 전체 인구에서 65세 이상 인구의 비율이 20%를 넘어 초고령 사회로 진입했다. 국가데이터처 자료에 따르면 65세 이상 고령 취업자는 꾸준히 증가하는 추세이고, 전체 노동 시장에서도 고령 취업자의 비중은 매년 증가하고 있다. 청년층의 취업난이 화두인 요즘 고령자의 재취업, 노동 시장 잔류가 청년층의 취업난을 심화한다는 의견도 있다. 짧은 시간의 훈련으로 업무 수행이 가능한 단순 노무직에서는 세대 간 일자리 충돌이 불가피하다.\n그러나 숙련도나 전문 지식이 요구되는 다양한 기술·전문 직종에서 오히려 고령 인력이 인력 공백을 메우고 저숙련 청년층을 훈련시키는 역할을 할 수 있다. 고령층의 노동 시장 참여는 다가올 미래의 인구 구조를 고려할 때 중요한 전략 수단이 될 수 있다. 앞으로 우리나라의 생산 가능 인구수 감소 폭이 커질 예정이다. 이는 성장률 둔화, 복지 부담 증가, 국가 경쟁력 약화로 이어질 수 있다. 현재 우리나라에는 고령자 취업을 부정적으로 보는 사람들이 많은 것 같다. 지금부터라도 노동 시장에 진입하는 고령층이 청년층과 원만히 함께 일할 수 있도록 정책을 설계해 나간다면 고령자 취업은 생산 가능 인구 감소라는 충격을 다소간 흡수하는 완충재 역할을 할 수 있다.\n○○ 대학교 의과 대학의 김□□ 교수 연구팀은 경제 활동에 꾸준히 참여하는 고령자와 그렇지 않은 고령자를 비교하는 연구를 수행했다. 연구 결과 경제 활동에 꾸준히 참여하는 고령자는 그렇지 않은 고령자에 비해 정신적으로, 신체적으로 건강한 상태를 유지했다. 이는 고령자 개인 차원의 효용으로 그치지 않는다. 지금부터라도 우리 사회에서 고령자가 지속적으로 일할 수 있는 저변을 만들어 둔다면 장기적으로 고령자에 대한 의료비 부담을 줄여서 건강 보험 재정에 긍정적인 영향을 미칠 수 있을 것이다. 고령 취업자의 증가는 젊은 세대의 일자리를 탈취하는 사회 문제로 인식할 수 있지만, 인구 구조의 변화로 인해 자연스레 나타나는 현상으로 받아들일 수도 있다. 의지와 경력을 갖춘 고령자를 노동 시장에서 배제할 것이 아니라 적재적소에 배치해야 한다. 이는 고령층과 젊은 세대 간 상호 교류, 학습의 확산으로 이어져 세대 간 갈등을 완화하는 계기가 될 것이다. 고령 취업자의 증가가 우리 사회가 지속 가능할 수 있도록 만드는 방안으로서 인식될 수 있게 지혜를 모으자.",

  "src": "안전 도우미 홍보 대사 공고문과 자기소개서",
  "source": "EBS 2027학년도 수능완성 국어영역 독서·문학·화법과작문, 02부 실전편 (안전 도우미 홍보 대사 공고문과 자기소개서) | EBS 문항코드: 26051-0279~0282",
  "passage": "(가)는 ‘공고문’이고, (나)는 ‘공고문’에 따라 학생이 쓴 자기소개서이며, (다)는 (나)를 바탕으로 실시된 면접이다. 물음에 답하시오.\n(가)\n(나)\n안녕하십니까. 안전 도우미 홍보 대사에 지원한 고등학생입니다. 저는 소방 공무원을 꿈꾸는 학생으로, 건강한 삶을 위해서는 안전이 방패가 되어야 한다고 생각하고 있습니다. 특히 모든 청소년이 안전하게 생활하기를 소망하는 마음으로 작은 도움이 되고자 홍보 대사에 지원했습니다. 저는 중학교 때 학교에서 한꺼번에 여러 계단을 뛰어 내려가다가 발을 헛디뎌 십자인대 부상을 당했습니다. 다행히 가벼운 수술을 받고 회복되었지만, 2∼3개월 정도 좋아하는 운동도 못 하고 재활의 시간을 보내야 했습니다. 그러는 동안 일상에서의 안전에 대한 의식이 무척 높아졌습니다. 이후로 학생들의 안전 관련 사고에 주목하면서 등하굣길의 안전도 중요하지만 대부분의 사고가 학교에서 일어난다는 점을 발견했습니다. 그 뒤로 학교생활을 어떻게 하는 것이 안전을 지키는 길인지 관련 자료를 많이 찾아보았습니다.\n저는 안전 교육에서 중요한 것은 ‘안전 인지 감수성’을 기르는 것과 ‘위기관리 능력’을 배양하는 것이라고 생각합니다. 안전 인지 감수성을 기르는 것은 안전 의식을 내면화하여 주변에서 경미한 징후나 이상 등이 있을 때 그 위험에 대해 인지하고 안전 조치를 취하거나 돌발 상황에 대비하는 것을 말합니다. 이를 위해 생활, 교통, 주변 환경 등의 다양한 면에서 발생하는 위험에 대한 지식을 쌓을 필요가 있습니다.\n다음으로 위기관리 능력을 배양하는 것은 위기 상황들과 관련된 대처 요령을 숙지하고, 실제 현장에 이를 적용할 수 있도록 훈련하는 것을 말합니다. 특히 실제로 교내 실험실, 운동장, 체육관 등에서 물품이나 기구를 다루다가 사소한 실수가 생겼을 때 오히려 당황하여 더 큰 피해를 입는 경우가 있었습니다.\n이처럼 소홀하기 쉬운 부분에 대한 대응 요령을 현장에서 익혀야 한다고 생각합니다. 저는 ‘교내 이동 시 안전’, ‘운동과 관련된 안전’ 등에 주목하고 여러 가지 자료를 찾아보며 공부했습니다. 이런 경험이 홍보 영상을 제작할 때 내용을 알차게 구성하는 데 도움이 될 것입니다. 컴퓨터 프로그램 관련 자격증이 있어서 안전 관련 영상물이나 퀴즈 등을 제작하는 데에도 자신이 있습니다. 이를 바탕으로 안전 도우미 홍보 대사로 활약하면서 경험을 쌓고, 이후 진로도 학생들의 안전을 지키는 일과 관련된 분야를 선택하고 싶습니다. 저는 사람들에게 편하게 다가가고 금방 친해지는 성격으로 주변에 친구가 많습니다. 특히\n[A]\n낯선 사람들과도 자연스럽게 소통하며 금방 친해지는 것이 저의 장점입니다. 조화로운 화음\n을 만드는 것과 같은 저의 성격은 여러 학교 학생들이 활동하는 연합 동아리에 적합할 것이라고 자부합니다. 안전 관련 사고를 겪고 그동안 이와 관련된 지식을 쌓으면서 안전의 중요성을 몸소 실감한 사람이 더 충실히 홍보 대사 역할을 해낼 것이라고 생각되지 않으십니까? 제가 안전 도우미 홍보 대사가 된다면 안전 관련 경험, 사교적 성격 등을 바탕으로 학생들에게 안전 인지 감수성과 위기 대처 능력을 길러 주고자 적극적으로 노력하겠습니다.\n(다)\n지원자: 안녕하십니까? 안전 도우미 홍보 대사 지원자입니다.\n면접관 1: 안녕하세요. 홍보 대사에 지원한 것을 환영합니다. 예전에 다쳤었다고 하는데요, 지금은 어떤가요? 혹시 동아리 활동을 하기에 어려움은 없나요?\n지원자: 다행히 가벼운 수술이었고 이후에 재활 치료도 받아서 완치되었습니다. 동아리 활동을 하거나 움직이는 데 전혀 무리가 없습니다. 오히려 안전 의식이 더 높아졌다고 할 수 있습니다.\n면접관 2: 안전에 더 신경을 쓰게 되었다니 다행입니다. 홍보 대사가 되어서 하고 싶은 일은 무엇이고, 그 이유는 무엇입니까?\n지원자: 지역에 학생 안전 체험관이 있고, 이 동아리가 체험관에서 각종 봉사 활동을 하는 것으로 알고 있습니다. 저는 그곳에서 운동이나 이동과 관련된 안전 교육을 진행하는 홍보 대사로 활동하고 싶습니다. 그 이유는 다른 학생들이 제가 부상당한 것과 같은 고통을 느끼지 않도록 안전 의식을 심어 주고 싶기 때문입니다.\n면접관 1: 이와 연관 지어 ‘안전 인지 감수성’이라는 말을 사용했는데요, 그 의미가 무엇인지 설명해 주시겠어요?\n지원자: 요즘 여러 분야에 걸쳐 인지 감수성이라는 말이 사용되고 있는데요, 안전 인지 감수성은 무엇이 안전에 도움이 되고, 어떤 상황에서 안전사고로 이어지게 되는지를 예상하고 대처하는 태도를 말한다고 생각합니다.\n면접관 2: 안전 인지 감수성을 어떻게 길러 줄 수 있다고 생각하나요?\n지원자: 그러한 감수성은 직간접적으로 어떤 상황이 안전에 위협이 되는지 체험해 볼 때 길러질 수 있다고 생각하고요, 그래서 위기관리 능력을 같이 함양할 필요가 있다고 생각합니다.\n면접관 1: 위기관리 능력 함양을 위해 체험을 통해 대응 요령을 익힐 것을 강조했는데요, 이러한 능력을 함양하기 위해 실제 위기 상황에 노출된다면 더 위험하지 않을까요?\n지원자: 위기관리 능력 함양을 위해 실제 위기 상황에 노출될 필요는 없다고 생각합니다. 최근 발달하는 게임 프로그램이나 VR과 같은 기술을 활용한 간접 경험이 중요할 것 같습니다.\n면접관 2: 좋은 방법이네요. 그러면 지원자는 홍보 대사로서 구체적으로 어떤 교육 영상을 제작해서 역량을 발휘하고 싶습니까?\n지원자: 저는 영상을 통해 교실 내에서 심한 장난을 치거나 수업 중의 도구 사용과 관련된 안전 수칙을 지키지 않을 경우, 자칫하면 큰 위험이 될 수도 있다는 것을 영상으로 일깨워 주고 싶습니다. 실제로 제 친구가 겪었던 사건과 관련되는데요, 운동 기구 사용법을 숙지하지 않고 장난을 치다가 자세가 잘못되어 어깨가 탈골되는 사고가 있었습니다. 작은 장난이 본인뿐만 아니라 다른 친구들에게도 피해를 줄 수 있다는 점을 알려 주고 싶습니다.\n면접관 1: 좋은 의견입니다. 그런데 우리 홍보 대사단은 거의 연합 동아리나 마찬가지이기 때문에 개인의 의견이 전적으로 반영되지 못하는 경우도 있습니다. 혹시 다른 부원과 의견 차이가 생길 경우에 어떻게 하시겠습니까?\n지원자: [B]\n면접관 2: 그러면 마지막으로 하고 싶은 말이 있으면 말씀해 주십시오.\n지원자: 저는 제 경험과, 주변 친구들과 관련된 사건 등을 토대로 안전에 대한 의식을 깊이 지니게 되었습니다. 제가 홍보 대사가 된다면 저의 이 경험들과 그 이후 쌓아 온 지식을 바탕으로 학생들의 안전을 위해 열정적으로 임하겠습니다. 면접관 1, 2: 수고하셨습니다. 결과는 1주일 이내로 문자 메시지로 알려 드리겠습니다.",
  "prompt": "<보기>는 자기소개서에 나타난 글쓰기 전략을 정리한 것이다. <보기>의 ①, ②에 해당하는 문장을 (나)에서 찾아 각각의 첫 어절과 마지막 어절을 순서대로 쓰시오.",
  "view": "① 자신의 부상 경험을 계기로 지원 동기가 형성되었음을 밝히고 있다.\n② 전문 용어의 의미를 스스로 풀어 설명하고 있다.",

  "passage": "일반적으로 혼인은 남자와 여자가 부부가 되는 일을 말한다. 과거에는 특정한 법적 절차 없이도 결혼식과 같은 사회적 관습에 의한 의식을 치르면 혼인이 성립한 것으로 보았다.\n하지만 현재 대부분의 국가는 법에서 규정한 절차를 따라야만 혼인이 성립되는 법률혼 제도를 두고 있으며, 사회적 관습보다는 혼인 신고와 같은 법적 절차가 더 중요하다. 혼인은 사회를 구성하는 기본 단위인 가족을 형성하는 일이기 때문에 국가의 근간을 이루는 중요한 과정이고 이에 따라 법을 통해 관계를 보호하는 것이다.\n따라서 현대 사회에서 혼인은 법적 절차에 의해 이루어지게 되고 여기에 참여한 남녀 간에는 법적 효력이 발생하게 된다. 혼인이 성립하기 위해서는 법에서 규정하고 있는 실질적 요건과 형식적 요건을 모두 만족하여야 한다. 실질적 요건에서 가장 중요한 것은 혼인 의사의 합치이다. 혼인 의사는 부부 관계를 성립하겠다는 의사로 반드시 혼인 당사자 간의 합의가 필요하다. 또 다른 실질적 요건은 연령과 혼인 자격에 대한 것이다. 혼인 당사자인 남녀는 모두 혼인 적정 연령인 만 18세에 도달해야 한다. 만 18세는 법적으로 미성년자에 해당하지만 부모 또는 법정 대리인의 동의를 얻을 경우 혼인이 가능하다.\n또한 8촌 이내의 혈족 관계가 아니어야 하며, 배우자가 있는 자는 중복해서 혼인할 수 없다. 혼인의 형식적 요건은 혼인 신고의 이행이다. 부부로서의 법적 효력을 인정받기 위해서는 혼인 신고서를 관련 기관에 제출하고 접수 및 수리가 완료되어야 한다. 혼인 신고를 마치면 혼인 당사자는 상대방에 대한 법적 배우자의 지위를 얻게 되며, 서로의 4촌 이내의 혈족 및 그 배우자와 인척 관계가 형성된다. 그리고 이에 따른 가족 부양, 공동생활의 협조, 정조의 의무 등 다양한 법적 권리와 의무가 발생하게 된다.\n또한 혼인 당사자들이 가지고 있던 재산이나 혼인 이후에 취득한 재산에 대해서 법적 효력이 발생하게 된다. 혼인은 평생 부부 관계로 살아가겠다는 법적인 약속으로 그 기간을 명시할 수 없고 원칙적으로 무효화나 취소가 불가능하다.\n하지만 혼인의 성립 요건을 갖추지 못한 경우에는 소송과 법원의 판결을 통해 법률혼 관계를 정리할 수 있다. 혼인 당사자 간의 합의가 없었던 경우나 혼인 당사자가 근친혼 관계에 있는 경우 혼인 무효가 된다. 혼인 무효 사유가 있는 경우 혼인 당사자나 법정 대리인, 4촌 이내의 친족이 가정 법원에 혼인 무효 소송을 제기할 수 있으며, 이때 입증 책임은 청구권자에게 있다. 혼인 무효는 소멸 시효나 청구 기한이 없고, 혼인 무효가 되면 법률혼 관계가 처음부터 성립하지 않았던 상태로 돌아가게 되어 관련 서류에서 혼인 관련 기록이 삭제된다. 당사자 중 한 명 이상이 적정 연령에 도달하지 않았거나 미성년자가 동의 없이 혼인한 경우, 혼인 당시 당사자 중 한 쪽에 중혼 등 부부 관계를 지속할 수 없는 중대한 사유가 있다는 것을 알지 못했던 경우, 사기나 강박으로 인해 혼인 의사를 표현한 경우 가정 법원에 혼인 취소를 청구할 수 있다.\n혼인 취소는 사유에 따라 청구권자가 달라지며, 상황에 따라 청구권이 제한되기도 한다. 미성년자가 동의 없이 혼인을 한 경우에도 혼인 후 당사자가 만 19세가 되어 성인이 되었거나 혼인 중 임신한 경우에는 혼인 취소를 청구할 수 없다. 사기를 안 날이나 강박을 면한 날로부터 3개월이 지난 이후, 중대 사유가 있음을 알게 된 날부터 6개월이 지난 이후에는 혼인 취소 청구가 불가능하다. 법원에서 확정 판결을 받은 이후에는 1개월 이내에 관할 기관에 신고를 완료해야 모든 절차가 완료되며, 혼인 취소가 되더라도 취소 이전까지의 법률혼 관계는 인정된다.\n한편, 이혼은 혼인을 통해 발생한 법적 관계를 종료시키는 제도이다. 무효나 취소와는 달리 이혼은 혼인이 적법하게 성립한 이후 부부 관계를 더 이상 유지할 수 없는 상황에서 이루어진다. 이혼은 혼인 당사자 간의 합의에 의한 협의상 이혼과 법원의 판결에 의한 재판상 이혼이 있다. 협의상 이혼은 부부가 이혼에 합의하고 법원에 이를 확인받아 혼인 관계를 해소하는 것이다. 당사자가 함께 주소지 또는 등록 기준지의 가정 법원에 협의상 이혼 신청서를 제출하면, 일정 기간의 숙려 기간이 필수로 주어진다. 숙려 기간이 지난 이후에는 당사자 양측이 다시 법원에 출석하여 이혼 의사가 변하지 않았는지 최종적으로 확인을 받는다.\n이때 법원은 이혼 의사의 합치 여부만 확인할 뿐, 이혼 사유의 타당성 여부는 따지지 않는다. 그리고 양육권, 재산 분할 등의 문제는 원칙적으로 당사자 간의 합의에 따른다. 법원의 확인 이후 3개월 이내에 관할 기관에 이혼 신고를 하면 법적으로 이혼이 확정된다.\n반면, 재판상 이혼은 당사자 중한 명이 이혼에 반대하여 합의가 이루어지지 않을 때 당사자 중 한 명이 법원에 이혼 소송을 제기하고 재판을 통해 혼인을 해소하는 것이다. 법원은 민법에 규정된 이혼 사유가 있는지를 고려하여 이혼 여부를 결정한다. 단, 소송 전에는 반드시 법원의 이혼 조정 절차를 거쳐야 하며 조정이 성립하는 경우 재판 절차 없이 이혼이 가능하다. 법원의 판결에 의해 이혼이 확정되면 승소자는 1개월 내에 관할 기관에 이혼 신고를 마쳐야 모든 절차가 완료된다.",

  "passage": "개별적이고 특수한 작업을 수행하는 여러 대의 클라이언트*와 연결되어 정보나 서비스를 제공하는 컴퓨터 시스템을 서버라고 한다. 서버는 클라이언트의 요청에 따라 작업을 수행하거나 정보를 검색하고, 그 결과를 클라이언트에 돌려준다. 서버를 구성하는 기계에서 작업을 신속하고 정확하게 처리하기 위해서는 데이터를 안전하게 관리해야 할 뿐 아니라 신속하게 데이터에 접근하여 데이터의 읽기나 쓰기를 실행할 필요가 있다. 이런 필요를 충족시키기 위해 개발된 것이 분산 파일 관리 체계이다. 분산 파일 관리 체계는 데이터의 불법 변조를 방지하고, 기계적 결함에 대응하여 데이터의 유실로부터 안전을 도모하며, 서버의 부하를 줄여 신속한 연산을 수행하도록 기계적 성능과 저장 용량을 확보하는 데 유리한 전략이다. 단일 기계로 구성된 서버에서 데이터를 관리할 경우에는 하드웨어적으로 램*이나 CPU*의 성능이 우수한 기계를 확보하는 데 큰 비용이 들지만, 분산 파일 관리 체계에서는 다수의 저렴한 저성능 기계를 연결하여 데이터를 관리함으로써 비용을 절감하면서도 높은 수준의 성능을 확보할 수 있다.\n그뿐만 아니라 기계가 고장이 나더라도 데이터가 여러 기계에 분산되어 있으면 고장 나지 않은 기계에 있는 데이터는 안전하고, 해킹을 당하더라도 해커에게 단일 서버에 접근하여 단번에 필요한 데이터 전체를 탈취하지 못하고 여러 기계를 뚫어야 하는 어려움을 줌으로써 피해를 줄일 수 있는 장점이 있다. 샤딩(sharding)은 분산 파일 관리 체계 중 하나로서 데이터를 샤드 단위로 분할하여 저장하고 활용하는 방법이다. 샤드(shard)란 관리하기 쉽도록 분할한 후 서로 연결된 기계들에 나누어 저장한 데이터 세트를 의미한다. 샤딩을 운용하려면 클라이언트의 요청이 들어왔을 때 어떤 샤드에 해당 데이터가 저장되어 있는지를 판별하고, 그 샤드에서 필요한 데이터를 조회해서 클라이언트에 전달하는 라우터가 필요하다. 라우터가 이런 역할을 수행할 수 있도록 전체 샤드의 분할 정보와 위치 정보를 저장하고 관리하는 설정 서버가 별도로 마련되어 있다.\n또한 설정 서버에는 나중에 필요한 상황이 되었을 때 사용할 수 있도록 각각의 샤드가 어떻게 이용되었는지를 보여 주는 로그 정보가 저장되기도 한다. 샤딩을 운용하면 저장소 분산과 부하 분산의 유익을 볼 수 있다. 저장소 분산은 샤딩을 통해 저장 용량이 큰 고가의 기계 대신에 저장 용량이 작은 저가의 기계를 여러 개 합쳐서 동일 저장 용량을 확보하는 것인데, 이때 일반적으로 비용 절감의 효과를 볼 수 있다. 부하 분산은 샤딩을 통해 데이터의 쓰기, 읽기 및 연산을 각 샤드마다 다른 기계가 분산하여 처리하게 하는 것인데, 이는 신속하게 작업을 수행할 수 있게 해 주는 장점이 있다. 샤딩의 약점 중 하나는 연산에 활용해야 할 데이터가 여러 샤드에 흩어져 있을 경우에 그것을 끌어 모아 처리하는데 시간 지연이 발생하는 상황인 성능 병목 현상이 나타날 수 있다는 점이다.\n저성능 기계 간의 통신에서 발생하는 지연이 하나의 기계에서 통합적으로 연산을 수행하느라 유발되는 부하로 인한 지연보다 더 클 수 있다. 따라서 하나의 요청에 의해 액세스되는 데이터들은 가능하면 하나의 샤드에 배분되도록 설계하여 데이터의 지역성을 확보하는 것이 샤딩 성능을 높이는 핵심적인 방법이다. 샤딩이 갖는 또 다른 약점은 샤드마다 다른 데이터가 들어 있기 때문에 데이터의 불법적 변조나 기계적 에러가 발생할 경우 복구하기가 용이하지 않기에 장애 허용성이 낮다는 것이다. 이 문제를 해결하는 방법은 샤딩에 복제를 결합하는 것이다. 복제는 샤딩과 달리 각기 다른 기계에 같은 내용의 데이터를 저장하는 분산 방법이다. 데이터의 불법 변조나 결함이 발생했을 때 정상적인 데이터를 다른 기계가 복제본으로 가지고 있어서 에러를 복구할 수 있게 하여 장애 허용성을 확보하는 것이다.\n복제에서는 클라이언트의 읽기 요청을 서버가 복제본에서 분산하여 처리할 수 있는 반면, 데이터의 추가, 수정, 삭제와 같은 쓰기 작업은 원본이나 복제본에서 단독으로 이루어지면 안 되고 원본과 모든 복제 본에 일관되게 적용되어야 하기 때문에 연산 속도가 느려지는 문제가 발생할 수 있다. 샤딩에 복제를 결합하는 한 가지 예를 들어 보자. 기계 A, B, C, D가 있을 때, 샤딩에 따라 A, B, C, D에 다른 내용의 샤드 s1, s2, s3, s4를 각각 저장하고, 복제에 따라 샤드 s1을 A에 저장할 뿐 아니라 B에도 s1의 복제본 s1′을 저장하여 B에는 내용이 다른 원본 샤드 s2와 복제본 샤드 s1′을 함께 저장한다. 같은 방식으로 C에는 s3, s2′, D에는 s4, s3′, A에는 s1, s4′을 저장한다. s2′, s3′, s4′은 각각 s2, s3, s4의 복제본이다.\n이렇게 하면 어떤 샤드에서 에러가 발생했을 때 에러가 발생하지 않은 그 샤드의 복제본으로부터 정상적인 데이터를 넘겨받아 에러를 수정할 수 있고, 어떤 샤드에 읽기 요청이 쇄도하면 다른 기계에 있는 그 샤드의 복제본에서 처리될 수 있게 부하를 분산할 수 있다. 샤딩에 복제를 결합한다고 해도 기계와 기계의 연결 과정에서 발생하는 시간 지연 때문에 데이터 일관성이 일시적으로 깨지는 문제를 완전히 극복할 수는 없다.\n따라서 신속하고 정확하며 저렴하게 데이터를 송수신·저장·처리하는 기술상의 발전이 요청된다. 또한 데이터의 활용 방식이나 범위의 변화에 따라 적합한 데이터 관리 시스템을 지속적으로 모색해 나갈 필요가 있다.\n*클라이언트: 서버 시스템과 연결하여 주된 작업이나 정보를 서버에 요청하고 그 결과를 돌려받는 컴퓨터 시스템. *램: 데이터가 저장되어 있는 위치에 관계없이 일정한 시간 내에 기억 내용을 읽거나 쓸 수 있는 기억 장치. 컴퓨터의 주기억 장치로서 널리 이용됨. *CPU: 컴퓨터 시스템 전체의 작동을 통제하고 프로그램의 모든 연산을 수행하는 가장 핵심적인 장치. 제어 장치와 연산 장치로 이루어져 있음.",

  "passage": "미니멀리즘 음악은 1960년대 이후 미국에서 태동한 현대 음악의 한 흐름으로, 라 몬테 영, 테리 라일리, 스티브 라이히, 필립 글래스 등이 대표적 작곡가로 꼽힌다. 이들은 소수의 음형*이나 단순한 패턴을 반복하는 방식으로 기존 음악의 복잡한 서사나 화성 전개를 과감히 축소하여, 감상자가 소리 그 자체를 경험하도록 유도한다. 전통적인 서양 음악에서 반복은 주제를 강조하여 이를 서사적으로 강화하기 위해 사용되었다. 예컨대 제시부-발전부-재현부로 구성된 소나타 형식은 제시부에서 등장한 주제가 발전부에서 여러 차례 변주되다가 재현부에서 제시부에 등장한 형태로 회귀함으로써, 작곡가가 설정한 주제를 확인 및 강화하는 구조를 이룬다. 철학자 들뢰즈의 표현을 빌리면, 이와 같은 ‘같은 것의 반복’에서는 특정 주제가 중심에 놓이고 음악의 각 부분은 그 주제를 재확인하는 역할만 수행한다.\n반면, 미니멀리즘 음악의 반복 형식은 ‘차이를 생성하는 반복’이다. 표면적으로 동일해 보이는 음형이 끊임없이 반복되지만, 음색, 강세 등의 미세한 차이가 매 순간 드러나면서 감상자는 새로운 음악적 사건을 지속적으로 만나게 된다. 마치 천천히 회전하는 만화경처럼, 반복되는 패턴 속에서 계속해서 새로운 패턴이 드러나는 것이다. 라 몬테 영의 작품 「컴포지션 1960 No. 7」은 이러한 특징이 나타나는 대표적인 사례이다. 이 작품은 연주자가 완전 5도 관계에 있는 B 음과 F# 음의 건반을 동시에 장시간 누르는 매우 간단한 구조로 구성돼 있다. 완전 5도는 정수비를 갖는 음의 간격으로, 동시에 울리는 두 음은 단순히 한 음과 다른 한 음의 조화가 아니라 그 속에 있는 무수히 많은 배음*들의 어울림으로 나타난다. 두 음이 가능한 한 오래 지속되면서 감상자는 음 내부에 있는 배음들의 전개와 이들의 조합을 경험하게 된다.\n다시 말 해 표면적으로는 동일한 두음이 지속되는 것처럼 보이지만, 실제로는 매 순간 세기나 강세, 높이 등이 그 음을 이루는 배음의 구조에 의해 미묘하게 변화를 일으키면서, 감상자는 음의 지속을 통해서 음 내부의 배음 전개를 경험하는 것이다. 라 몬테 영이 음의 지속을 통해 ‘차이를 생성하는 반복’을 탐구했다면, 스티브 라이히는 「피아노 페이즈」에서 위상 변위를 통해 이러한 차이 생성을 더욱 역동적으로 구현한다. 위상 변위란 동일한 음악 패턴을 여러 악기가 약간 다른 속도로 연주하여, 처음에는 완벽히 일치하던 패턴이 시간이 지나면서 점차 어긋나게 만드는 기법이다. 동일한 4마디 패턴을 한 악기는 원래 속도로, 다른 악기는 미세하게 빠른 템포로 연주함으로써 두 악기의 연주가 서서히 어긋나게 된다. 처음에는 차이가 거의 느껴지지 않지만, 일정 시간이 지나면 두 악기가 내는 음들이 겹치고 밀리면서 새로운 음악적 사건이 펼쳐진다.\n이러한 음악적 사건은 작곡가의 내면이나 음악적 서사를 직접적으로 드러내는 통로가 아니라, 동어 반복의 효과를 통해 내부의 잠재성을 발현하게 하는 기제로 작용한다. 여기서 동어 반복이란 외부의 다른 요소와 결합·대립하지 않고 자기동일성만을 지속적으로 반복하는 양상을 일컫는다. 미술가 칼 앙드레가 일정한 형태의 금속판을 줄지어 놓는 식으로 ‘무엇을 의미하는가’보다 ‘그 자체로 존재함’을 선보였듯, 최소한의 음 재료를 반복적으로 나열함으로써 특정 상징이나 주제에 갇히지 않는 개방적 구조를 실현하는 것이다. 미니멀리즘 음악은 감상자의 감상 방식에 근본적 변화를 일으킨다. 감상자는 음악이 ‘어떤 주제를 보여주고자 하는가?’라는 전통적인 질문에서 벗어나 ‘내가 듣는 이 음향은 방금 전의 그것과 어떤 차이를 갖는가?’라는 질문을 하게 된다. 음악적 경험은 전통적인 음계나 화성 구조의 틀을 넘어, 음 자체의 순간순간 달라지는 변화를 직접 체감하는 내재적 과정으로 전환된다.\n감상자는 작곡가가 미리 설정한 보편적 주제를 알아맞히는 수동적 존재에서, 지금 울리고 있는 음들의 강도와 미묘한 위상의 변화를 온전히 체감하는 능동적 참여자로 거듭난다. 이처럼 미니멀리즘 음악은 동일한 것을 반복시키는 표면적 단순함 속에서 끊임없이 차이를 생성하는 역설적 작법을 통해 전통 음악이 유지해 온 주제 중심적 서사를 과감히 해체한다. 미니멀리즘 음악은 ‘음악이란 무엇인가?’라는 물음에 대해, 음악이란 고정된 구조를 재현하는 매개체가 아니라, 그 순간에 발생하는 미세한 차이들을 감상자 각자가 경험하도록 여지를 열어 두는 미적 형식이라는 답을 제시하고 있다.\n*음형(音型): 몇 개의 음이 연속하여 어떤 가락이나 악곡의 요소가 되는 음의 모양.",

  "passage": "(가)\n객관적인 정보보다는 개인의 감정이나 경험 등 주관적인 요인에 따라 비합리적인 판단이나 결정을 하는 경향을 인지 편향이라고 한다. 사람들에게 많이 나타나는 인지 편향에는 이용 가능성 편향, 대표성 편향, 확증 편향이 있다. 우선 이용 가능성 편향은 사람들이 객관적인 정보보다는 쉽게 떠오르는 정보를 바탕으로 판단하는 것을 말한다.\n즉 최근에 직간접적으로 경험했거나 기억에 많이 남은 것 등 쉽게 떠오르는 것이 판단이나 결정에 큰 영향을 미치는 것이다. 사람들이 정보를 쉽게 얻을 수 있는 언론은 이용 가능성 편향을 강화하는 데 큰 영향을 미친다. 대표성 편향은 어떤 집합에 속하는 하나의 구성 요소가 그 집합 전체의 특성을 그대로 대표한다고 간주하는 것을 말한다.\n즉 대표성을 지니지 못한 일부 표본의 특성을 보고, 그것이 모집단 전체의 특성이라고 판단하는 것이다. 이용 가능성 편향과 대표성 편향이 함께 나타나면 착각 상관을 일으킬 수 있는데, 착각 상관이란 두 요소가 실제로는 관련이 거의 없지만 서로 강한 상관관계가 있다고 생각하는 오류를 말한다. 확증 편향은 자신이 가진 신념이나 가치관, 사상 등을 지속적으로 정당화하려는 것을 의미한다. 확증 편향에 빠진 사람들은 일단 자신의 의사나 태도가 결정되면 이를 뒷받침할 수 있는 정보를 찾아 축적하고, 그것과 반대되는 정보는 무시하는 경향이 있다. 확증 편향이 강화되는 원인 중 하나로 필터 버블 현상을 들 수 있다. 필터 버블 현상이란 기업이 인터넷 사용자의 개인 정보나 활동을 분석하여 사용자가 보고 싶어 하는 콘텐츠를 추천함으로써 사용자의 관점과 일치하지 않는 정보로부터 사용자를 분리시키고, 결국에는 사용자를 자신만의 문화적, 이념적 버블 안에 가두게 만드는 현상을 말한다.\n인지 편향은 개인의 판단이나 행동에 영향을 미칠 뿐 아니라 사회적으로 영향력을 확대할 수 있으며, 특히 확증 편향은 공동체에 부정적인 영향을 미칠 수 있다. 따라서 인지 편향을 단순히 개인의 비합리적인 판단으로 치부하기보다, 인지 편향이 사회 전반의 건강한 의사소통과 합리적 의사 결정에 어떠한 영향을 미치는지 주의 깊게 살펴볼 필요가 있다.\n(나)\n주식 투자는 사업 보고서나 재무제표와 같은 공식 자료, 시가 총액과 같은 시장 데이터, 금리나 환율과 같은 경제 지표 등 객관적인 자료를 참고하여 합리적으로 이루어지는 것으로 생각하지만, 실제 투자자들의 행동을 살펴보면 다양한 비합리적인 경향을 보여 주고 있다. 이는 정보를 받아들여 판단이나 결정을 하는 과정에서 개인의 심리적이고 주관적인 기준이 개입되어 판단 오류를 발생시키기 때문이다. 사람들이 주식 투자에서 보이는 대표적인 비합리적인 경향은 다음과 같다. 우선 투자를 결정할 때 객관적인 정보보다는 자신이 쉽게 떠올릴 수 있는 정보에 주로 의존하는 현상이 있다. 예를 들면 생활 속에서 자주 접하여 머릿속에 잘 떠오르는 기업에 투자하는 것이다. 경제 활동에서 사람들의 비합리적인 경향을 연구하는 행동 경제학에서는 인간의 정보 처리 능력이 한계가 있어 일부 정보에만 집중하여 판단하는 ‘제한된 주의’ 때문에, 객관적인 정보보다는 자신이 쉽게 떠올릴 수 있는 정보에 주로 의존하는 현상이 나타난다고 보았다.\n또한 특정 기업이나 분야에 대해 기존에 자신이 가지고 있던 지식과 정보에 지속적으로 의존하여 투자를 결정하는 비합리적인 경향을 보이는 경우가 있다. 이는 새로운 정보를 거부하고 기존의 시각이나 생각을 유지하려는 인지적 오류인 보수적 편향을 보여 주는 것이다. 그리고 특정 주식에 대해 적정가를 설정한 후, 해당 기업의 재무 상황이나 시장 환경이 달라지는 상황에서도 자신이 과거에 설정한 기준 가격을 바탕으로 매수나 매도를 하는 것도 주식 투자에서 보이는 비합리적인 경향이다. 이는 어떤 판단이나 결정을 할 때, 초기에 주어진 정보가 기준점이 되어 이후에도 해당 기준점을 바탕으로 판단한다는 앵커 효과를 보여 주는 사례이다.\n또한 최근 주가 상승으로 수익을 얻은 투자자가 많아졌다는 언론 보도만을 바탕으로 투자를 결정하거나, 특정 기   "passage": "[앞부분 줄거리] 옹진골 옹당촌에 살고 있는 옹고집은 다른 사람에게 인색하기로 유명한 수전노였다. 이를 보다 못한 한 도사가 옹고집의 집에 허수아비로 만든 허옹가를 보내고, 허옹가와 진짜 옹고집인 실옹가 사이에 시비가 벌어지며 둘은 사또 앞에 서게 된다. 사또 듣기를 다하매 가로되, / “그 손이 참 옹 좌수라.”하고, 당상에 올려 앉히고 기생을 불러, / “이 양반께 술 권하여라.”일색 기생 술을 들고 권주가 화답하되,“잡수시오, 잡수시오. 이 술 한잔 잡수시오. 이 술은 술이 아니라 한 무제 승로반*에 이슬 받은 것이오니, 쓰나 다나 잡수시오.” / 옹 좌수 흥을 내어 술잔을 받아 들고 하는 말이,“하마터면 아까운 세간을 저놈에게 빼앗기고 이런 일등 미색의 이렇듯 맛난 술을 못 먹을 뻔하였다. 그러나 성주 덕택에 흑백을 가려 주옵시니, 은혜 백골난망이로소이다. 잠깐 민의 집에 나오시오. 막걸리 한 잔 대접하오리다.”“그는 염려 말게. 처치하여 줌세.”\n/ 실옹가 불러 분부하되,“네가 흉측한 놈으로 음흉한 뜻을 두고 남의 세간 탈취하려 하니, 네 죄상은 마땅히 의율정배*할 것이로되, 고의 안세하니 바삐 어서 물리치라.” / 대곤삼십도*를 맹치하여 엄문 죄목하되,“인제도 옹가라 하겠느냐?” / 실옹가 생각하되, 만일 옹가라 하다가는 곤장 밑에 죽을 듯하니,“예, 옹가 아니오. 처분대로 하옵소서.” / 아전이 호령하여, “장채 안동하여 저놈을 월경(越境)하리라.”하니, 벌떼 같은 군노 사령 일시에 달려들어 옹가 상투를 잡아 휘휘 둘러 내쫓으니, 실옹가 하릴없이 가슴을 탕탕 두드리며 대성통곡하며 하는 말이,“답답하다, 내 일이야. 꿈이냐, 생시냐. 어찌해야 옳단 말이냐. 차소위락미지액(此所謂落眉之厄)이로 다*.”\n무지한 고집이 놈 이제는 개과하여 애통하는 말이,“나는 죽어 마땅한 놈이거니와 당상학발 우리 모친 다시 봉양하고지고. 어여쁜 우리 아내 월하의 인연 맺어 일월로 본증 삼고 천지로 맹세하여 백 년 종사하쟀더니, 독수공방 적막한데 임 없이 홀로 누워 전전 반측 잠 못 들어 수심으로 지내는가. 슬하의 어린 새끼 금옥같이 사랑하여 어를 제 ‘섬마둥둥 내 사랑, 후드득후드득 엄마, 아빠 눈에 암암’ 나 죽겠네. 아마도 꿈인가 생신가. 꿈이거든 깨이거라.”허옹가 거동 보소. 득송(得訟)하고 돌아올 제 의기양양하는 거동 참으로 제법일다. 얼씨구나 좋을씨 고. 손춤 추며 노랫가락 좋을씨고.\n이리저리 다니면서 조롱하여 하는 말이,“허허 흉악한 놈, 하마터면 우리 고운 마누라 빼앗길 뻔하였다.”하고, 집으로 들어오며 희색이만안하니, 가중 제인이 득송하였단 말 듣고 잡고 묻는 말이, “득송하였소?”“허허, 그리하였네. 그새 편안히 있는가. 세간은 고사하고 하마터면 자네 놓칠 뻔하였네. 원님이 명찰(明察)하여 주시기로 자네 얼굴 다시 보니 이런 좋은 일 또 있을까. 불행 중 다행이로다.”그렁저렁 날이 저물매 허옹가 실옹가의 아내 데리고 종야 언어 수작하다가 원앙금침 펼쳐 놓고 동침하여 누웠으니, 양인 심사 깊은 정에 좋은 마음 측량없다. 이같이 즐기다가 잠깐 잠을 들어 한 꿈을 얻으니, 하늘에서 허수아비 무수히 떨어져 내리거늘 문득 깨달으니 남가일몽이라.\n허옹가 보고 몽사를 이르니, 허옹가 하는 말이, “그러할시 분명하면 아마도 잉태할 듯하나, 꿈과 같을진대 허수아비 떼 낳을 듯하네. 그리하나 앞으로 닥쳐올 일을 보리라.”이러구러 10삭이 차매 실옹가 아내 몸이 곤하여 침석에 누워 해태하는데, 진양성중가가조(晉陽城中家家稠)*에 개구리 해산하듯, 도야지 새끼 낳듯 무수히 펴 낳는데, 하나 둘 셋 넷 부지기수로다. 이렇듯이 해산하니 보던 바 처음이요, 듣던 바 처음이라, 실옹가 마누라 좋아라고 괴로움을 모르고 길러 내더라. 이같이 즐겨 할 제 실옹가는 하릴없이 세간·처자 빼앗기고 팔자 없는 곤장 맞고 세상에 살아 무엇 하랴. 애고애고, 내 팔자야. 죽장망혜 단표자로 만첩청산 들어가니 산은 높아 천봉이요, 골은 깊어 만 학이라. 인적은 고요하고 수목은 삼렬(森列)한데, 때마침 삼춘(三春)이라.\n출림비조(出林飛鳥) 산새들은 쌍거쌍래 날 아들 제, 슬피 우는 저 두견은 나의 심회 자아내어 화총에 눈물 뿌려 점점이 맺어 두고불여귀(不如歸)를 일을 삼으니, 슬프다. 이런 공산(空山) 중에 아무리 철석간장이라도 아니 울고 못 하리라. 이렇듯 슬피 울 제한 곳을 바라보니 층암절벽상에 백발 도사 높이 앉아 청려장을 옆에 끼고 반송 가지를 휘어잡고 노래로 하는 말이, “후회막급이로다. 하늘이 주신 죄를 수원수구(誰怨誰咎)*하단 말가.” 실옹가 듣기를 다하여, 천방지방 도사 앞에 급히 나아가 합장 배례하며 공손히 하는 말이, “이놈의 죄를 생각하면 천사(千死)라도 무석(無惜)*이요 만사(萬死)라도 무석이나, 명령하신 도덕 하에 제발 살려 주오. 당상의 늙은 모친, 규중의 어린 처자 다시 보게 하옵소서. 원견지*하온 후는 돌아가도 여한이 없을까 하나이다. 제발 살려 주옵소서.”갖은 방법으로 애걸하니 도사 하는 말이, “천지간에 몹쓸 놈아, 인제도 팔십 당년 늙은 모친 냉돌방에 구박할까. 불도를 능멸할까. 너 같은 몹쓸 놈은 응당 죽일 것이로되, 정상이 가긍하고 너의 처자 불쌍한 고로 방송하나니, 돌아가 개과천선하라.”\n하며, 부적을 써 주며 가로되,“이 부적을 몸에 붙이고 네 집에 돌아가면 괴이한 일이 있으리라.”하고 인홀불견(因忽不見)* 간데없거늘, 실옹이 재빨리 돌아와서 제집 문전 다다르니, 고루거각(高樓巨 閣) 높은 집에 청풍명월 맑은 경은 옛 놀던 풍경이라. 담장 안에 홍련화는 나를 보고 반기는 듯, 영산홍아 잘 있더냐, 자산홍아 무사하냐. 옛일을 생각하니 각금시이작비(覺今是而昨非)*로 옛집을 다시 찾아오니 죽을 마음 전혀 없다. “가소롭다 허옹가야, 이제도 네가 옹가라 장담할까?”하며 들어가니, 마누라 이 거동을 보고 심히 대경실색하여 하는 말이,“애고애고 좌수님, 저놈 천살* 맞았는지 또 와서 지랄하고 들어오니, 이 일을 어찌하리까.”이러할 즈음에 방에 있던 옹가 간데없고 짚 한 묶음이 놓여 있고, 허옹가의 자식들도 문득 허수아비 되니, 가중 제인이 박장대소하더라.\n/ 좌수가 부인 보고 하는 말이,“마누라, 그새 허수아비 자식을 저렇듯 무수히 낳았으니, 그놈과 한가지로 얼마나 좋아하였는가. 한 상에 밥도 먹었는가?”부인이 어처구니없어 묵묵부답하고 방 안에 돌아다니며 허옹가의 자식 살펴보니, 이리 보아도 허수아비, 저리 보아도 허수아비 떼가 분명하다. 부인이 일변은 반갑고 일변은 부끄러워하더라. 도승의 술법을 탄복하여, 옹 좌수 모친께 효성하고, 불도를 공경하여 개과천선하니 그 어짊을 칭찬하더라.\n- 작자 미상, 「옹고집전」\n*한 무제 승로반: 중국의 한 무제가 이슬을 받기 위해 만든 쟁반. *의율정배: 법에 따라 귀양을 보냄.\n*대곤삼십도: 큰 곤장으로 삼십 대를 때림. *차소위락미지액이로다: 이것이 눈앞에 닥친 재앙이구나.\n*진양성중가가조: 진양성 안에 집이 빽빽하게 들어서 있음을 뜻함. *수원수구: 누구를 원망하며 누구를 탓함.\n*무석: 억울하지 않음. *원견지: 보기를 원함.\n*인홀불견: 갑자기 사라짐.\n*각금시이작비: 중국 도연명의 「귀거래사」에 나오는 말로, 지금은 옳고 지난날은 그릇되었음을 깨달았다는 뜻.\n*천살: 불길한 별의 이름. 강력한 액운을 말함.",

  "passage": "[앞부분 줄거리] ‘나’는 재개발로 인해 이제 곧 사라지게 될 고향 산동네를 찾아가면서 어린 시절의 기억을 떠올린다. 나는 낡은 털신 밑에서 뽀드득거리는 소리가 나도록 성큼성큼 무릎을 들어 발걸음을 옮겼다. 그리고 아홉 가구가 함께 쓰는 변소 문을 열고 문턱에 올라 두 번씩이나 푸드덕푸드덕\n[A] 몸서리를 치며 오줌을 갈겼다. 이빨을 위아래로 서너 번 맞부딪치며 뽑아내는 오줌 줄기가 원뿔형으로 딱딱하게 굳은 언 똥에 둔탁하게 달라붙는 소리가 들렸다. 곧이어 따스한 오줌 세례를 받은 언 똥이 물컹물컹하게 녹아내리는 소리를 눈을 지그시 감고 듣다가 김이 되어 무럭무럭 콧속을 파고드는 지린내에 코를 쫑긋거리며 돌아나온 것까지는 좋았다.\n바지춤을 추스르며 김장독을 가지런히 묻어 둔 곁을 어정어정 걸어 나오다가 발끝으로 눈 덮인 가 마니때기 밑에서 뭔가 묵직한 것을 밟았다. 가마니때기 속에 발을 담근 채 눈을 푹 뒤집어쓰고 벽에 기대 있던 그 기다란 물체는 고개를 발딱 젖히는가 싶더니 옆으로 풀썩 쓰러졌다. 눈이 털려 나간 그 물체는 공사판에서 쓰는 빠루라는 연장이었다. 어른 엄지보다도 굵은 그 기다란 쇠뭉치는 지렛대로 쓰였는데 끝이 물음표처럼 생겼고 또 갈래가 져서 대못 같은 것을 빼는 데 아주 쓸모가 있었다. 그런데 그 빠루가 넘어지면서 하필이면 땅속에 묻지 않고 그냥 바깥에 놔둔 조그마한 짠지 단지를 스치자 뚜껑은 두 동강이 나 떨어졌고 몸통에는 왕금이 좌악 그어졌다. 금은 갔지만 그 짠지 단지가 당장 두 쪽으로 갈라질 것 같진 않았다.\n하지만 그 갈라진 틈새에서는 시금털털한 김치 냄새를 풍기는 국물이 쨀끔쨀끔 새어 나오고 있었다. 사태는 명백하고도 돌이킬 수가 없었다. 일어나서는 안 되는 일을 저지른 것이었다. 나는 삭풍이 부는 황량한 벌판으로 변한 마당 가에 서서 힘이 쭈욱 빠져 나간 두 어깨를 거느리며 고개를 젖혀 하늘을 바라보았다. 오오, 하느님 지금 무슨 일이 벌어진 것입니까! 그러나 무거운 눈을 밤새 다 털어 버린 새벽하늘은 너무 높이 올라가 있어 내 혼잣소리가 도저히 닿을 수 없었다. 고개를 숙였다. 나는 시치미를 떼고 누워 있는 그 시커먼 빠루가 마치 마녀의 주문을 받아 밤새 뿌린 눈송이를 덮고 위장한 채 기다리다가 내 발길을 일부러 잡아채지나 않았는가 하는 엉뚱한 의심이 들 정도였다. 나는 어린애답지 않게 몹시 피로하다는 생각이 들었던 듯하다.\n그것은 내가 그 순간 헐떡이고 있었던 이유를 적절하게 해명해 줄 수 있었다. 피로하다는 것, 이루 말할 수 없는 피로감…… 하긴 어찌 피로하지도 않고 감쪽같이 기절할 수 있겠는가. 바로 그때 내가 피로해야 하는 목적은 두말할 나위 없이 기절하는 것이었다. 기절이라도 하고 나면 이 세상에 뭔가가 달라져 있겠지, 혹은 최소한 모면의여지는 남겠지 하는 맹렬한 위안이 달라붙었다. 동시에 그 피로감은 어쨌든 세상에 대한 것이라는 게 명백해졌다. 변소에서 오줌보를 비우고 돌아서기까지 나는 너무나 생생했고, 빠루를 밟고 나서 갑자기 피로감을 느끼기까지 불과 십여 초가 흐르는 동안 나는 아무 일도 하지 않았다. 따라서 그 피로감이란 육체적 고단함에서 비롯된 게 아니라 정신적 흔들림에서 우러난 것이 분명했다. 그런 의미에서 그 피로감은 어른에게나 해당하는 피로였다.\n한편으로는 그 피로감은 몹시 물리치기 어려운 불길함을 품고 있었다. 몇 해 전 길게 뺀 혓바닥 위에 거꾸로 올려놓은 박탄-D 병의 밑바닥을 손으로 탁탁 두들겨 가며 쥐어짠 두어 방울의 알싸한 액체로는 도저히 풀 수 없을 것이라는 확신마저 어렸다. 그리고 무엇보다도 앞으로도 오랫동안 그 피로감을 떨쳐 낼 수 없을 것이라는 지루한 예감이 그날 어슴푸레한 새벽에 덮친 절망감의 핵심이었다. 문 간통에서 두 번째 집구석에 사는 술주정뱅이 고물 장수 순심이 아부지의 노상 흐느적거리는 두 팔과 술 때문에 항상 짓물러져 있는 눈자위가 눈앞에 어른거렸다. 아저씨도 나처럼 피로해서 그랬을까? [중략 부분 줄거리] ‘나’는 깨진 짠지 항아리를 눈 속에 파묻고 눈사람을 만들어 증거 인멸을 시도한다.\n하지만 눈이 녹으면 곧 비밀이 탄로 날 것이라는 생각이 들자 ‘나’는 그날 하루 동안 가출을 감행하고 좁은 뒷골목과 더러운 곳만 골라서 배회하다 결국 집으로 돌아가게 된다. 그러곤 어느덧 해 질 녘…… 이미 비밀이 다 까발려졌을 아홉 가구 집으로 돌아갔다. 대문간 앞에서 나는 심호흡을 몇 번이고 했다. 엄마한테 연탄집게로 맞으면 안 되는데 싶은 생각뿐이었다. 하지만 내가 대문간 앞을 흐르는 시궁창을 가로지르는 돌다리를 건너갔지만 아무도 나를 보고 아는 체하는 사람이 없었다. 내게 일제히 안됐다는 시선을 던지며 몰려들었어야 할 사람들이 평소와 다름없이 냄비를 들고 왔다 갔다 했고, 문짝에 기대 입을 가리고 웃었으며, 수돗가에 몰려나와 쌀을 일며 화기애애하게 얘기를 나누고 있었다. 심지어 수돗가에서 시래기를 다듬다 마주친 엄마도 너 점심 굶고 어디 갔다 왔니, 하는 지청구조차 내리지 않았다.\n나는 무척 혼돈스러웠다. 사람들이 나를 더 곤혹스럽게 만들기 위해 일부러 짜고 그러는 것도 같았다. 나는 얼른 눈사람을 천연덕스럽게 세워 두었던 변소통 쪽을 돌아다보았다. 거기엔 아무것도 없었다. 눈사람은 깨끗이 치워져 있었다. 물론 흉측한 몰골을 드러내고 있어야 할 짠지 단지도 눈에 띄지 않았다. 도대체 무슨 일이 일어난 것일까? 나는 나를 둘러싼 세계가 너무도 낯설게 느껴졌다. 내가 짐작하고 또 생각하는 세계하고[가]실제 세계 사이에는 이렇듯 머나먼 거리가 놓여 있었던 것이다. 그 거리감은 사실 이 세계는 나와는 상관없이 돌아간다는 깨달음, 그러므로 나는 결코 주변으로 둘러싸인 중심이 아니라는 아슴푸레한 깨달음에 속한 것이었다. 더 이상 나를 상대하지도 혼내지도 않는 세계가 너무나 괴물스럽고 슬퍼서 싱거운 눈물이라도 흘려야 직성이 풀릴 듯했다.\n하긴 눈물 서너 방울쯤 짜내는 것은 일도 아니었으니까. 난 시래기 줄기가 매달린 처마 밑에 서서 몇 방울 떨구며 소리 없이 울었다. 차라리 그 깨진 단지라도 제자리를 지키고 있었다면 혼은 나더라도 나는 혼돈스럽지도 불안해하지도 않았을 것 아닌가. “뭘 잘했다고 소리 없이 눈물을 꼭꼭 짜니? 정초부터 에밀 못 잡아먹어서 그러니? 넉살 좋게 단지를 깨뜨려 눈사람 속에 파묻을 생각은 어찌했담.”엄마가 물에 젖은 손으로 내 볼따구니를 야무지게 잡아 비틀며 어이가 없다는 듯 픽 웃음을 지었다. 그 얼얼함이 내 균형 감각을 바로잡아 주었다. 아주머니들의 웃음소리 사이에서 나는 울음을 딱 그쳤다. 그러고는 어른처럼 땅을 쿵쾅거리며 뛰쳐나와 이 골목 저 골목을 헤집으며 어딘가를 향해 가슴이 터져라고 마구 달리고 또 달렸다. 그렇게 컸다. “그래 딴 데는 안 들르고?”“오다가 저기 전에 살던 기찻집이라고 있어요. 옛날 침례교회 밑에 말예요.”“으응, 있었지.”“거기 뭐 좀 볼 게 있어서 들어가려다 개 조심이라고 씌어 있어서 제대로 보지도 못하고 나왔어요.\n보니깐 너무 바뀌었어요. 지붕도 기와에서 슬래브로 바뀌고 마당 쪽까지 집을 새로 지어서 반지하까 지 치면 이층이나 다름없대요.” 형이 고개를 건성으로 주억거렸다. “형, 조합일 보면 보수는 좀 나와요?”“돈?”“예.”“정식으로 받는 급료는 한 푼도 없지. 하지만 나야 큰돈은 못 만지지만 청탁이 큰 이권 사업이 물렸으니 잘만 하면 떡고물깨나 묻힐 수 있는 자리지, 그 자리가. 근데 너 참아버님 틀사진 가지러 왔다며 아랫집엔 안 들를 거니?”“그만둘까 봐요. 대낮부터 벌겋게 술도 마시고…… 또 불쑥 찾아간다는 게좀그렇잖아요. 돈 삼만 원 건네주는 건데 엄마가 말한 대로 온라인 이용하는 게 낫죠 뭐.”“그건 또 그래. 그럼 나랑 같이 마을버스 타고 내려갈래? 지하철 타려면. 아니면, 나랑 조합 사무실에들러서 커피나 마시며 이곳 돌아가는 얘기나 좀 듣고 가든지.”\n“듣긴요 뭘. 형이 어련히 잘 알아서 해 줄까.”“내가 해주긴 뭘. 네가 딱지를 팔고 싶다든지 아니면 그냥 입주를 하겠다든지 가부간에 결정을 내리면 내가 아무튼 최고 시세로 되도록 다리는 놔줄 순 있겠지. 내 생각엔 니가 어머니를 모시고 있으니까 당장 현찰이 필요한 게 아니라면 이리저리 굴려서 분양받을 때까지 기다렸다가 처분하는 게 장땡인데.”“예…… 엄마가 결정을 할 거예요. 전 심부름이나 몇 번 하면 되겠죠 뭐.”\n- 김소진, 「눈사람 속의 검은 항아리」",

  "passage": "(가)\n죽은 줄 알았던 매화나무 가지에, 구슬 같은 꽃방울을 맺혀 주는 쇠잔한 눈 위에, 가만히 오는 봄기운은 아름답기도 합니다. 그러나 그밖에 다른 하늘에서 오는 알 수 없는 향기는, 모든 꽃의 죽음을 가지고 다니는 쇠잔한 눈이 주는 줄을 아십니까.\n구름은 가늘고 시냇물은 옅고 가을 산은 비었는데, 파리한 바위 사이에 실컷 붉은 단풍은 곱기도합니다. 그러나 단풍은 노래도 부르고 울음도 웁니다. 그러한 ‘자연의 인생’은 가을바람의 꿈을 따라 사라지고 기억에만 남아 있는, 지난여름의 무르녹은 녹음이 주는 줄을 아십니까. 일경초(一莖草)*가 장륙금신(丈六金身)*이 되고, 장륙금신이 일경초가 됩니다.\n[A]\n천지는 한 보금자리요, 만유(萬有)는 같은 소조(小鳥)입니다.\n나는 자연의 거울에 인생을 비춰 보았습니다.\n고통의 가시덤불 뒤에, 환희의 낙원을 건설하기 위하여 님을 떠난, 나는 아아 행복입니다.\n- 한용운, 「낙원은 가시덤불에서」\n*일경초: 한해살이풀.\n*장륙금신: 일 장 육 척인 불상의 신장(身長)을 이름.\n(나)\n산이라 해서 다 크고 높은 것은 아니다\n다 험하고 가파른 것은 아니다\n어떤 산은 크고 높은 산 아래\n시시덕거리고 웃으며 나지막이 엎드려 있고\n또 어떤 산은 험하고 가파른 산자락에서\n슬그머니 빠져 동네까지 내려와\n부러운 듯 사람 사는 꼴을 구경하고 섰다\n그리고는 높은 산을 오르는 사람들에게\n순하디순한 길이 되어 주기도 하고\n남의 눈을 꺼리는 젊은 쌍에게 짐짓\n따뜻한 사랑의 숨을 자리가 되어 주기도 한다\n그래서 낮은 산은 내 이웃이던\n간난이네 안방 왕골자리처럼 때에 절고\n그 누더기 이불처럼 지린내가 배지만\n눈개비나무 찰피나무며 모싯대 개쑥에 덮여\n곤줄박이 개개비 휘파람새 노랫소리를\n듣는 기쁨은 낮은 산만이 안다\n사람들이 서로 미워서 잡아 죽일 듯\n이빨을 갈고 손톱을 세우다가도\n칡넝쿨처럼 머루 넝쿨처럼 감기고 어우러지는\n사람 사는 재미는 낮은 산만이 안다\n사람이 다 크고 잘난 것만이 아니듯\n다 외치며 우뚝 서 있는 것이 아니듯\n산이라 해서 모두 크고 높은 것은 아니다\n모두 흰 구름을 겨드랑이에 끼고\n어깨로 바람 맞받아치며 사는 것은 아니다\n- 신경림, 「산에 대하여」\n(다)\n달사(達士)*는 이상할 것이 없으나 속인(俗人)은 의심스러운 것투성이다. 이른바 본 것이 적으면 이상하게 생각되는 것이 많은 것이다. 그러나 달사라고 해서 어찌 사물을 쫓아다니며 눈으로 보았겠는가? 하나를 들으면 눈으로 열 가지를 떠올리고 열 가지를 보면 마음에 백 가지를 펼치고 보니 수많은 이상야릇한 것들은 도리어 사물에 붙은 것이고 나와는 상관이 없는 것이다. 그러므로 마음은 한가롭고 여유가 있어 무궁무진하게 맞대응할 수 있다. 본 것이 적은 사람은 백로를 기준 삼아 까마귀를 비웃고 물오리를 기준 삼아 학의 긴 다리가 위태롭다고 생각한다. 사물 자체는 이상할 것이 없는데 저 혼자 의심해 화를 내며 한 가지라도 생각과 다르면 만물을 모조리 비방한다. 아! 저 까마귀를 보라. 그 날개보다 더 검은색이 없긴 하나 얼핏 옅은 황금색이 돌고, 다시 연한 녹색으로 반짝인다.\n햇볕이 비추면 자주색으로 솟구치다, 눈이 어른어른하면 비취색으로도 변한다. 그러므로 내가 비록 푸른 까마귀라고 말해도 괜찮은 것이고 다시 붉은 까마귀라고 말해도 상관없는 것이다. 저 사물은 본디 정해진 색이 없는데도 내가 눈으로 먼저 정해 버리는 것이다. 어찌 그 눈에서만 판정할 따름이랴? 보지도 않으면서 마음속에서 미리 판정해 버린다. 슬프다! 까마귀를 검은색으로 고정한 것도 충분한데 다시금 까마귀를 갖고 세상의 온갖 색을 고정하려 하는구나. 까마귀가 과연 검기는하다. 그러나 누가 다시 이른바 푸르고 붉은 색이 검은색 안에 깃들어 있는 빛깔인 줄 알겠는가? 검은 것을 일러 어둡다고 하는 자는 비단 까마귀를 알지 못하는 것뿐 아니라 검은색도 모르는 것이다. 왜냐? 물은 깊고 그윽하기 때문에 비출 수 있고, 옻칠은 검기 때문에 비춰 볼 수 있는 것이다.\n그러므로 빛깔[色]이 있는 function normalize(str,keepHyphen){
  let s=(str||'').toString().trim().toLowerCase();
  s=s.replace(/[‐-―－・·‧/]/g,'-');
  s=s.replace(/\s+/g,'');
  s=s.replace(/[\[\]\(\)\{\}<>《》「」『』.,'"“”‘’:;!?~…·]/g,'');
  if(!keepHyphen) s=s.replace(/-/g,'');
  return s;
}
function match(list,val){const v=normalize(val);if(!v)return false;return list.some(a=>normalize(a)===v);}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}

function up(el,cls){while(el&&el.nodeType===1){if(el.classList&&el.classList.contains(cls))return el;el=el.parentElement;}return null;}
function goTo(el){if(!el)return;try{el.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){el.scrollIntoView()}}

let slot=0;
const html=DATA.map(d=>{
  const ps=d.passage.split('\n').filter(x=>x.trim()).map(x=>'<p>'+esc(x)+'</p>').join('');
  const bl=d.blanks.map(b=>{
    const s=slot++;
    return '<div class="brow"><div class="blabel">'+esc(b.label)+'</div>'
      +'<input type="text" data-slot="'+s+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="답 입력">'
      +'<div class="rt" data-rt="'+s+'"></div></div>';
  }).join('');
  const cond=d.conditions.length?'<div class="cond"><b>&lt;조건&gt;</b><br>'+d.conditions.map(c=>'· '+esc(c)).join('<br>')+'</div>':'';
  const view=d.view?'<div class="view"><div class="vl">&lt; 보 기 &gt;</div>'+esc(d.view).replace(/・/g,'<br>・')+'</div>':'';
  return '<div class="q" id="q'+d.n+'">'
   +'<div class="qhead"><div class="qn">'+d.n+'번</div><div class="tag">'+esc(d.area)+'</div>'
   +'<div class="tag">'+esc(d.type)+'</div><div class="pts">'+d.pts+'점</div>'
   +'<div class="src">'+esc(d.source)+'</div></div>'
   +'<div class="passage" id="p'+d.n+'">'+ps+'</div>'
   +'<button class="pmore" data-p="'+d.n+'">지문 전체 펼치기 ▾</button>'
   +'<div class="prompt">'+esc(d.prompt)+'</div>'+view+cond+bl
   +'<div class="sol" id="s'+d.n+'"><div class="h">정답</div><div class="b">'+esc(d.answer)+'</div>'
   +(d.intent?'<div class="s"><b>출제 의도</b> '+esc(d.intent)+'</div>':'')
   +(d.rubric?'<div class="s"><b>채점 기준</b> '+esc(d.rubric)+'</div>':'')
   +'</div></div>';
}).join('');
document.getElementById('list').innerHTML=html;
document.getElementById('nav').innerHTML=DATA.map(d=>'<button class="nav" data-n="'+d.n+'">'+d.n+'</button>').join('');

const FLAT=[];DATA.forEach(d=>d.blanks.forEach(b=>FLAT.push({q:d.n,b:b})));
const inputs=Array.prototype.slice.call(document.querySelectorAll('input[data-slot]'));

function save(){const o={name:document.getElementById('name').value,v:inputs.map(i=>i.value)};
  try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(!o)return;
  document.getElementById('name').value=o.name||'';(o.v||[]).forEach((v,i)=>{if(inputs[i])inputs[i].value=v});}catch(e){}}
load();
inputs.forEach(i=>i.addEventListener('input',()=>{save();paintNav()}));
document.getElementById('name').addEventListener('input',save);

function paintNav(){
  document.querySelectorAll('.nav').forEach(btn=>{
    const n=+btn.getAttribute('data-n');
    if(graded)return;
    const idx=FLAT.map((f,i)=>[f,i]).filter(x=>x[0].q===n).map(x=>x[1]);
    var _d=idx.every(function(i){return inputs[i].value.trim()!==''});
    if(_d)btn.classList.add('done');else btn.classList.remove('done');
  });
}
paintNav();

document.getElementById('nav').addEventListener('click',e=>{
  const b=up(e.target,'nav');if(!b)return;
  goTo(document.getElementById('q'+b.getAttribute('data-n')));
});
document.addEventListener('click',e=>{
  const b=up(e.target,'pmore');if(!b)return;
  const p=document.getElementById('p'+b.getAttribute('data-p'));
  const open=p.style.maxHeight==='none';
  p.style.maxHeight=open?'340px':'none';
  b.textContent=open?'지문 전체 펼치기 ▾':'지문 접기 ▴';
});

let result=null;
document.getElementById('grade').addEventListener('click',()=>{
  if(!document.getElementById('name').value.trim()){toast('이름을 먼저 입력하세요');return;}
  let correct=0;const per={};
  FLAT.forEach((f,i)=>{
    const ok=match(f.b.accept,inputs[i].value);
    inputs[i].classList.remove('ok','no');inputs[i].classList.add(ok?'ok':'no');
    document.querySelector('[data-rt="'+i+'"]').textContent=ok?'○':'✕';
    document.querySelector('[data-rt="'+i+'"]').style.color=ok?'#15803d':'#b91c1c';
    if(ok)correct++;
    if(!per[f.q])per[f.q]=[];per[f.q].push(ok);
  });
  graded=true;
  document.querySelectorAll('.nav').forEach(btn=>{
    const n=+btn.getAttribute('data-n');const a=per[n]||[];
    btn.classList.remove('done');
    btn.classList.add(a.every(Boolean)?'ok':'no');
  });
  let pts=0;DATA.forEach(d=>{const a=per[d.n]||[];pts+=Math.round(d.pts*a.filter(Boolean).length/a.length)});
  result={correct:correct,pts:pts};
  document.getElementById('score').textContent=correct+' / '+TOTAL+'칸  ·  '+pts+'점';
  const rate=Math.round(correct/TOTAL*100);
  document.getElementById('line').textContent='정답률 '+rate+'%  ·  '+(rate>=90?'훌륭합니다':rate>=70?'조금만 더':'복습이 필요합니다');
  document.getElementById('banner').style.display='block';
  document.getElementById('showSol').disabled=false;
  document.getElementById('copy').disabled=false;
  try{document.getElementById('banner').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){document.getElementById('banner').scrollIntoView()}
});

document.getElementById('showSol').addEventListener('click',()=>{
  const on=document.querySelector('.sol').style.display==='block';
  document.querySelectorAll('.sol').forEach(s=>s.style.display=on?'none':'block');
  document.getElementById('showSol').textContent=on?'해설 보기':'해설 숨기기';
});

document.getElementById('copy').addEventListener('click',()=>{
  if(!result)return;
  const wrong=[];DATA.forEach(d=>{const b=document.querySelectorAll('#q'+d.n+' input.no');if(b.length)wrong.push(d.n)});
  const t='[김현석 약술 논술 7회 결과]\n👤 '+document.getElementById('name').value
    +'\n🎯 '+result.pts+'점 / 100점'
    +'\n📊 '+result.correct+' / '+TOTAL+'칸 ('+Math.round(result.correct/TOTAL*100)+'%)'
    +'\n❌ 틀린 문항: '+(wrong.length?wrong.join(', ')+'번':'없음');
  copyText(t);
});
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('복사되었습니다. 카톡에 붙여넣으세요')},function(){legacyCopy(t)});
  }else{legacyCopy(t);}
}
function legacyCopy(t){
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.opacity='0';
    document.body.appendChild(ta);
    const r=document.createRange();r.selectNodeContents(ta);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok?'복사되었습니다. 카톡에 붙여넣으세요':'복사 실패 - 길게 눌러 복사하세요');
  }catch(e){toast('복사 실패 - 길게 눌러 복사하세요');}
}
if(document.getElementById('list').innerHTML.replace(/\s/g,'')===''){
  document.getElementById('list').innerHTML='<div class="card" style="color:#b91c1c">문제를 불러오지 못했습니다. 브라우저를 업데이트한 뒤 다시 열어 주세요.</div>';
}
</script></body></html>
