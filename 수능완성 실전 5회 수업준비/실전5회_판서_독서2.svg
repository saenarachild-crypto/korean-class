<svg viewBox="0 0 1640 900" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Pen Script','Gaegu',cursive" style="width:100%;height:auto;display:block;border-radius:14px;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#164531"/><stop offset="1" stop-color="#0f3324"/></linearGradient></defs><rect x="0" y="0" width="1640" height="900" rx="18" fill="url(#bg)"/><rect x="10" y="10" width="1620" height="880" rx="12" fill="none" stroke="#3a5a48" stroke-width="8"/><text x="820.0" y="78" fill="#ffe486" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">🎨 볼츠의 매체 미학</text><line x1="440.0" y1="96" x2="1200.0" y2="96" stroke="#ffe486" stroke-width="3" stroke-linecap="round"/><path d="M420.0,70 Q280.0,150 240.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><path d="M1220.0,70 Q1360.0,150 1400.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><rect x="110" y="180" width="300" height="80" rx="16" fill="none" stroke="#ff9db2" stroke-width="3"/><text x="260" y="230" fill="#ff9db2" font-size="26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">오라의 몰락</text><rect x="470" y="180" width="300" height="80" rx="16" fill="none" stroke="#9ad8ff" stroke-width="3"/><text x="620" y="230" fill="#9ad8ff" font-size="26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">매체 의존 사회</text><rect x="850" y="180" width="300" height="80" rx="16" fill="none" stroke="#a8e6a1" stroke-width="3"/><text x="1000" y="230" fill="#a8e6a1" font-size="26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">감성학 전환</text><rect x="1240" y="180" width="300" height="80" rx="16" fill="none" stroke="#ffe486" stroke-width="3"/><text x="1390" y="230" fill="#ffe486" font-size="26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">예술의 혁신</text><line x1="410" y1="220" x2="470" y2="220" stroke="#ffe486" stroke-width="3.5" stroke-linecap="round"/><polyline points="455,226 470,220 455,214" fill="none" stroke="#ffe486" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="770" y1="220" x2="850" y2="220" stroke="#ffe486" stroke-width="3.5" stroke-linecap="round"/><polyline points="835,226 850,220 835,214" fill="none" stroke="#ffe486" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="1150" y1="220" x2="1240" y2="220" stroke="#ffe486" stroke-width="3.5" stroke-linecap="round"/><polyline points="1225,226 1240,220 1225,214" fill="none" stroke="#ffe486" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="300" fill="#7fe0c8" font-size="24" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">베냐민 : 복제 → 오라 몰락</text><text x="470" y="300" fill="#7fe0c8" font-size="24" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">문자 → 이미지 매체</text><text x="850" y="300" fill="#7fe0c8" font-size="24" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">관조 → 감성적 지각</text><text x="1240" y="300" fill="#7fe0c8" font-size="24" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">소멸 아닌 매체 혁신</text><rect x="150" y="380" width="1340" height="180" rx="18" fill="none" stroke="#f4f4ec" stroke-width="2.5"/><text x="180" y="430" fill="#f4f4ec" font-size="30" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">◆ 기존 미학  vs  감성학(매체 미학)</text><text x="180" y="485" fill="#9ad8ff" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">기존 : 존재·진리·아름다움 → &#x27;작품&#x27; 자체 분석 / 해석·관조</text><text x="180" y="532" fill="#a8e6a1" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">감성학 : &#x27;작품–수용자 관계&#x27; → 매체·전달·체험 / 참여·아이디어</text><rect x="300" y="610" width="1040" height="210" rx="20" fill="none" stroke="#ffe486" stroke-width="2.5"/><text x="330" y="662" fill="#ffe486" font-size="30" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">핵심 개념 정리</text><text x="360" y="712" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 오라 = 원본만의 고고한 분위기 (㉠ 몰락)</text><text x="360" y="758" fill="#f4f4ec" font-size="26" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• 구텐베르크 은하계 몰락 = &#x27;고급 문화&#x27;의 몰락(문자 소멸 X)</text><text x="360" y="802" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">• ㉡ 근대적 예술의 종말 → 미디어 환경 디자인 중시</text></svg>