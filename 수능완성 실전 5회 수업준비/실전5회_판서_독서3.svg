<svg viewBox="0 0 1640 900" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Pen Script','Gaegu',cursive" style="width:100%;height:auto;display:block;border-radius:14px;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#164531"/><stop offset="1" stop-color="#0f3324"/></linearGradient></defs><rect x="0" y="0" width="1640" height="900" rx="18" fill="url(#bg)"/><rect x="10" y="10" width="1620" height="880" rx="12" fill="none" stroke="#3a5a48" stroke-width="8"/><text x="820.0" y="78" fill="#ffe486" font-size="44" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">⚖️ 사회 통제를 보는 세 관점</text><line x1="440.0" y1="96" x2="1200.0" y2="96" stroke="#ffe486" stroke-width="3" stroke-linecap="round"/><path d="M420.0,70 Q280.0,150 240.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><path d="M1220.0,70 Q1360.0,150 1400.0,250" fill="none" stroke="#ffe486" stroke-width="2.5" stroke-dasharray="4 10"/><text x="820.0" y="150" fill="#f4f4ec" font-size="28" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">사회 통제 = 규범 보존을 위한 모든 것 (규범을 무엇으로 보는가?)</text><rect x="90" y="210" width="470" height="560" rx="20" fill="none" stroke="#9ad8ff" stroke-width="3"/><text x="325.0" y="258" fill="#9ad8ff" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">① 합의적 관점</text><text x="116" y="310" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">규범 = 구성원의</text><text x="116" y="362" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">&#x27;합의&#x27;의 산물</text><text x="116" y="414" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">사회 질서·화합의 핵심</text><text x="116" y="466" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">일탈 = 규범 위반·</text><text x="116" y="518" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">역할 방기</text><text x="116" y="570" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 통제는 &#x27;정당성&#x27; O</text><text x="325.0" y="748" fill="#7fe0c8" font-size="23" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">체계 유지에 기여</text><rect x="585" y="210" width="470" height="560" rx="20" fill="none" stroke="#ff9db2" stroke-width="3"/><text x="820.0" y="258" fill="#ff9db2" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">② 갈등 이론적</text><text x="611" y="310" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">규범 = 특권 집단이</text><text x="611" y="362" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">권력 없는 집단 지배·</text><text x="611" y="414" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">이익 보호하는 &#x27;수단&#x27;</text><text x="611" y="466" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">통제 = 억압 장치</text><text x="611" y="518" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 정당성 확보 어려움</text><text x="611" y="570" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">일탈 = 정치·사회적</text><text x="820.0" y="748" fill="#7fe0c8" font-size="23" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">함의를 지님</text><rect x="1080" y="210" width="470" height="560" rx="20" fill="none" stroke="#a8e6a1" stroke-width="3"/><text x="1315.0" y="258" fill="#a8e6a1" font-size="32" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">③ 상호 작용론적</text><text x="1106" y="310" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">규범의 성격 규정 X</text><text x="1106" y="362" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">일상 상호작용에서</text><text x="1106" y="414" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">자연스럽게 나타남</text><text x="1106" y="466" fill="#ffe486" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ 규범 &#x27;인식·행동&#x27;</text><text x="1106" y="518" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">이 중요</text><text x="1106" y="570" fill="#f4f4ec" font-size="25" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">주관적 해석→반응→</text><text x="1315.0" y="748" fill="#7fe0c8" font-size="23" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">교정 = 통제</text></svg>