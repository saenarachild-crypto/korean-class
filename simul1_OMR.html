<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>마침내 모의고사 시뮬 1회 OMR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: rgba(124,44,62,0.15); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #faf6f3;
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
      -webkit-text-size-adjust: 100%;
    }
    .header {
      background: linear-gradient(135deg, #7c2c3e, #5a1f2c);
      color: white;
      padding: 16px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .header h2 { font-size: 19px; }
    .info-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .info-card label { font-weight: 600; color: #7c2c3e; display: block; margin-bottom: 6px; }
    .info-card input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #d8c8cc;
      border-radius: 14px;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      background: #fff;
    }
    .section {
      background: white;
      border-radius: 24px;
      padding: 10px 8px;
      margin-bottom: 16px;
    }
    .section-header {
      font-size: 16px;
      font-weight: bold;
      padding: 8px 6px;
      border-bottom: 2px solid #f0e2e5;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7c2c3e;
    }
    .question-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 2px;
      border-bottom: 1px solid #f5ecee;
    }
    .question-num {
      width: 26px;
      flex: 0 0 26px;
      font-weight: 700;
      color: #7c2c3e;
      font-size: 15px;
      text-align: center;
    }
    .choices {
      display: flex;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .choice {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      padding: 10px 0;
      border: 1.5px solid #d8c8cc;
      border-radius: 40px;
      background: white;
      font-weight: bold;
      font-size: 15px;
      color: #444;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      font-family: inherit;
    }
    .choice.selected {
      background: #7c2c3e;
      border-color: #7c2c3e;
      color: white;
    }
    .choice.disabled { opacity: 0.45; }
    .mark-buttons {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
      margin-left: 4px;
    }
    .mark-btn {
      width: 28px;
      height: 34px;
      border-radius: 14px;
      border: 1.5px solid #d8c8cc;
      background: white;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      font-weight: bold;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      font-family: inherit;
      padding: 0;
    }
    .mark-btn.active {
      background: #7c2c3e;
      color: white;
      border-color: #7c2c3e;
    }
    @media (max-width: 380px) {
      body { padding: 8px; }
      .question-num { width: 22px; flex: 0 0 22px; font-size: 14px; }
      .choice { font-size: 14px; padding: 9px 0; }
      .mark-btn { width: 24px; height: 32px; font-size: 12px; }
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 40px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      font-family: inherit;
      touch-action: manipulation;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-primary { background: #7c2c3e; color: white; }
    .btn-kakao { background: #fee500; color: #3c1e1e; }
    .btn-warning { background: #ff9f4a; color: #2c1518; }
    .score-banner {
      background: #fff8f5;
      border: 2px solid #7c2c3e;
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .score-banner.show { display: block; }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      font-size: 13px;
      max-width: 88%;
      text-align: center;
      z-index: 2000;
    }
    .toast.show { opacity: 1; }
    .timer-text { font-size: 13px; font-weight: bold; color: #d04141; margin-top: 8px; }
    .attempt-text { font-size: 12px; color: #7c2c3e; font-weight: 700; margin-bottom: 5px; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      text-align: center;
    }
    #report-text {
      width: 100%;
      height: 210px;
      margin: 14px 0 0;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 12px;
      -webkit-appearance: none;
      appearance: none;
    }
    .hidden { display: none; }
    .time-box {
      background: white;
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .time-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .time-item label { font-size: 13px; color: #7c2c3e; font-weight: 600; }
    .time-item input {
      width: 100%;
      padding: 9px;
      border: 1.5px solid #d8c8cc;
      border-radius: 12px;
      margin-top: 4px;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      background: #fff;
    }
    .link-box { text-align: center; margin-top: 14px; padding-bottom: 24px; }
    .link-box a {
      display: block;
      padding: 12px 16px;
      border: 1.5px solid #7c2c3e;
      border-radius: 30px;
      text-decoration: none;
      color: #7c2c3e;
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
      background: #fff;
    }
    #fatalError {
      display: none;
      background: #fff1f1;
      border: 2px solid #d04141;
      color: #a02020;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="header">
  <h2>마침내 모의고사 시뮬 1회</h2>
  <div style="font-size: 12px; margin-top:4px;">공통(1~34번) · 최대 10회 채점 · 채점 간 5분 대기</div>
</div>

<div id="fatalError"></div>

<div class="score-banner" id="scoreBanner">
  <div class="attempt-text" id="attemptDisplay">📌 남은 채점 횟수: 10회</div>
  <div style="font-size: 32px; font-weight:800;"><span id="scoreCorrect">0</span>/34</div>
  <div id="scoreText">정답률 0%</div>
  <div id="wrongList" style="color:#d04141; margin-top:6px; font-size:14px;"></div>
  <div id="cooldownTimer" class="timer-text hidden"></div>
</div>

<div class="info-card">
  <label>📛 학생 이름</label>
  <input type="text" id="studentName" placeholder="실명 입력" autocomplete="off" autocapitalize="off">
</div>

<div class="time-box">
  <div style="font-weight:700; color:#7c2c3e;">⏱️ 지문별 소요 시간 기록 (선택)</div>
  <div class="time-grid">
    <div class="time-item"><label>독서 1</label><input type="text" inputmode="numeric" data-tidx="0" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>독서 2</label><input type="text" inputmode="numeric" data-tidx="1" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>독서 3</label><input type="text" inputmode="numeric" data-tidx="2" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>독서 4</label><input type="text" inputmode="numeric" data-tidx="3" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>문학 1</label><input type="text" inputmode="numeric" data-tidx="4" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>문학 2</label><input type="text" inputmode="numeric" data-tidx="5" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>문학 3</label><input type="text" inputmode="numeric" data-tidx="6" class="time-input" placeholder="분"></div>
    <div class="time-item"><label>문학 4</label><input type="text" inputmode="numeric" data-tidx="7" class="time-input" placeholder="분"></div>
  </div>
</div>

<div class="section">
  <div class="section-header"><span>공통 문항 (1~34)</span> <span id="commonProgress">0/34</span></div>
  <div id="commonList"></div>
</div>

<button id="submitBtn" class="btn btn-primary">✅ 채점하기</button>
<button id="kakaoBtn" class="btn btn-kakao">💬 카톡 공유 (보고서)</button>
<button id="resetBtn" class="btn btn-warning">🔄 ★ 새로 시작하기 (초기화) ★</button>

<div class="link-box">
  <a href="https://goe2427-my.sharepoint.com/:b:/g/personal/pure173_jeonghyeonh_goe_go_kr/IQCZlEU0KYxwTqGwKx6XHGv3Ad-3DFiyIBg5ws2ap9Yy_Eg?e=munSGD" target="_blank" rel="noopener">📄 문제지 보기</a>
  <a id="solutionLink" href="https://goe2427-my.sharepoint.com/:b:/g/personal/pure173_jeonghyeonh_goe_go_kr/IQAz34R5gipeRJISFq7u2-GDAYmcsnXLSIp_IpF6oIwsIlI?e=9jFQsE" target="_blank" rel="noopener" style="display:none;">📑 해설지 보기</a>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <h3>📋 결과 리포트</h3>
    <textarea id="report-text" readonly></textarea>
    <button id="copyReportBtn" class="btn btn-primary">📋 클립보드 복사</button>
    <button id="closeModalBtn" class="btn btn-warning">닫기</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  'use strict';

  var $ = function(sel){ return document.querySelector(sel); };

  // ── 안전 저장소 (시크릿모드/쿠키차단 인앱브라우저 대응) ──────────────
  var mem = {};
  var store = {
    get: function(k){
      try { return window.localStorage.getItem(k); }
      catch(e){ return (k in mem) ? mem[k] : null; }
    },
    set: function(k, v){
      try { window.localStorage.setItem(k, v); }
      catch(e){ mem[k] = v; }
    }
  };

  var ANSWERS = [4,3,4,1,5,2,4,4,1,3,1,5,2,1,3,5,5,2,1,4,2,5,5,4,3,4,4,1,3,2,2,5,3,5];
  var TOTAL = 34;
  var MAX_ATTEMPTS = 10;
  var COOLDOWN_MIN = 5;
  var STORAGE_KEY = 'machimnae_simul_1_omr';

  function filled(n, v){
    var a = [];
    for(var i=0; i<n; i++) a.push(v);
    return a;
  }

  function blankState(){
    return {
      answers: filled(TOTAL, 0),
      attemptCount: 0,
      cooldownUntil: 0,
      name: '',
      lastResult: null,
      marks: filled(TOTAL, ''),
      times: filled(8, '')
    };
  }
  var state = blankState();
  var timerInterval = null;

  function buildQuestions(){
    var html = '';
    for(var i=1; i<=TOTAL; i++){
      html += '<div class="question-row">'
        + '<div class="question-num">' + i + '</div>'
        + '<div class="choices">';
      for(var v=1; v<=5; v++){
        html += '<button type="button" class="choice" data-idx="' + (i-1) + '" data-val="' + v + '">' + v + '</button>';
      }
      html += '</div><div class="mark-buttons">'
        + '<button type="button" class="mark-btn" data-mark="o" data-idx="' + (i-1) + '">○</button>'
        + '<button type="button" class="mark-btn" data-mark="t" data-idx="' + (i-1) + '">△</button>'
        + '<button type="button" class="mark-btn" data-mark="x" data-idx="' + (i-1) + '">✕</button>'
        + '</div></div>';
    }
    $('#commonList').innerHTML = html;
  }

  function updateSolutionLink(){
    var link = $('#solutionLink');
    if(!link) return;
    link.style.display = (state.attemptCount >= 3) ? 'block' : 'none';
  }

  function updateUI(){
    var isLocked = state.attemptCount > 0;
    var choices = document.querySelectorAll('.choice');
    for(var i=0; i<choices.length; i++){
      var btn = choices[i];
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var val = parseInt(btn.getAttribute('data-val'), 10);
      if(state.answers[idx] === val) btn.className = 'choice selected' + (isLocked ? ' disabled' : '');
      else btn.className = 'choice' + (isLocked ? ' disabled' : '');
    }
    var marks = document.querySelectorAll('.mark-btn');
    for(var j=0; j<marks.length; j++){
      var mb = marks[j];
      var midx = parseInt(mb.getAttribute('data-idx'), 10);
      mb.className = (state.marks[midx] === mb.getAttribute('data-mark')) ? 'mark-btn active' : 'mark-btn';
    }
    var tin = document.querySelectorAll('.time-input');
    for(var k=0; k<tin.length; k++){
      var t = tin[k];
      var tidx = parseInt(t.getAttribute('data-tidx'), 10);
      t.value = state.times[tidx] || '';
      t.disabled = isLocked;
    }
    var answered = 0;
    for(var m=0; m<state.answers.length; m++){ if(state.answers[m] > 0) answered++; }
    $('#commonProgress').innerHTML = answered + '/' + TOTAL;
    updateSolutionLink();
  }

  function computeScore(){
    var correct = 0, wrongs = [];
    for(var i=0; i<TOTAL; i++){
      if(state.answers[i] !== 0 && state.answers[i] === ANSWERS[i]) correct++;
      else wrongs.push(i+1);
    }
    return { correct: correct, wrongs: wrongs, percent: ((correct/TOTAL)*100).toFixed(1) };
  }

  function performGrading(){
    var r = computeScore();
    state.lastResult = r;
    $('#scoreBanner').className = 'score-banner show';
    $('#scoreCorrect').innerHTML = r.correct;
    $('#scoreText').innerHTML = '정답률 ' + r.percent + '%<br><span style="font-size:11px;">※ 정답은 공개되지 않습니다</span>';
    $('#wrongList').innerHTML = r.wrongs.length
      ? '❌ 틀린 문항: ' + r.wrongs.join(', ') + ' (' + r.wrongs.length + '개)'
      : '✅ 만점! 축하합니다';
  }

  function updateCooldownUI(){
    var now = new Date().getTime();
    var submitBtn = $('#submitBtn');
    var cooldownDiv = $('#cooldownTimer');
    var remaining = Math.max(0, MAX_ATTEMPTS - state.attemptCount);
    $('#attemptDisplay').innerHTML = '📌 남은 채점 횟수: ' + remaining + '회';

    if(state.attemptCount >= MAX_ATTEMPTS){
      submitBtn.disabled = true;
      submitBtn.innerHTML = '채점 횟수 소진';
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      cooldownDiv.className = 'timer-text hidden';
      updateUI();
      return;
    }

    if(state.cooldownUntil > now){
      var remainSec = Math.floor((state.cooldownUntil - now)/1000);
      cooldownDiv.className = 'timer-text';
      cooldownDiv.innerHTML = '⏳ 다음 채점까지: ' + Math.floor(remainSec/60) + '분 ' + (remainSec%60) + '초';
      submitBtn.disabled = true;
      if(!timerInterval){
        timerInterval = setInterval(function(){
          if(new Date().getTime() >= state.cooldownUntil){
            clearInterval(timerInterval); timerInterval = null;
          }
          updateCooldownUI();
        }, 1000);
      }
    } else {
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      cooldownDiv.className = 'timer-text hidden';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '✅ 채점하기';
    }
    updateUI();
  }

  function getReportText(){
    var currentName = state.name || '미입력';
    var attemptNum = state.attemptCount || 1;
    var oList = [], tList = [], xList = [];
    for(var i=0; i<state.marks.length; i++){
      if(state.marks[i] === 'o') oList.push(i+1);
      if(state.marks[i] === 't') tList.push(i+1);
      if(state.marks[i] === 'x') xList.push(i+1);
    }
    var markSection = '📌 [문항 분류 기록]\n'
      + '• ○ (확신): ' + (oList.join(', ') || '없음') + '\n'
      + '• △ (애매): ' + (tList.join(', ') || '없음') + '\n'
      + '• ✕ (모름): ' + (xList.join(', ') || '없음');

    var labels = ['독서1','독서2','독서3','독서4','문학1','문학2','문학3','문학4'];
    var timeLines = [];
    for(var j=0; j<state.times.length; j++){
      if(state.times[j]) timeLines.push('• ' + labels[j] + ': ' + state.times[j] + '분');
    }
    var timeSection = timeLines.length
      ? '\n⏱️ [지문별 소요 시간]\n' + timeLines.join('\n') + '\n━━━━━━━━━━━━━━━━━━━━━━'
      : '';

    if(!state.lastResult){
      return '[마침내 모의고사 시뮬 1회 결과]\n━━━━━━━━━━━━━━━━━━━━━━\n👤 이름: ' + currentName + '\n⚠️ 아직 채점 전입니다.\n━━━━━━━━━━━━━━━━━━━━━━';
    }
    return '[마침내 모의고사 시뮬 1회 결과]\n'
      + '━━━━━━━━━━━━━━━━━━━━━━\n'
      + '👤 이름: ' + currentName + '\n'
      + '🔥 채점 회차: ' + attemptNum + '회차\n'
      + '🎯 총점: ' + state.lastResult.correct + '/' + TOTAL + '점\n'
      + '📊 정답률: ' + state.lastResult.percent + '%\n'
      + '❌ ' + (state.lastResult.wrongs.length ? '오답: ' + state.lastResult.wrongs.join(', ') + ' (' + state.lastResult.wrongs.length + '개)' : '만점! 축하합니다 🎉') + '\n'
      + '━━━━━━━━━━━━━━━━━━━━━━' + timeSection + '\n'
      + markSection + '\n'
      + '━━━━━━━━━━━━━━━━━━━━━━\n'
      + '※ 정답은 공개되지 않습니다.';
  }

  function onSubmit(){
    var nameVal = $('#studentName').value.replace(/^\s+|\s+$/g, '');
    if(!nameVal){ alert('이름을 입력하세요'); return; }
    state.name = nameVal;
    if(state.attemptCount >= MAX_ATTEMPTS){ alert('채점 횟수를 모두 사용했습니다. 초기화 후 다시 시도하세요.'); return; }
    var now = new Date().getTime();
    if(state.cooldownUntil > now){ alert('다음 채점까지 ' + Math.ceil((state.cooldownUntil-now)/60000) + '분 기다려주세요.'); return; }
    var answered = 0;
    for(var i=0; i<state.answers.length; i++){ if(state.answers[i] > 0) answered++; }
    if(answered < TOTAL && !confirm('미입력 문항이 ' + (TOTAL-answered) + '개 있습니다. 그래도 채점할까요?')) return;
    state.attemptCount++;
    performGrading();
    state.cooldownUntil = new Date().getTime() + COOLDOWN_MIN*60*1000;
    $('#studentName').disabled = true;
    saveToLocal();
    updateCooldownUI();
    showToast('채점 완료!');
  }

  function resetAll(){
    if(!confirm('모든 답안과 채점 기록이 초기화됩니다. 다시 시작하시겠습니까?')) return;
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    state = blankState();
    $('#studentName').value = '';
    $('#studentName').disabled = false;
    $('#scoreBanner').className = 'score-banner';
    $('#cooldownTimer').className = 'timer-text hidden';
    $('#submitBtn').disabled = false;
    $('#submitBtn').innerHTML = '✅ 채점하기';
    updateUI();
    saveToLocal();
    showToast('초기화 완료! 답안을 입력하세요.');
  }

  function showReportModal(){
    $('#report-text').value = getReportText();
    $('#reportModal').className = 'modal-overlay show';
  }
  function closeModal(){ $('#reportModal').className = 'modal-overlay'; }

  function copyFullReport(){
    var text = getReportText();
    var ta = $('#report-text');
    var done = false;
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text);
        done = true;
      }
    } catch(e){}
    if(!done){
      try {
        ta.removeAttribute('readonly');
        ta.focus();
        ta.setSelectionRange(0, text.length);
        document.execCommand('copy');
        ta.setAttribute('readonly', 'readonly');
        done = true;
      } catch(e2){}
    }
    showToast(done ? '리포트가 복사되었습니다! 카톡에 붙여넣기 하세요.' : '자동 복사가 안 됩니다. 위 내용을 길게 눌러 복사하세요.');
  }

  var toastTimer = null;
  function showToast(msg){
    var toast = $('#toast');
    toast.innerHTML = msg;
    toast.className = 'toast show';
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.className = 'toast'; }, 2400);
  }

  function saveToLocal(){
    store.set(STORAGE_KEY, JSON.stringify(state));
  }

  function loadFromLocal(){
    var raw = store.get(STORAGE_KEY);
    if(!raw) return;
    try {
      var data = JSON.parse(raw);
      state.answers = data.answers || filled(TOTAL, 0);
      state.attemptCount = data.attemptCount || 0;
      state.cooldownUntil = data.cooldownUntil || 0;
      state.name = data.name || '';
      state.lastResult = data.lastResult || null;
      state.marks = data.marks || filled(TOTAL, '');
      state.times = data.times || filled(8, '');

      $('#studentName').value = state.name;
      $('#studentName').disabled = state.attemptCount > 0;
      if(state.attemptCount > 0 && state.lastResult){
        $('#scoreBanner').className = 'score-banner show';
        $('#scoreCorrect').innerHTML = state.lastResult.correct;
        $('#scoreText').innerHTML = '정답률 ' + state.lastResult.percent + '%';
        var w = state.lastResult.wrongs || [];
        $('#wrongList').innerHTML = w.length ? '❌ 틀린 문항: ' + w.join(', ') : '✅ 만점';
      }
    } catch(e){}
  }

  function onListClick(e){
    var node = e.target || e.srcElement;
    while(node && node !== document && node.tagName !== 'BUTTON'){
      node = node.parentNode;
    }
    if(!node || node.tagName !== 'BUTTON') return;
    var idx = parseInt(node.getAttribute('data-idx'), 10);
    if(isNaN(idx)) return;

    if(node.getAttribute('data-val') !== null){
      if(state.attemptCount > 0){
        showToast('\u274c 채점 후에는 답안을 수정할 수 없습니다. "새로 시작하기"를 눌러주세요.');
        return;
      }
      var val = parseInt(node.getAttribute('data-val'), 10);
      state.answers[idx] = (state.answers[idx] === val) ? 0 : val;
    } else if(node.getAttribute('data-mark') !== null){
      var mark = node.getAttribute('data-mark');
      state.marks[idx] = (state.marks[idx] === mark) ? '' : mark;
    } else return;

    updateUI();
    saveToLocal();
  }

  function onTimeInput(e){
    var input = e.target || e.srcElement;
    var tidx = parseInt(input.getAttribute('data-tidx'), 10);
    state.times[tidx] = input.value.replace(/^\s+|\s+$/g, '');
    saveToLocal();
  }

  function bindEvents(){
    $('#submitBtn').onclick = onSubmit;
    $('#resetBtn').onclick = resetAll;
    $('#kakaoBtn').onclick = showReportModal;
    $('#copyReportBtn').onclick = copyFullReport;
    $('#closeModalBtn').onclick = closeModal;
    $('#commonList').onclick = onListClick;
    $('#studentName').onchange = function(){ state.name = this.value; saveToLocal(); };
    var tin = document.querySelectorAll('.time-input');
    for(var i=0; i<tin.length; i++){
      tin[i].oninput = onTimeInput;
      tin[i].onchange = onTimeInput;
    }
  }

  function init(){
    try {
      buildQuestions();
      loadFromLocal();
      bindEvents();
      updateUI();
      updateCooldownUI();
    } catch(err){
      var box = document.getElementById('fatalError');
      if(box){
        box.style.display = 'block';
        box.innerHTML = '⚠️ 화면을 불러오는 중 문제가 생겼습니다.<br>브라우저(크롬/사파리)로 열어 주세요.<br><span style="font-size:11px;color:#777;">' + (err && err.message ? err.message : err) + '</span>';
      }
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
